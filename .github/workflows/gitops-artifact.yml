name: gitops-artifact

# Builds gitops/ into an OCI artifact, cosign-signs it keyless with this
# workflow's OIDC identity, and only THEN moves the mutable tag Flux tracks.
# Step 4 of the 1->2->4->3 sequence in ansible/CLAUDE.md; step 3 points an
# OCIRepository at the result with spec.verify + matchOIDCIdentity.
#
# ⚠ WHY THE TAG IS MUTABLE (decided 2026-08-29, Appendix A "GitOps delivery").
# `latest` is deliberate, not laziness. The OCIRepository that pins the artifact
# version is itself COMMITTED INSIDE THE ARTIFACT, so an exact version pin is a
# fixed point: the cluster reconciles vN, whose manifest says vN, and can never
# learn that vN+1 exists. `ref.semver` escapes that too, but costs a full tag
# LISTING on every poll — through a tag list that cosign pollutes with
# `sha256-<digest>.sig` entries — and forces CI to mint a new version per push.
# A mutable tag is a single tag->digest resolve, and `ref.tag: latest` is stable
# text that never needs bumping. Renovate is NOT in this loop; it keeps its real
# job, the version pins INSIDE the manifests (calico_version, chart versions),
# which are not self-referential.

on:
  push:
    branches: [main]
    # Only what actually reaches the cluster. Docs edits under gitops/ still
    # touch this path filter, but --add-ignore-paths below keeps them out of the
    # artifact, and --reproducible means unchanged content yields an unchanged
    # digest — so Flux sees nothing new and does not reconcile.
    paths:
      - 'gitops/**'
      - '.github/workflows/gitops-artifact.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # push to GHCR
  id-token: write   # ⚠ REQUIRED for keyless cosign — without it `cosign sign`
                    # cannot mint an OIDC token and the signature step fails.

env:
  # Derived, never hardcoded: ghcr.io/nighlabs/homelab-infra/gitops
  OCI_REPO: ghcr.io/${{ github.repository }}/gitops

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Actions are SHA-pinned, not tag-pinned. A floating tag in the very
      # pipeline that establishes provenance would undercut the whole point —
      # anyone who can move `v4` moves what signs our artifacts. Renovate tracks
      # these via the trailing version comments.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the Flux CLI
        uses: fluxcd/flux2/action@889be9d6cc8afa8ed639e1e1ba4ab678e3b38d8c # v2.9.4

      - name: Set up cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. Push under an IMMUTABLE sha- tag. Flux never references this tag; it
      #    exists so a digest can be traced back to a commit, and so
      #    `ref.digest` (which takes precedence over `ref.tag`) has something to
      #    pin to as an emergency freeze.
      #
      #    --reproducible zeroes timestamps so identical content produces an
      #    identical digest. Without it every run mints a new digest and Flux
      #    reconciles on no actual change.
      #
      #    --add-ignore-paths APPENDS to the defaults (--ignore-paths would
      #    REPLACE them). Markdown is excluded: gitops/CLAUDE.md is documentation
      #    for humans, is not applied to the cluster, and would otherwise make
      #    every doc edit a new artifact.
      - name: Push the artifact
        id: push
        run: |
          set -euo pipefail
          digest=$(flux push artifact \
            "oci://${OCI_REPO}:sha-${GITHUB_SHA}" \
            --path=gitops \
            --source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --revision="${GITHUB_REF_NAME}@sha1:${GITHUB_SHA}" \
            --reproducible \
            --add-ignore-paths='**/*.md' \
            --annotations="org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --annotations="org.opencontainers.image.description=Flux-managed cluster state (gitops/) for homelab-infra" \
            --output json | jq -r '.digest')
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "pushed ${OCI_REPO}@${digest}"

      # 2. Sign the DIGEST, not a tag. A signature covers content, so it applies
      #    to every tag pointing at that digest — signing once covers both the
      #    sha- tag and the `latest` moved below.
      - name: Sign the artifact (keyless, GitHub OIDC)
        run: |
          set -euo pipefail
          cosign sign --yes "${OCI_REPO}@${{ steps.push.outputs.digest }}"

      # 3. ONLY NOW move the tag Flux tracks. Ordering is load-bearing: `latest`
      #    must never point at an unsigned digest, or Flux could fetch it in the
      #    window between push and sign and be refused by spec.verify — or worse,
      #    succeed if verification were ever misconfigured.
      - name: Move the mutable tag Flux tracks
        run: |
          set -euo pipefail
          flux tag artifact "oci://${OCI_REPO}:sha-${GITHUB_SHA}" --tag=latest

      - name: Summary
        run: |
          {
            echo "### gitops artifact published"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| repository | \`${OCI_REPO}\` |"
            echo "| digest | \`${{ steps.push.outputs.digest }}\` |"
            echo "| immutable tag | \`sha-${GITHUB_SHA}\` |"
            echo "| tag Flux tracks | \`latest\` |"
            echo
            echo "Verify locally:"
            echo '```sh'
            echo "cosign verify ${OCI_REPO}@${{ steps.push.outputs.digest }} \\"
            echo "  --certificate-identity-regexp='^https://github.com/${GITHUB_REPOSITORY}/' \\"
            echo "  --certificate-oidc-issuer=https://token.actions.githubusercontent.com"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
