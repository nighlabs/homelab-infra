# ACME via Cloudflare DNS-01 (ADR-0013): valid public certs with NO inbound —
# even internal-only services get real certs, and a wildcard serves the
# internal view too. The API token Secret is Ansible-seeded into the
# cert-manager namespace (bootstrap-secret tier — cert-manager sits upstream of
# ESO, so ESO can never supply it on a from-scratch rebuild; whether ESO later
# ADOPTS the Secret is open — docs/decisions/README.md, "Open questions").
#
# No spec.acme.email, deliberately: it's optional in ACME, Let's Encrypt ended
# expiry-notification mail in 2025 (cert-manager renews at 2/3 lifetime
# anyway), and omitting it keeps personal data out of a public repo.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      # The ACME account key — generated by cert-manager, lives only in-cluster.
      name: letsencrypt-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
---
# Staging twin: same solver, LE's staging endpoint. For testing issuance
# changes without burning production rate limits (5 duplicate certs/week).
# Nothing references it by default — point a test Certificate at it.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
