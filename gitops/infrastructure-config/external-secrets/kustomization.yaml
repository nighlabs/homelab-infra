apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No `namespace:` transformer — ClusterSecretStore is CLUSTER-SCOPED and a
# transformer would wrongly stamp it (the calico-bgp scar, see that header),
# and the ExternalSecrets live in their consumers' namespaces, not one.
resources:
  - clustersecretstores.yaml
  - platform-externalsecrets.yaml
