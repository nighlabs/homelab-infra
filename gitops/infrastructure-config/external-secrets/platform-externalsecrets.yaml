# ESO keeps the Ansible-seeded platform Secrets CURRENT (ADR-0038). Seed and sync
# are permanent partners, not a handover:
#
#   - bootstrap-cluster.yml CREATES each Secret from
#     homelab-platform-<cluster>, so a from-scratch rebuild has certificates and
#     storage before ESO exists;
#   - these ExternalSecrets then re-read the SAME fields and write only the
#     keys listed under `data`, so a rotation is one edit in 1Password.
#
# ⚠ creationPolicy: Merge is the whole contract. Merge never creates the Secret
# (Ansible owns existence and shape — e.g. the cephx `userID`, which is not a
# secret and is not synced here) and never deletes it, and ESO takes no
# ownerReference, so deleting an ExternalSecret cannot take cert-manager's
# token with it. Owner/CreateOrMerge were rejected for exactly those reasons: a
# Secret ESO created alone would lack `userID`. deletionPolicy: Retain (the
# default, pinned) keeps the last good value if the 1Password field vanishes.
#
# ⚠ refreshInterval: 24h, deliberately — not the 1h default. These rotate
# rarely and by hand, so the periodic refresh is only a drift backstop. Cost:
# 3 ExternalSecrets x 1 Resolve x 1/day = 3 calls/day against the shared
# 1,000/day account cap (ADR-0034). After a rotation, don't wait — force it
# (any change to the annotation's value triggers an immediate sync):
#   kubectl -n <ns> annotate externalsecret <name> force-sync=$(date +%s) --overwrite
#
# ⚠ refreshInterval governs the HAPPY path only. A failing sync ignores it and
# retries on controller-runtime's backoff (5ms doubling, capped at 1000s ≈
# 16.7 min), forever — see gitops/CLAUDE.md, "Retry behaviour".
#
# Remote refs are `<item>/<field>` in the store's vault; field labels are PLAIN
# here (the control-node loader is what suffixes them `_<cluster>`).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
spec:
  refreshPolicy: Periodic
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-platform
  target:
    # The Secret + key the committed ClusterIssuers reference
    # (../cert-manager/clusterissuers.yaml).
    name: cloudflare-api-token
    creationPolicy: Merge
    deletionPolicy: Retain
  data:
    - secretKey: api-token
      remoteRef:
        key: cert-manager/cloudflare_api_token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ceph-csi-rbd
  namespace: ceph-csi
spec:
  refreshPolicy: Periodic
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-platform
  target:
    name: ceph-csi-rbd
    creationPolicy: Merge
    deletionPolicy: Retain
  data:
    - secretKey: userKey
      remoteRef:
        key: ceph-csi/ceph_k8s_rbd_key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ceph-csi-cephfs
  namespace: ceph-csi
spec:
  refreshPolicy: Periodic
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-platform
  target:
    name: ceph-csi-cephfs
    creationPolicy: Merge
    deletionPolicy: Retain
  data:
    - secretKey: userKey
      remoteRef:
        key: ceph-csi/ceph_k8s_cephfs_key
