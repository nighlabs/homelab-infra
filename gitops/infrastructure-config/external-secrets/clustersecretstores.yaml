# Two stores, because a store names exactly ONE vault (ADR-0038). Both
# authenticate with the same per-cluster service account, whose IMMUTABLE grant
# is read_items on exactly these two vaults — bootstrap-cluster.yml asserts that
# before it seeds the token. Neither store can reach homelab-infra (Proxmox
# token, SSH keys, join tokens), nor another cluster's vaults: that is enforced
# by the grant, not by anything written here.
#
# ⚠ RATE LIMIT is the design constraint, not throughput: 1,000 requests/24h per
# ACCOUNT on Individual/Families, shared by every service account (ADR-0034).
# Store validation is free in steady state: the provider caches its client per
# store resourceVersion and its Validate() makes no call. Observed live
# 2026-10-05: 6 VaultsList at startup (2 stores; likely client rebuilds as the
# first status writes bump resourceVersion), then ZERO across store requeues.
# So the cost is a handful of vault lookups when the controller starts, plus
# one Resolve per ExternalSecret data entry per refresh. Budget lives with the
# ExternalSecrets.
#
# ⚠ No provider `cache:` block, deliberately. It would serve a force-sync from
# memory for up to its TTL, which is precisely the moment after a rotation when
# you want a fresh read. Revisit for the apps store if many ExternalSecrets
# ever read the same item.
---
# Bootstrap secrets that keep changing after bootstrap: cert-manager's DNS-01
# token and the two cephx keys. The control node reads the SAME fields to seed
# them at bootstrap, so the two writers agree by construction.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword-platform
spec:
  # ⚠ The boundary INSIDE the cluster: only the platform controllers'
  # namespaces may reference this store, so an app namespace cannot write an
  # ExternalSecret that pulls the Cloudflare token or a cephx key. Add a
  # namespace here only for a platform controller, never for an app.
  conditions:
    - namespaces:
        - cert-manager
        - ceph-csi
  provider:
    onepasswordSDK:
      # Per-cluster vault: the cluster name is substituted from
      # cluster-topology — a literal would point every cluster at testnode's.
      vault: homelab-platform-${cluster_name}
      auth:
        serviceAccountSecretRef:
          name: onepassword-service-account
          key: token
          namespace: external-secrets
---
# Ordinary application secrets. No conditions: any namespace may use it. Per-app
# isolation INSIDE a cluster (namespace-scoped SecretStores, or per-app
# conditions) is a decision for when apps/ has more than one tenant.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword-apps
spec:
  provider:
    onepasswordSDK:
      vault: homelab-apps-${cluster_name}
      auth:
        serviceAccountSecretRef:
          name: onepassword-service-account
          key: token
          namespace: external-secrets
