apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The CRD tier: CustomResourceDefinitions that must be Established BEFORE the
# controllers in ../infrastructure reconcile. Kept as its own tier (and its own
# Flux Kustomization, see deployment/<cluster>/crds.yaml) rather than folded into
# infrastructure/, so the ordering is explicit and nothing can double-own these
# objects.
#
# Only add a controller's CRDs here when the chart genuinely can't install them
# itself — that is the exception, not the rule. Calico qualifies because v3.32
# removed CRDs from the chart AND they exceed the client-side apply size limit.
resources:
  - calico
  # Gateway API standard-channel bundle: no chart installs it (NGF's chart
  # carries only NGF's own CRDs) and httproutes exceeds the client-side apply
  # size limit — both admission rules met. See gateway-api/crds.yaml's header.
  - gateway-api
  # ceph-csi-operator's five CRDs (ADR-0031). Meets the same admission rule the
  # hard way: `operatorconfigs` (536 KB) and `drivers` (505 KB) are each about
  # DOUBLE the client-side apply limit, and — unlike Calico — the chart offers no
  # toggle to skip them, so the whole operator is installed from vendored
  # manifests rather than Helm. See ceph-csi/kustomization.yaml's header.
  - ceph-csi
