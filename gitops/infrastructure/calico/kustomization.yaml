apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Force every resource into tigera-operator (also stamps the generated ConfigMap
# so it's co-located with the HelmRelease that reads it). Harmless on the
# cluster-scoped Namespace resource.
namespace: tigera-operator
resources:
  - namespace.yaml
  # eBPF dataplane prerequisite: in eBPF mode Calico implements Services itself
  # and must reach the API server without a ClusterIP (see that file's header,
  # and ADR-0024).
  #
  # NOTE: felixconfiguration.yaml lived here for stage 1 and was REMOVED at
  # stage 2 (2026-08-03), on purpose. It only disabled
  # bpfKubeProxyIptablesCleanupEnabled so Felix and k3s's embedded kube-proxy
  # wouldn't overwrite each other's iptables rules. With `disable-kube-proxy` in
  # the k3s config there is nothing to coexist with, and leaving cleanup off
  # would orphan kube-proxy's stale rules instead of letting Felix remove them.
  # Don't reintroduce it without also reverting that k3s config key.
  - kubernetes-services-endpoint.yaml
  - helmrepository.yaml
  - helmrelease.yaml
#
# NOTE: the BGP / LoadBalancer CRs are NOT here — they live in the sibling
# ../calico-bgp/ and are referenced from ../kustomization.yaml. That is forced by
# the `namespace:` transformer above: it stamps a namespace on everything it
# can't prove is cluster-scoped, and it only has schemas for core kinds. The
# Calico CRs are CRDs, so they'd come out carrying `namespace: tigera-operator`
# despite being cluster-scoped. See ../calico-bgp/kustomization.yaml.
# Generate the calico-values ConfigMap from the canonical values.yaml so the
# HelmRelease's valuesFrom has a stable target. disableNameSuffixHash is REQUIRED
# — without it kustomize appends a content hash to the name and the valuesFrom
# reference (a fixed name) would never resolve.
configMapGenerator:
  - name: calico-values
    files:
      - values.yaml
generatorOptions:
  disableNameSuffixHash: true

