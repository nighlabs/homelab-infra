# Calico (tigera-operator chart) values — THE single source of truth for how
# Calico is configured. Consumed two ways, deliberately from this one file so the
# Ansible-primed release and the Flux-managed release are byte-identical (clean
# adoption, no diff war — see ansible/CLAUDE.md §6 "Ansible installs, Flux adopts"):
#   1. Ansible (playbooks/bootstrap-cluster.yml) → kubernetes.core.helm
#      `values_files: [ this file ]` when it primes the release.
#   2. Flux → kustomization.yaml's configMapGenerator turns this into the
#      `calico-values` ConfigMap, which helmrelease.yaml reads via valuesFrom.
#
# The chart maps `installation:` straight onto the operator's Installation CR.
installation:
  cni:
    type: Calico
  calicoNetwork:
    # eBPF dataplane, replacing kube-proxy's service handling (ansible/CLAUDE.md
    # §7 item 17; trial + verification in docs/calico-ebpf-single-node-trial.md).
    # The reason is SOURCE IP, not throughput: under externalTrafficPolicy
    # Cluster, kube-proxy SNATs externally-originated traffic to the node IP and
    # the client address is gone before the pod sees it — unrecoverable at L7, so
    # NGF would log node IPs as clients forever. Verified on snoop-a2o
    # 2026-08-02: the pod's observed RemoteAddr went from the NODE's address to
    # the real off-cluster client the moment the dataplane flipped.
    #
    # Left at the default bpfExternalServiceMode (Tunnel) — DSR is deliberately
    # NOT enabled; it only optimises the return path and needs the fabric to let
    # nodes emit packets sourced from each other's IPs. It's a runtime
    # FelixConfiguration patch if we ever want it, so nothing here blocks that.
    linuxDataplane: BPF
    # ⚠ BGP IS THE POD DATAPLANE NOW (changed 2026-08-16; ansible/CLAUDE.md §7
    # item 13). Calico's VXLAN implementation uses no BGP at all, so this is not
    # "enabling a feature alongside the existing dataplane" — it takes BGP from
    # *not running* to *the sole mechanism for pod routing between nodes*.
    #
    # With one all-in-one node the mesh has no peers to form, so the flip is
    # trivially safe today. The first moment mesh routing carries real traffic is
    # when node 2 joins — plan that join as a dataplane event, not a capacity add.
    #
    # The node-to-node mesh (BGPConfiguration.nodeToNodeMeshEnabled, in
    # ../calico-bgp/) is what distributes pod CIDRs. The pfSense BGPPeer is
    # unrelated to that — it exists only to advertise LoadBalancer IPs off-cluster.
    bgp: Enabled
    ipPools:
      # cidr MUST equal k3s_cluster_cidr (group_vars/all/vars.yml) — Calico's pool
      # has to match k3s's cluster-cidr (design §4.1, guardrail §8). bootstrap-
      # cluster.yml asserts this equality before priming, so the two can't drift.
      - cidr: 10.42.0.0/16
        # No encapsulation: pod traffic goes on the wire as-is, routed by BGP.
        # Drops the ~50-byte VXLAN header and its per-packet encap/decap cost —
        # the actual reason for the migration. Requires every node on one subnet
        # (they are — §6 step 5) or a fabric that routes the pod CIDR; otherwise
        # cross-subnet pod traffic silently blackholes, which is exactly what
        # VXLANCrossSubnet used to paper over.
        encapsulation: None
        # Still Enabled: pod->internet traffic must be SNATed to the node IP,
        # because nothing outside the cluster has a route back to 10.42.0.0/16.
        # The BGPFilter deliberately keeps the pod CIDR off pfSense, so this is
        # not something BGP can substitute for.
        natOutgoing: Enabled
        nodeSelector: all()
    # Pin Calico to the node's InternalIP — which k3s already advertises as the
    # eth0/DMZ address (node-ip in k3s-config.yaml.j2). This keeps the real DMZ
    # subnet OUT of Git (honors the vaulted-topology guardrail) AND guarantees
    # Calico never autodetects the Ceph NIC (eth1).
    nodeAddressAutodetectionV4:
      kubernetes: NodeInternalIP
