# Catch-all 301 to https, bound ONLY to the http listener (sectionName). Apps
# never attach routes to :80 (its allowedRoutes is Same-namespace); they attach
# HTTPRoutes to the https listener and inherit this redirect for free.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https-redirect
  namespace: nginx-gateway
spec:
  parentRefs:
    - name: gateway
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
