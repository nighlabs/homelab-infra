apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# NO `namespace:` transformer here, on purpose — every resource carries its
# namespace explicitly. The transformer stamps a namespace on any CR it can't
# prove is cluster-scoped (see ../calico-bgp/kustomization.yaml for the scar);
# nothing here is cluster-scoped today, but Gateway-API adjacent CRs
# (GatewayClass, if it ever moved out of the chart) are exactly the kind that
# would get silently mangled.
resources:
  - namespace.yaml
  - ocirepository.yaml
  - helmrelease.yaml
  - gateway.yaml
  - httproute-redirect.yaml
