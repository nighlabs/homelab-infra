apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Infrastructure controllers, in dependency order as they arrive
# (docs/architecture.md §7): calico (CNI) first; then cert-manager,
# ceph-csi-operator, ESO, ... (no MetalLB — Calico BGP owns LB, ADR-0018).
resources:
  # Installs Calico (operator chart + shared values).
  - calico
  # Configures it: BGP CRs and the LoadBalancer IPAM pool. Separate directory because ../calico/ applies a `namespace:`
  # transformer that would wrongly stamp these cluster-scoped CRs — see that
  # directory's kustomization.yaml header.
  - calico-bgp
  # Gateway API implementation (ADR-0013): controller + the shared Gateway,
  # whose per-Gateway data plane gets its LoadBalancer IP from Calico's pool.
  # Gateway API CRDs are in ../crds/gateway-api (the crds tier this whole
  # Kustomization dependsOn), NOT installed by the chart.
  - nginx-gateway-fabric
  # Certificates (ADR-0013): controller only — its ClusterIssuers and the
  # wildcard Certificate are cert-manager.io CRs whose CRDs this very tier
  # installs, so they live in ../infrastructure-config (a separate Flux
  # Kustomization that dependsOn this one).
  - cert-manager
  # Persistent storage (ADR-0006): the ceph-csi-operator controller, against the
  # EXISTING Proxmox Ceph. Vendored upstream manifests rather than a HelmRelease
  # — forced, not preferred (ADR-0031): two of its CRD templates are each about
  # double the client-side apply limit and the chart has no toggle to skip them.
  # Its CRDs are therefore in ../crds/ceph-csi; its CRs and the two
  # StorageClasses are in ../infrastructure-config/ceph-csi.
  - ceph-csi-operator
  # Secrets (ADR-0034, ADR-0038): External Secrets Operator with the 1Password
  # SDK provider — no in-cluster secrets server, so nothing here depends on
  # cert-manager or on storage. The chart installs its own CRDs (ADR-0039); the
  # ClusterSecretStores and ExternalSecrets are in ../infrastructure-config.
  - external-secrets
