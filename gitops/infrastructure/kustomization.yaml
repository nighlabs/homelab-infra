apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Infrastructure controllers, in dependency order as they arrive
# (docs/architecture.md §7): calico (CNI) first; then cert-manager,
# ceph-csi-operator, ESO, ... (no MetalLB — Calico BGP owns LB, ADR-0018).
resources:
  # Installs Calico (operator chart + shared values).
  - calico
  # Configures it: BGP CRs, the LoadBalancer IPAM pool, and the #12890 RBAC
  # workaround. Separate directory because ../calico/ applies a `namespace:`
  # transformer that would wrongly stamp these cluster-scoped CRs — see that
  # directory's kustomization.yaml header.
  - calico-bgp
  # Gateway API implementation (ADR-0013): controller + the shared Gateway,
  # whose per-Gateway data plane gets its LoadBalancer IP from Calico's pool.
  # Gateway API CRDs are in ../crds/gateway-api (the crds tier this whole
  # Kustomization dependsOn), NOT installed by the chart.
  - nginx-gateway-fabric
