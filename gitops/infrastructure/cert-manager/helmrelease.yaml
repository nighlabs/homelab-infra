apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 1h
  # Explicit + stable per repo convention. Flux-only, no Ansible priming —
  # same as nginx-gateway-fabric. (Ansible DOES seed this controller's input,
  # the cloudflare-api-token Secret, but never touches the release.)
  releaseName: cert-manager
  chartRef:
    kind: OCIRepository
    name: cert-manager
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # ⚠ DNS-01 self-check MUST use public resolvers, permanently — this is not
    # a tuning knob. cert-manager pre-checks the _acme-challenge TXT before
    # asking LE to validate, and by default it asks the CLUSTER's resolver
    # chain (CoreDNS -> node DNS -> pfSense Unbound). Two problems: Unbound
    # negative-caches the NODATA from before the record existed (observed live
    # 2026-09-05: record in the zone, 1.1.1.1 resolving it, local resolver
    # returning nothing — issuance stuck on "not yet propagated"); and the
    # split-horizon design (ADR-0013) makes the internal view of this zone
    # PERMANENTLY diverge from the public one, while LE only ever validates
    # against public DNS. Check what LE checks.
    dns01RecursiveNameservers: "1.1.1.1:53,8.8.8.8:53"
    dns01RecursiveNameserversOnly: true
    crds:
      # cert-manager's CRDs are TEMPLATED by the chart (gated on this value),
      # not shipped in a crds/ dir — so the chart installs and upgrades them
      # itself, and they don't belong in the ../../crds tier (which is only for
      # CRDs no chart can install; see that tier's kustomization.yaml).
      enabled: true
      # Keep the CRDs (and so every Certificate/Issuer CR) if the release is
      # ever uninstalled — the chart default, pinned explicitly because it's
      # load-bearing: same "removing a CRD is a manual act" stance as the crds
      # tier's prune: false.
      keep: true
    # ClusterIssuers reference the cloudflare-api-token Secret in THIS
    # namespace (a ClusterIssuer resolves secretRefs in the cluster-resource
    # namespace, which defaults to the release namespace). The Secret is
    # Ansible-seeded — bootstrap-secret tier, upstream of ESO by definition.
