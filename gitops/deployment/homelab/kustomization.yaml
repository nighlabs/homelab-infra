apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The per-cluster Flux entrypoint. This is the directory the root `flux-system`
# Kustomization (sync.yaml) reconciles, so it is the ONE path Flux is told about
# — everything else in gitops/ is reached through the Kustomization CRs below.
#
# ⚠ SELF-MANAGING: source.yaml (the OCIRepository) and sync.yaml (the root
# flux-system Kustomization) are listed here on purpose. The root reconciles
# THIS directory, so it re-applies itself and its own source every pull — which
# is the whole mechanism by which a change to either heals from Git. Ansible
# primes both at bootstrap; Flux owns them thereafter.
#
# ⚠ THE DIRECTORY NAME IS THE CLUSTER KEY from ansible/inventory/nodes.yml
# (`homelab`), not a node name. `flux_sync_path` derives the sync path as
# `gitops/deployment/{{ cluster_name }}`, so renaming this directory silently
# points Flux at a path that doesn't exist — the GitRepository stays Ready
# (the repo cloned fine) while the flux-system Kustomization fails on a missing
# path. Rename the cluster key and this together, or neither.
#
# kustomize-controller would auto-generate an equivalent kustomization.yaml if
# this file were absent, which is exactly why it's here: with it, adding a
# fourth tier is a visible one-line diff instead of a directory listing quietly
# changing what Flux applies.
resources:
  - source.yaml
  - sync.yaml
  - crds.yaml
  - infrastructure.yaml
  - infrastructure-config.yaml
  - apps.yaml
