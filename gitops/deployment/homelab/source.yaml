# The signed OCI artifact Flux reconciles this cluster from — step 3 of the
# 1->2->4->3 GitOps-delivery sequence (ADR-0028; gitops/CLAUDE.md "How this
# tree reaches the cluster"). Replaces the GitRepository the FluxInstance used to generate
# from spec.sync: spec.sync has NO `verify` field (checked against the live CRD
# and the operator's main), so signature-gated delivery cannot go through it.
# Hence a sync-LESS FluxInstance plus this committed OCIRepository, which Ansible
# primes and Flux then adopts + drift-corrects — the same "Ansible primes, Flux
# adopts" handoff as Calico.
#
# ⚠ SELF-MANAGED: this file lives INSIDE ./deployment/homelab, the path the
# flux-system Kustomization (sync.yaml) reconciles, so Flux owns it after
# bootstrap. Treat an edit here like a CI secret — a bad or unsigned artifact
# reference is self-inflicted lockout, recovered only by re-running
# playbooks/flux-bootstrap.yml (which is why that play stays idempotent).
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m
  # ghcr.io/nighlabs/homelab-infra/gitops — public package, so NO pull secret.
  # If the repo/package ever goes private, add a BWS secret and set
  # spec.secretRef here (see ansible/BWS-SECRETS.md).
  url: oci://ghcr.io/nighlabs/homelab-infra/gitops
  ref:
    # The mutable tag CI moves only AFTER cosign-signing the digest — see the
    # workflow header in .github/workflows/gitops-artifact.yml for why `latest`
    # is deliberate and safe here. To FREEZE on a known-good artifact, replace
    # this with `digest: sha256:...` (digest takes precedence over tag).
    tag: latest
  # ⚠ THE POINT OF STEP 3. Reconciliation is gated on a keyless cosign signature
  # made by THIS repo's GitHub Actions OIDC identity — signed-by-this-workflow,
  # in-this-repo. matchOIDCIdentity is the same identity the workflow's own
  # `cosign verify` uses (certificate-identity-regexp + the GitHub OIDC issuer).
  # Flux 2.9 (source-controller >=1.9.0) verifies the cosign v3 sigstore-bundle
  # format the workflow produces; no keys to store or rotate.
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: "^https://token.actions.githubusercontent.com$"
        subject: "^https://github.com/nighlabs/homelab-infra/.*$"
