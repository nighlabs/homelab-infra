# Flux entrypoint for the infrastructure layer. Reconciled by the `flux-system`
# Kustomization (sync.yaml) off the signed OCIRepository (source.yaml), which
# reconciles THIS directory.
#
# Flux's first pass here is an ADOPTION, not an install: bootstrap-cluster.yml
# already primed the Calico CRDs, the tigera-operator Helm release, and the BGP
# CRs from these same committed files. See gitops/CLAUDE.md, "Calico — the
# 'Ansible primes, Flux adopts' pattern".
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  interval: 30m
  # Gate on the CRD tier: Calico v3.32 moved its CRDs out of the tigera-operator
  # chart, so the HelmRelease below fails outright ("ensure CRDs are installed
  # first") if it reconciles before they're Established. crds.yaml sets
  # `wait: true`, so this dependsOn gates on Established, not merely applied.
  dependsOn:
    - name: crds
  # ⚠ Artifact-root-relative (the OCI artifact root IS gitops/), so no ./gitops
  # prefix — the root Kustomization (sync.yaml) reconciles ./deployment/homelab
  # from the same artifact, and this tier lives at ./infrastructure within it.
  path: ./infrastructure
  prune: true
  wait: true
  timeout: 5m
  # Topology blinding (gitops/CLAUDE.md): the manifests under ./gitops/infrastructure
  # carry ${...} placeholders — ${bgp_peer_ip}, ${bgp_peer_asn}, ${cluster_asn},
  # ${lb_range}, ${k3s_api_ip} — and this is what fills them in. The Secret is
  # Ansible-seeded by bootstrap-cluster.yml (tier 2: needed before ESO exists,
  # and it configures the very LoadBalancer IP that ESO's dependency chain waits
  # on — that cycle is deliberate, see the root CLAUDE.md).
  #
  # ⚠ A missing key substitutes to the EMPTY STRING and reconciles as HEALTHY.
  # The only thing that turns that into a failure is the kustomize-controller
  # feature gate StrictPostBuildSubstitutions=true, which flux-bootstrap.yml
  # patches in AND asserts landed. Do not remove one without the other.
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-topology
  # Signed OCIRepository source: a GHA builds+pushes+cosign-signs the gitops
  # artifact and OCIRepository.spec.verify (source.yaml) gates reconciliation on
  # that signature.
  sourceRef:
    kind: OCIRepository
    name: flux-system
