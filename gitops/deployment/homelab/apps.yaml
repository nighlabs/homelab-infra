# Flux entrypoint for the workloads layer. dependsOn infrastructure so no app
# reconciles until Calico + the controllers are Ready (design §6 dependency
# order). ./gitops/apps is an empty `resources: []` today, so this reconciles to
# a no-op until the first workload lands.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 30m
  path: ./gitops/apps
  prune: true
  wait: true
  timeout: 5m
  dependsOn:
    - name: infrastructure
  # Present from the start even though ./gitops/apps has no ${...} placeholders
  # yet — the first app that needs one would otherwise substitute it to the empty
  # string, and with no postBuild block the StrictPostBuildSubstitutions gate
  # never even looks (substitution only runs when spec.postBuild is set). So the
  # gate would be silently absent on exactly the tier where a new placeholder is
  # most likely to be added. Same Ansible-seeded Secret as infrastructure.
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-topology
  # TODO (step 3): switch to a signed OCIRepository source — see the note in
  # infrastructure.yaml / gitops/CLAUDE.md "Not here yet".
  sourceRef:
    kind: GitRepository
    name: flux-system
