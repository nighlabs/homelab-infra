# Flux entrypoint for the infrastructure layer. INERT until the next milestone:
# the `flux-system` GitRepository it points at is created by the FluxInstance at
# Flux bootstrap (ansible/CLAUDE.md §6 step 4, not this step). Committed now so
# the repo structure is complete and Flux adopts the already-primed Calico on its
# first reconcile.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  interval: 30m
  # Relative to the GitRepository root. Assumes the source is the repo root; if
  # Flux bootstrap points the GitRepository at gitops/ instead, drop the prefix.
  path: ./gitops/infrastructure
  prune: true
  wait: true
  timeout: 5m
  # TODO (Flux bootstrap): switch this to a signed OCIRepository source — a GHA
  # builds+pushes+cosign-signs the gitops artifact, and OCIRepository.spec.verify
  # gates reconciliation on that signature. See gitops/CLAUDE.md "Not here yet".
  sourceRef:
    kind: GitRepository
    name: flux-system
