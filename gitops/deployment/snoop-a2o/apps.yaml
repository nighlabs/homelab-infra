# Flux entrypoint for the workloads layer. Same inert-until-Flux-bootstrap note
# as infrastructure.yaml. dependsOn infrastructure so no app reconciles until
# Calico + the controllers are Ready (design §6 dependency order).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 30m
  path: ./gitops/apps
  prune: true
  wait: true
  timeout: 5m
  dependsOn:
    - name: infrastructure
  # TODO (Flux bootstrap): switch to a signed OCIRepository source — see the note
  # in infrastructure.yaml / gitops/CLAUDE.md "Not here yet".
  sourceRef:
    kind: GitRepository
    name: flux-system
