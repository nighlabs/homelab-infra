---
# ONE-SHOT: render the 1Password import file for the BWS -> 1Password cutover.
#
# ⚠ DELETE THIS PLAY once the cutover is done. It exists to move ~29 values
# across once, without retyping any of them, and it is the only thing in the
# repo that reads one store to populate another. ADR-0027's BWS migration had a
# `port-vault-to-bws.yml` of exactly this shape and deleted it the same day;
# do the same. Removal criteria: docs/decisions/0034-secrets-store-1password.md.
#
# Same shape as render-ceph-setup.yml and render-frr-config.yml, for the same
# reason: the target has no safe automation path, so DELIVERY is manual — but
# the CONTENT is generated, so nothing is transcribed by hand.
#
# Why rendered rather than written directly:
#   * Creating the item needs a WRITE credential, and the control-node service
#     account is read-only by design. The human already has write access as
#     themselves; nothing needs a second privileged token.
#   * 1Password's own `op item create --help` warns that assignment statements
#     "get logged in your command history, and can be visible to other
#     processes on your machine. If you're assigning sensitive values, use a
#     JSON template instead." The rendered file IS that template — the values
#     never appear in argv or in shell history.
#
# Run:
#   cd ansible && uv run ansible-playbook playbooks/render-1password-import.yml
#
# Output (git-ignored, 0700 dir / 0600 file):
#   ansible/.1password/<item>.json
#
# ⚠ That file is EVERY CREDENTIAL IN PLAINTEXT — the single most sensitive
# artifact this repo can produce. Delete it the moment the import succeeds.
# The play prints the exact commands, ending with the delete.
#
# Full procedure: ../SECRETS.md, "Migrating from Bitwarden".
- name: Render the 1Password import template
  hosts: localhost
  gather_facts: false
  vars:
    op_out_dir: "{{ playbook_dir }}/../.1password"

    # ⚠ Pinned to Bitwarden regardless of what group_vars says. The whole point
    # is to read the OLD store; defaulting to `secrets_backend` would, after
    # cutover, cheerfully render an import file out of 1Password to import into
    # 1Password.
    secrets_backend: "bitwarden"

    # Purpose sections. `id` must be unique within the item; `label` is what
    # 1Password displays. Ordered as they will appear.
    op_sections:
      - {id: "proxmox", label: "Proxmox"}
      - {id: "networks", label: "Networks"}
      - {id: "access", label: "Access"}
      - {id: "edge", label: "Edge"}
      - {id: "storage", label: "Storage"}
      - {id: "clusters", label: "Clusters"}
      - {id: "other", label: "Other"}

    # name -> section, first match wins. Anything unmatched lands in "other",
    # which is deliberately visible rather than silently dropped — a new secret
    # should show up somewhere obvious and get classified properly.
    op_section_rules:
      - {section: "proxmox", pattern: "^proxmox_"}
      - {section: "storage", pattern: "^ceph_(fs_name|mons|fsid|k8s_)"}
      - {section: "networks", pattern: "^(dmz_|dns_servers$|lb_range_base$|ceph_(subnet_base|vlan|bridge)$)"}
      - {section: "access", pattern: "^(ssh_authorized_keys$|frr_)"}
      - {section: "edge", pattern: "^(base_domain$|cloudflare_)"}
      - {section: "clusters", pattern: "^k3s_"}

    # CONCEALED vs STRING. ⚠ Listed EXPLICITLY, never pattern-guessed off
    # "token"/"key": `proxmox_api_token_id` is the id half of a credential and
    # is not itself secret, while `proxmox_api_token_secret` is — a `_token_`
    # rule would conceal the wrong one and, worse, look right. This list is the
    # 🔑 column of ../SECRETS.md and must stay in step with it.
    op_concealed_exact:
      - proxmox_api_token_secret
      - frr_master_password
      - cloudflare_api_token
      - ceph_k8s_rbd_key
      - ceph_k8s_cephfs_key
    # Open-ended by nature: one per cluster in inventory/nodes.yml.
    op_concealed_patterns:
      - "^k3s_token_"

  tasks:
    - name: Load secrets from the old store
      ansible.builtin.include_tasks: tasks/load-secrets.yml

    - name: Assert we are reading Bitwarden, not the store we are migrating to
      ansible.builtin.assert:
        that:
          - secrets_backend == 'bitwarden'
        fail_msg: >-
          This play must read the OLD store. secrets_backend resolved to
          '{{ secrets_backend }}'. Do not override it — see the note at the top
          of this file.
        quiet: true

    # ⚠ This play renders ONE item containing EVERY secret, titled op_items[0].
    # That is right for the migration — BWS had no items, just 29 flat secrets,
    # so they all land on `control-node`. It is wrong the moment op_items grows
    # (the ESO milestone adds `eso-service-accounts`), because the extra titles
    # would be silently ignored and their fields swept into the first item.
    # Refuse rather than mis-file credentials: by then this one-shot play should
    # already be deleted.
    - name: Assert there is exactly one target item to render
      ansible.builtin.assert:
        that:
          - op_items | length == 1
        fail_msg: >-
          op_items has {{ op_items | length }} entries
          ({{ op_items | join(', ') }}), but this play renders a single item
          holding every secret. It cannot decide which secret belongs to which
          item, and would silently put them all in '{{ op_items[0] }}'.
          ⚠ If you are past the initial migration, DELETE this play — it is
          one-shot (see the header, and ADR-0034's removal criteria). If you are
          still migrating, run it with the original single-item op_items.
        quiet: true

    # Single-expression Jinja loop — the repo's idiom (k3s_tokens in
    # group_vars/all/vars.yml) — because a task-level `vars:` entry referencing
    # `item` does not re-resolve per iteration under this ansible-core.
    #
    # `id` is set equal to `label` so the field is addressable as
    # `op read op://<vault>/<item>/<section>/<name>` later without a uuid.
    - name: Build the item fields
      vars:
        fields: >-
          {%- set out = [] -%}
          {%- for name in secret_names -%}
          {%- set ns = namespace(section='other') -%}
          {%- for rule in op_section_rules -%}
          {%- if ns.section == 'other' and name is match(rule.pattern) -%}
          {%- set ns.section = rule.section -%}
          {%- endif -%}
          {%- endfor -%}
          {%- set cn = namespace(concealed=(name in op_concealed_exact)) -%}
          {%- for pattern in op_concealed_patterns -%}
          {%- if name is match(pattern) -%}{%- set cn.concealed = true -%}{%- endif -%}
          {%- endfor -%}
          {%- set _ = out.append({
                'id': name,
                'label': name,
                'type': 'CONCEALED' if cn.concealed else 'STRING',
                'section': {'id': ns.section},
                'value': secrets[name]}) -%}
          {%- endfor -%}
          {{ out }}
      ansible.builtin.set_fact:
        op_import_fields: "{{ fields }}"
      no_log: true

    # Safe to print: names, sections and types — never values. This is the
    # review step, and it is the whole reason the play renders rather than
    # writes: you see the classification BEFORE anything reaches 1Password.
    - name: Show how each secret was classified
      ansible.builtin.debug:
        msg: >-
          {{ op_import_fields
             | map(attribute='label') | zip(op_import_fields | map(attribute='section') | map(attribute='id'),
                                            op_import_fields | map(attribute='type'))
             | map('join', ' -> ') | list }}

    - name: Assert nothing landed in the catch-all section
      vars:
        unclassified: >-
          {{ op_import_fields | selectattr('section.id', 'equalto', 'other')
             | map(attribute='label') | list }}
      ansible.builtin.assert:
        that:
          - unclassified | length == 0
        fail_msg: >-
          These secrets matched no section rule: {{ unclassified | join(', ') }}.
          They would import into a catch-all "Other" section, which is a fine
          place for nothing to live. Add a rule in op_section_rules (and decide
          whether each is CONCEALED) — then re-run.
        quiet: true

    - name: Ensure the output directory exists
      ansible.builtin.file:
        path: "{{ op_out_dir }}"
        state: directory
        mode: "0700"

    # Only the sections that actually hold a field — otherwise the catch-all
    # ships as a permanent empty "Other" section on the real item.
    - name: Render the import template
      vars:
        used: "{{ op_import_fields | map(attribute='section') | map(attribute='id') | unique | list }}"
      ansible.builtin.copy:
        content: "{{ {'title': op_items[0], 'category': 'SECURE_NOTE', 'sections': op_sections | selectattr('id', 'in', used) | list, 'fields': op_import_fields} | to_nice_json }}\n"
        dest: "{{ op_out_dir }}/{{ op_items[0] }}.json"
        mode: "0600"
      no_log: true

    - name: Next steps
      ansible.builtin.debug:
        msg:
          - "Rendered {{ op_import_fields | length }} field(s) in {{ op_sections | length - 1 }} section(s) to {{ op_out_dir }}/{{ op_items[0] }}.json"
          - "⚠ That file is every credential in PLAINTEXT. The last command below deletes it — do not skip it."
          - "1. Make sure op can reach your account: 1Password app -> Settings -> Developer -> 'Integrate with 1Password CLI', then `op vault list`. (Creating the item needs WRITE access, so this runs as you — not as a service account.)"
          - "2. Create the vault if it does not exist:  op vault create {{ op_vault }}"
          - "3. Preview without writing:  op item create --template {{ op_out_dir }}/{{ op_items[0] }}.json --vault {{ op_vault }} --dry-run"
          - "4. Create it for real:  op item create --template {{ op_out_dir }}/{{ op_items[0] }}.json --vault {{ op_vault }}"
          - "5. Shred the rendered file:  rm -P {{ op_out_dir }}/{{ op_items[0] }}.json"
          - "6. Nothing else to set up: with the app integration on, there is no token to create or store. A service account is needed only for CI, a Linux control node, or ESO — ../SECRETS.md §1.4, and note its vault grants are IMMUTABLE."
          - "7. Prove the swap:  render-frr-config.yml under each backend must produce byte-identical output (../SECRETS.md §5)."
