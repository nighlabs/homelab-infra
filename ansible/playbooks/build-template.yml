---
# Build the Flatcar Proxmox template (idempotent). Run once up front, or any
# time you bump flatcar_version. Separate from node provisioning so re-running
# a node play doesn't touch the template.
- name: Build Flatcar template
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/community.proxmox.proxmox:
      api_host: "{{ proxmox_api_host }}"
      api_user: "{{ proxmox_api_user }}"
      api_token_id: "{{ proxmox_api_token_id }}"
      api_token_secret: "{{ proxmox_api_token_secret }}"
      validate_certs: "{{ proxmox_validate_certs }}"
  pre_tasks:
    # Secrets come from Bitwarden Secrets Manager at run time (there is no
    # vault.yml). pre_tasks so it runs before the role touches a {{ bws.* }}
    # value — a plain `tasks:` block would run AFTER roles.
    - name: Load secrets from Bitwarden Secrets Manager
      ansible.builtin.include_tasks: tasks/load-bws-secrets.yml

  roles:
    - flatcar_template
