---
# Post-provision cluster bootstrap: wait for the k3s server(s) to finish booting,
# fetch + rewrite the kubeconfig, then prime Calico (the CNI) so the node goes
# Ready. This is the "Ansible primes, Flux adopts" handoff (ADR-0016) — "k3s up → fetch
# kubeconfig → install Calico → wait node Ready". Flux bootstrap (Flux Operator +
# FluxInstance, which then ADOPTS this same Calico release) is the next step, not
# here. Safe to re-run: the SSH/k3s waits are idempotent and the Helm prime
# converges to the pinned release.
#
# Run:  uv run ansible-playbook playbooks/bootstrap-cluster.yml
#
# Prereqs on the control node (see README "One-time setup"): the `helm` CLI on
# PATH, the kubernetes.core collection (requirements.yml), and the `kubernetes`
# Python lib (pyproject.toml). Reaches the node over the DMZ, same as SSH does.

# --- Play A: wait for SSH, build the in-memory bootstrap inventory -----------
- name: Wait for k3s server nodes to boot
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../inventory/nodes.yml
  vars:
    # Roles that run a k3s *server* (kubeconfig source + Calico target). Agents
    # never hold the kubeconfig, so they're excluded here.
    server_roles: ["all-in-one", "server", "control-plane"]
  tasks:
    # Secrets come from 1Password at run time (there is no
    # vault.yml). Must precede anything that touches a {{ secrets.* }} value.
    - name: Load secrets from the secret store
      ansible.builtin.include_tasks: tasks/load-secrets.yml

    # clusters: → a flat `nodes` map, each node annotated with its `cluster`.
    - name: Load the node map
      ansible.builtin.include_tasks: tasks/load-node-map.yml

    - name: Select the k3s server nodes from the node map
      ansible.builtin.set_fact:
        k3s_servers: >-
          {{ nodes | dict2items
             | selectattr('value.role', 'defined')
             | selectattr('value.role', 'in', server_roles)
             | list }}

    - name: Assert every cluster has at least one k3s server node
      ansible.builtin.assert:
        that:
          - k3s_servers | selectattr('value.cluster', 'equalto', item) | list | length > 0
        fail_msg: >-
          Cluster '{{ item }}' (inventory/nodes.yml) has no node with a server role
          ({{ server_roles | join('/') }}) — nothing to fetch a kubeconfig from.
        quiet: true
      loop: "{{ clusters.keys() | list }}"

    # One bootstrap primary PER CLUSTER: the server whose kubeconfig we fetch and
    # through which the control node talks to that cluster. Each cluster gets its
    # own kubeconfig, context, and Calico prime, so this can't be a single global
    # "first server" anymore.
    - name: Pick the bootstrap primary for each cluster
      ansible.builtin.set_fact:
        bootstrap_primaries: >-
          {{ bootstrap_primaries | default({}) | combine({
               item: (k3s_servers
                      | selectattr('value.cluster', 'equalto', item)
                      | map(attribute='key') | first)
             }) }}
      loop: "{{ clusters.keys() | list }}"

    # eth0/DMZ IP is derived the same way preflight.yml does — no facts survive a
    # standalone run of this playbook, so re-derive from the node map + vault.
    - name: Wait for SSH (port 22) on each server's DMZ IP
      ansible.builtin.wait_for:
        host: "{{ dmz_network.subnet_base }}.{{ item.value.node_number }}"
        port: 22
        state: started
        timeout: 300
      loop: "{{ k3s_servers }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Add each server to the in-memory bootstrap groups
      ansible.builtin.add_host:
        name: "{{ item.key }}"
        # Every server lands in k3s_bootstrap (Play B polls /readyz on all of
        # them); the per-cluster primaries ALSO land in k3s_primaries, which is
        # what Play C loops over — one Calico prime per cluster, not per node.
        groups: "{{ ['k3s_bootstrap'] + (['k3s_primaries'] if item.key == bootstrap_primaries[item.value.cluster] else []) }}"
        ansible_host: "{{ dmz_network.subnet_base }}.{{ item.value.node_number }}"
        ansible_user: "{{ node_user }}"
        node_eth0_ip: "{{ dmz_network.subnet_base }}.{{ item.value.node_number }}"
        # The cluster this node belongs to (nodes.yml's cluster key). Names the
        # kubeconfig entries/context and the kubeconfig file (see vars.yml's
        # kubeconfig_local, which templates it per host).
        cluster_name: "{{ item.value.cluster }}"
        # A rebuilt node reuses the SAME DMZ IP with a NEW host key, so a stale
        # known_hosts entry would break SSH even with host_key_checking=False
        # (StrictHostKeyChecking=no auto-accepts new hosts but still REFUSES a
        # CHANGED key). These nodes are cattle — don't persist their key at all.
        # Scoped to the k3s_bootstrap group only; the PVE host (inventory/hosts.yml)
        # keeps normal verification.
        ansible_ssh_common_args: "-o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no"
        is_bootstrap_primary: "{{ item.key == bootstrap_primaries[item.value.cluster] }}"
      loop: "{{ k3s_servers }}"
      loop_control:
        label: "{{ item.key }} ({{ item.value.cluster }})"
      changed_when: false

# --- Play B: wait for the k3s API, fetch + rewrite the kubeconfig ------------
# These tasks target the Flatcar node, which ships NO Python (immutable, no
# package manager — root CLAUDE.md). So they use `raw` (runs straight over SSH,
# no interpreter) NOT command/slurp, which would fail with "python not found".
# sudo is embedded in each raw command (the admin user has NOPASSWD sudo via
# Ignition; k3s.yaml is root:root 0640) — no play-level `become`, so the two
# localhost `delegate_to` writes run cleanly as the local user.
- name: Wait for k3s and fetch the kubeconfig
  hosts: k3s_bootstrap
  gather_facts: false
  tasks:
    # k3s isn't up the instant SSH is: on first boot the ~50 MB sysext downloads,
    # merges, then k3s starts (ansible/CLAUDE.md "Non-obvious facts"). Poll /readyz until the API
    # reports healthy. `until` retries suppress the non-zero rc while it comes up.
    - name: Wait for the k3s API to report readyz=ok
      ansible.builtin.raw: sudo /usr/local/bin/k3s kubectl get --raw=/readyz
      register: k3s_readyz
      until: k3s_readyz.rc == 0 and (k3s_readyz.stdout | trim) == "ok"
      retries: 40
      delay: 15
      changed_when: false

    - name: Read the kubeconfig from the bootstrap primary
      ansible.builtin.raw: sudo cat /etc/rancher/k3s/k3s.yaml
      register: k3s_kubeconfig_raw
      changed_when: false
      when: is_bootstrap_primary | bool

    # k3s emits exactly one cluster/user/context, ALL named `default` — so two
    # clusters' kubeconfigs collide on every entry name and clobber each other on
    # merge. Everything below rewrites that: entries renamed per `cluster_name`,
    # and the loopback server URL pointed at the node's DMZ IP so the control node
    # (and, next milestone, Flux) can actually reach the API. The single-entry
    # assumption is asserted rather than assumed — if k3s ever emits more, the
    # [0] indexing below would silently drop the extras.
    - name: Rename the kubeconfig entries and repoint the server URL
      vars:
        kc: "{{ k3s_kubeconfig_raw.stdout | from_yaml }}"
      when: is_bootstrap_primary | bool
      block:
        - name: Assert the k3s kubeconfig has exactly one cluster/user/context
          ansible.builtin.assert:
            that:
              - kc.clusters | length == 1
              - kc.users | length == 1
              - kc.contexts | length == 1
            fail_msg: >-
              /etc/rancher/k3s/k3s.yaml has more than one cluster/user/context —
              the rename below only handles k3s's single-entry output.
            quiet: true

        - name: Build the renamed kubeconfig
          ansible.builtin.set_fact:
            kubeconfig_doc: >-
              {{ kc | combine({
                   'clusters': [ kc.clusters[0] | combine({
                       'name': cluster_name,
                       'cluster': kc.clusters[0].cluster | combine({
                           'server': 'https://' ~ node_eth0_ip ~ ':6443',
                       }),
                     }) ],
                   'users': [ kc.users[0] | combine({'name': cluster_name ~ '-admin'}) ],
                   'contexts': [ {
                       'name': cluster_name,
                       'context': {'cluster': cluster_name, 'user': cluster_name ~ '-admin'},
                     } ],
                   'current-context': cluster_name,
                 }) }}

    - name: Ensure the local kubeconfig directory exists
      ansible.builtin.file:
        path: "{{ kubeconfig_local | dirname }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      when: is_bootstrap_primary | bool

    # 0600 — it holds cluster-admin client certs (git-ignored via ansible/.gitignore).
    - name: Write the rewritten kubeconfig to the control node
      ansible.builtin.copy:
        content: "{{ kubeconfig_doc | to_nice_yaml(indent=2) }}"
        dest: "{{ kubeconfig_local }}"
        mode: "0600"
      delegate_to: localhost
      when: is_bootstrap_primary | bool

    # Install this cluster's kubeconfig as its OWN FILE in the user's config
    # directory, rather than merging its entries into one shared ~/.kube/config.
    #
    # ⚠ Why a file per cluster and not a merge (ADR/worklog 2026-09-14): a merged
    # config only ever GROWS. Every cluster ever built leaves a cluster-admin
    # cert behind, including clusters that no longer exist — deleting one meant
    # three `kubectl config delete-*` calls that are easy to half-do, so stale
    # credentials accumulated silently. One file per cluster makes removal `rm`,
    # and makes "what do I still hold keys for?" an `ls`.
    #
    # kubectl merges a colon-separated KUBECONFIG natively, so nothing is lost:
    #   export KUBECONFIG=$(find ~/.kube/configs -name '*.config' | tr '\n' ':')
    # `kubectl config get-contexts` then lists every cluster and `--context`
    # selects between them, exactly as with a merged file.
    #
    # Opt out with kubeconfig_install_user (CI, shared control nodes — anywhere
    # writing to a user's home dir isn't wanted). The canonical copy the plays
    # themselves use is kubeconfig_local either way; this is a convenience copy.
    - name: Install this cluster's kubeconfig for the user
      when:
        - is_bootstrap_primary | bool
        - kubeconfig_install_user | bool
      delegate_to: localhost
      block:
        - name: Ensure the user's kubeconfig directory exists
          ansible.builtin.file:
            path: "{{ kubeconfig_user_dir }}"
            state: directory
            mode: "0700"

        # A plain copy of the file written above — same content, same 0600. No
        # merge, so nothing in the directory can be clobbered by another
        # cluster's bootstrap, and re-running is idempotent by content.
        - name: Install the per-cluster kubeconfig
          ansible.builtin.copy:
            src: "{{ kubeconfig_local }}"
            dest: "{{ kubeconfig_user_dir }}/{{ cluster_name }}.config"
            mode: "0600"

# --- Play C: prime Calico (Ansible installs once; Flux adopts later) ---------
# Runs over k3s_primaries — ONE host per cluster — so each cluster gets its own
# Calico prime against its own kubeconfig. Every task delegates to localhost:
# helm/k8s run on the control node (nothing k8s-side is installed on Flatcar), and
# the primary is only here to carry the per-cluster facts (cluster_name →
# kubeconfig_local, node_eth0_ip).
- name: Install Calico via the tigera-operator Helm chart
  hosts: k3s_primaries
  gather_facts: false
  # ⚠ Required for `cluster_bgp` (group_vars/all/vars.yml), which derives each
  # cluster's ASN and LB range from its `index` in this file. vars_files are
  # PLAY-scoped, so Play A loading the node map does nothing for this play — and
  # the failure would be a runtime "clusters is undefined", not a syntax error.
  vars_files:
    - ../inventory/nodes.yml
  vars:
    # The ONE Calico values source, shared with the Flux HelmRelease (which reads
    # it via a generated ConfigMap). Priming from the same file guarantees the
    # Git definition and the live release match, so Flux adopts without a diff.
    calico_values_file: "{{ playbook_dir }}/../../gitops/infrastructure/calico/values.yaml"
    # The vendored CRDs, shared with the `crds` Flux Kustomization the same way
    # values.yaml is shared with the HelmRelease — one file, primed identically
    # twice. Regeneration command lives in that file's header.
    calico_crds_file: "{{ playbook_dir }}/../../gitops/crds/calico/crds.yaml"
    # eBPF dataplane prerequisites, primed from the SAME committed manifests Flux
    # reconciles (ADR-0024). Never hand-maintain a second copy here.
    calico_manifest_dir: "{{ playbook_dir }}/../../gitops/infrastructure/calico"
    # BGP + LoadBalancer CRs, primed the same way. Separate directory because
    # ../calico/'s kustomization applies a `namespace:` transformer that would
    # wrongly stamp these cluster-scoped CRs — see that dir's kustomization.yaml.
    calico_bgp_manifest_dir: "{{ playbook_dir }}/../../gitops/infrastructure/calico-bgp"
    # This play seeds the platform secrets (Cloudflare token, cephx keys), which
    # live in each cluster's homelab-platform-<cluster> vault (ADR-0038).
    op_load_cluster_vaults: true
    # The per-cluster values the committed manifests carry as ${...} placeholders.
    # Ansible substitutes them here from the vault; Flux substitutes the SAME
    # placeholders later from the cluster-topology Secret seeded below. One
    # source (the committed file), two consumers — exactly like values.yaml.
    bgp_substitutions:
      "${lb_range}": "{{ cluster_bgp[cluster_name].lb_range }}"
      "${cluster_asn}": "{{ cluster_bgp[cluster_name].asn }}"
      "${bgp_peer_ip}": "{{ bgp_peer_ip }}"
      "${bgp_peer_asn}": "{{ bgp_peer_asn }}"
  tasks:
    # Secrets come from 1Password at run time (there is no
    # vault.yml). Must precede anything that touches a {{ secrets.* }} value.
    - name: Load secrets from the secret store
      ansible.builtin.include_tasks: tasks/load-secrets.yml

    - name: Assert the committed Calico pod CIDR matches k3s_cluster_cidr
      vars:
        calico_values: "{{ lookup('ansible.builtin.file', calico_values_file) | from_yaml }}"
      ansible.builtin.assert:
        that:
          - calico_values.installation.calicoNetwork.ipPools[0].cidr == k3s_cluster_cidr
        fail_msg: >-
          gitops/infrastructure/calico/values.yaml pod CIDR
          ({{ calico_values.installation.calicoNetwork.ipPools[0].cidr }})
          != k3s_cluster_cidr ({{ k3s_cluster_cidr }}) — Calico's IPPool must
          match k3s cluster-cidr (docs/architecture.md §4.2).
        quiet: true
      delegate_to: localhost
      run_once: true

    # ⚠ Calico v3.32 REMOVED the CRDs from the tigera-operator chart — its
    # `crds/` dir is empty (at v3.29.1 it shipped 5 files). They now live in a
    # SEPARATE chart, `crd.projectcalico.org.v1`, which MUST be applied first or
    # the operator install dies with "no matches for kind Installation /
    # APIServer / Goldmane / Whisker in version operator.tigera.io/v1 — ensure
    # CRDs are installed first". Upstream rationale (chart README): Helm never
    # upgrades or deletes CRDs that live in a chart's crds/ dir, so they were
    # split out to get a real lifecycle.
    #
    # SERVER-SIDE APPLY IS MANDATORY — not a style preference. 3 of the 32 CRDs
    # blow past the 262144-byte client-side apply limit (installations 1.46 MB,
    # gatewayapis 466 KB, istios 284 KB). That's also why this can't simply be a
    # second helm release: `helm install` of this chart fails for the same
    # reason, which the chart README states outright.
    #
    # Applied from the VENDORED file, not re-rendered from the chart — that's
    # what keeps the Ansible prime and the Flux-managed state byte-identical
    # (gitops/crds/, reconciled by the `crds` Flux Kustomization that
    # `infrastructure` dependsOn). Re-rendering here would create a second
    # source that drifts the moment the vendored copy is regenerated, which is
    # the same diff-war the shared values.yaml exists to prevent.
    #
    # Deliberately NOT `run_once` — CRDs are cluster-scoped, so every cluster
    # gets its own apply against its own kubeconfig (same shape as the helm task
    # below).
    - name: Prime the Calico CRDs (server-side; see the note above)
      delegate_to: localhost
      kubernetes.core.k8s:
        src: "{{ calico_crds_file }}"
        state: present
        apply: true
        server_side_apply:
          field_manager: calico-crds-ansible
          force_conflicts: true
        kubeconfig: "{{ kubeconfig_local }}"
        wait: true
        wait_condition:
          type: Established
          status: "True"

    # --- eBPF dataplane prerequisites (ADR-0024) --------------------------
    # ORDERING IS LOAD-BEARING, both before helm:
    #   namespace  — the ConfigMap has nowhere to land otherwise (helm's
    #                create_namespace would come too late, and is idempotent).
    #   ConfigMap  — in eBPF mode Calico implements Services itself and must
    #                reach the API server without a ClusterIP; calico-node
    #                cannot start the dataplane without it.
    #
    # A third task primed a FelixConfiguration during stage 1, disabling
    # bpfKubeProxyIptablesCleanupEnabled so Felix and k3s's embedded kube-proxy
    # didn't fight over iptables. Removed at stage 2 along with the manifest —
    # `disable-kube-proxy: true` in the k3s config means there's nothing to
    # coexist with, and leaving cleanup off would orphan kube-proxy's stale
    # rules rather than let Felix clean them up.
    - name: Prime the tigera-operator namespace (so the ConfigMap can land)
      delegate_to: localhost
      kubernetes.core.k8s:
        src: "{{ calico_manifest_dir }}/namespace.yaml"
        state: present
        kubeconfig: "{{ kubeconfig_local }}"

    # ${k3s_api_ip} is substituted from the SAME node-map value Flux will supply
    # via the cluster-topology Secret, so Git keeps the placeholder and neither
    # path hard-codes topology. Real IP, never `localhost` — see the manifest.
    - name: Prime the kubernetes-services-endpoint ConfigMap (eBPF API access)
      delegate_to: localhost
      kubernetes.core.k8s:
        definition: >-
          {{ lookup('ansible.builtin.file',
                    calico_manifest_dir ~ '/kubernetes-services-endpoint.yaml')
             | replace('${k3s_api_ip}', node_eth0_ip) | from_yaml }}
        state: present
        kubeconfig: "{{ kubeconfig_local }}"

    - name: Install/prime the tigera-operator (Calico) release
      delegate_to: localhost
      kubernetes.core.helm:
        name: tigera-operator
        chart_ref: tigera-operator
        chart_repo_url: https://docs.tigera.io/calico/charts
        chart_version: "{{ calico_version }}"
        release_namespace: tigera-operator
        create_namespace: true
        values_files:
          - "{{ calico_values_file }}"
        kubeconfig: "{{ kubeconfig_local }}"
        # Escape hatch: the module shells out to helm and parses its output, so a
        # helm major bump is the prime suspect if this task errors oddly. Helm 4
        # needs kubernetes.core >=6.4 (the 5.x line hard-fails on helm >=4.0.0);
        # requirements.yml pins that. Defaults to omit (find helm on PATH, no
        # behavior change); set `helm_binary` (group_vars/all/vars.yml) to pin a
        # specific helm binary without editing this play.
        binary_path: "{{ helm_binary | default(omit) }}"
        wait: true
        timeout: 10m0s

    # Node only reports Ready once the CNI (calico-node) is up on it — so this is
    # the real signal Calico took. Count Ready=True conditions across all nodes.
    - name: Wait for the node(s) to report Ready
      delegate_to: localhost
      kubernetes.core.k8s_info:
        kind: Node
        kubeconfig: "{{ kubeconfig_local }}"
      register: node_info
      until: >-
        node_info.resources | length > 0 and
        (node_info.resources | map(attribute='status.conditions', default=[]) | flatten
         | selectattr('type', 'equalto', 'Ready')
         | selectattr('status', 'equalto', 'True') | list | length)
        == (node_info.resources | length)
      retries: 30
      delay: 10

    # --- BGP / LoadBalancer (ADR-0018, ADR-0023, ADR-0026) ------------
    #
    # ⚠ THE BGP CRs ARE `projectcalico.org/v3`, SERVED BY THE AGGREGATED
    # calico-apiserver — not by the CRDs primed earlier. `helm --wait` returns
    # once the OPERATOR is up; the operator then creates calico-apiserver
    # asynchronously, so applying these straight after helm races it and fails
    # with "no matches for kind BGPPeer in version projectcalico.org/v3".
    # Gate on the APIService actually reporting Available.
    - name: Wait for calico-apiserver to serve projectcalico.org/v3
      delegate_to: localhost
      kubernetes.core.k8s_info:
        api_version: apiregistration.k8s.io/v1
        kind: APIService
        name: v3.projectcalico.org
        kubeconfig: "{{ kubeconfig_local }}"
      register: calico_apiservice
      until: >-
        calico_apiservice.resources | length > 0 and
        (calico_apiservice.resources[0].status.conditions | default([])
         | selectattr('type', 'equalto', 'Available')
         | selectattr('status', 'equalto', 'True') | list | length) > 0
      retries: 30
      delay: 10

    # Primed from the SAME committed manifests Flux reconciles, with the ${...}
    # placeholders substituted from the vault — the identical pattern the
    # kubernetes-services-endpoint ConfigMap uses above. This is what keeps one
    # source of truth: Ansible substitutes now (no Flux yet), Flux substitutes
    # the same placeholders later from the cluster-topology Secret, and both
    # produce byte-identical objects so Flux adopts rather than fights.
    #
    # ORDER IS LOAD-BEARING:
    #   bgpfilter        — bgppeer's `filters:` reference is inert without it,
    #                      and "inert" here means the pod CIDR IS exported
    #                      (Calico's default action for an unmatched route is
    #                      Accept — see the manifest header).
    #   bgpconfiguration — cluster ASN + the mesh + what gets advertised.
    #   bgppeer          — the pfSense session itself.
    #   ippool           — allocation. Last: nothing should be able to claim an
    #                      address before the filter governing its advertisement
    #                      exists.
    - name: Prime the Calico BGP + LoadBalancer CRs
      delegate_to: localhost
      kubernetes.core.k8s:
        definition: >-
          {{ lookup('ansible.builtin.file', calico_bgp_manifest_dir ~ '/' ~ item)
             | replace('${lb_range}', bgp_substitutions['${lb_range}'])
             | replace('${cluster_asn}', bgp_substitutions['${cluster_asn}'])
             | replace('${bgp_peer_ip}', bgp_substitutions['${bgp_peer_ip}'])
             | replace('${bgp_peer_asn}', bgp_substitutions['${bgp_peer_asn}'])
             | from_yaml_all | list }}
        state: present
        kubeconfig: "{{ kubeconfig_local }}"
      loop:
        - bgpfilter.yaml
        - bgpconfiguration.yaml
        - bgppeer.yaml
        - ippool-loadbalancer.yaml

    # --- Seed the cluster-topology Secret (Flux postBuild source) ------------
    # Ansible-seeded PERMANENTLY, and not for a dependency reason: Flux
    # evaluates postBuild.substituteFrom at build time for the infrastructure
    # tier, and a tier applies in one pass, so a Secret produced by a controller
    # INSIDE that tier (ESO) can never be a substitution source FOR it — and
    # Calico is primed from these same values before Flux exists (ADR-0016,
    # ADR-0021, ADR-0034). Cluster-bound != ESO-managed. (The old "ESO needs a
    # cert, which needs an LB IP" cycle was Bitwarden-era and is gone.)
    #
    # Nothing reads this until Flux exists — it's seeded now so the Flux
    # bootstrap has one less ordering dependency, and it's idempotent.
    #
    # ⚠ Every ${...} placeholder in gitops/ must have a key here. A missing one
    # substitutes to the EMPTY STRING and reconciles as HEALTHY unless
    # kustomize-controller runs with StrictPostBuildSubstitutions (see
    # gitops/CLAUDE.md). Current set — grep to re-check after adding manifests:
    #   grep -rhoE '\$\{[a-z0-9_]+\}' gitops/ | sort -u
    - name: Ensure the flux-system namespace exists (for cluster-topology)
      delegate_to: localhost
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig_local }}"
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: flux-system

    - name: Seed the cluster-topology Secret
      delegate_to: localhost
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig_local }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: cluster-topology
            namespace: flux-system
          # stringData, not data: values are plaintext topology, not base64.
          stringData:
            k3s_api_ip: "{{ node_eth0_ip }}"
            bgp_peer_ip: "{{ bgp_peer_ip }}"
            bgp_peer_asn: "{{ bgp_peer_asn | string }}"
            cluster_asn: "{{ cluster_bgp[cluster_name].asn | string }}"
            lb_range: "{{ cluster_bgp[cluster_name].lb_range }}"
            base_domain: "{{ base_domain }}"
            # The cluster key from inventory/nodes.yml. Not topology — it is
            # already public as gitops/deployment/<cluster>/ — but it names the
            # per-cluster 1Password vaults the ClusterSecretStores read
            # (homelab-platform-<cluster>, homelab-apps-<cluster>), and a shared
            # manifest can only get a per-cluster value through this Secret.
            cluster_name: "{{ cluster_name }}"
            # --- ceph-csi (ADR-0006) -------------------------------------
            # Substituted into gitops/infrastructure-config/ceph-csi/. Pool and
            # subvolumegroup are cleartext in group_vars and COULD be literals
            # here — they're substituted anyway, per the repo rule that every
            # shared value goes through the Secret. A literal in Git is a second
            # copy of a value the Ceph side also holds, and it drifts silently:
            # a StorageClass naming a pool that no longer exists fails at PVC
            # bind time, not at reconcile time.
            ceph_rbd_pool: "{{ ceph_csi.rbd_pool }}"
            ceph_fs_name: "{{ ceph_csi.fs_name }}"
            ceph_subvolume_group: "{{ ceph_csi.subvolume_group }}"
            # ⚠ CephConnection.spec.monitors is a YAML LIST, and post-build
            # substitution is string-level — the "substitution can't go here"
            # case in gitops/CLAUDE.md. Rather than reach for SOPS or hard-code
            # a mon count as ${ceph_mon_1..3}, this seeds ONE value that is a
            # complete JSON array (valid YAML flow sequence), substituted whole
            # into `monitors: ${ceph_mons_yaml}`. Mon count then changes here,
            # not in a manifest. to_json quotes each element, which matters:
            # an unquoted host:port is not a valid YAML scalar in flow context.
            ceph_mons_yaml: "{{ ceph_csi.mons | to_json }}"

    # --- Seed the cert-manager DNS-01 token (bootstrap-secret tier) ----------
    # Seeded here so a from-scratch rebuild issues certificates without waiting
    # for ESO; ESO then KEEPS IT CURRENT from the same 1Password field
    # (homelab-platform-<cluster>/cert-manager/cloudflare_api_token) with
    # creationPolicy: Merge — gitops/infrastructure-config/external-secrets/.
    # Both writers read one vault, so they agree by construction, and rotation
    # is one edit in 1Password (ADR-0038). Seed and sync are permanent
    # partners: Merge never creates the Secret, so the seed must stay.
    #
    # The namespace is created here (Flux applies the committed namespace.yaml
    # over it later — SSA adoption, same as flux-system above). The Secret name
    # + key are the contract the committed ClusterIssuers reference
    # (gitops/infrastructure-config/cert-manager/clusterissuers.yaml).
    - name: Ensure the cert-manager namespace exists (for the DNS-01 token)
      delegate_to: localhost
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig_local }}"
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: cert-manager

    - name: Seed the Cloudflare DNS-01 API token Secret
      delegate_to: localhost
      no_log: true # a credential — never in output, even at -vvv
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig_local }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: cloudflare-api-token
            namespace: cert-manager
          stringData:
            api-token: "{{ cloudflare_api_token }}"

    # --- Seed the two cephx keys (bootstrap-secret tier) ---------------------
    # Same arrangement as the Cloudflare token above (ADR-0038): seeded here so
    # storage works on a from-scratch rebuild before ESO exists, then kept
    # current by ESO (Merge, `userKey` only) from
    # homelab-platform-<cluster>/ceph-csi. Rebuild-path length is why the seed
    # stays even though nothing about ESO depends on storage — re-provisioning
    # is the normal upgrade path here (ADR-0019).
    #
    # The namespace, Secret names and KEY NAMES are the contract that
    # gitops/infrastructure-config/ceph-csi/ references. ⚠ `userID` carries NO
    # `client.` prefix — ceph-csi prepends it, and including it yields an
    # authentication failure at attach time rather than a clear error.
    - name: Ensure the ceph-csi namespace exists (for the cephx keys)
      delegate_to: localhost
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig_local }}"
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ ceph_csi.namespace }}"

    - name: Seed the ceph-csi cephx Secrets
      delegate_to: localhost
      no_log: true # credentials — never in output, even at -vvv
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig_local }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ item.name }}"
            namespace: "{{ ceph_csi.namespace }}"
          stringData:
            userID: "{{ item.user }}"
            userKey: "{{ item.key }}"
      loop:
        - name: ceph-csi-rbd
          user: "{{ ceph_csi.rbd_client }}"
          key: "{{ ceph_k8s_rbd_key }}"
        - name: ceph-csi-cephfs
          user: "{{ ceph_csi.cephfs_client }}"
          key: "{{ ceph_k8s_cephfs_key }}"
      loop_control:
        label: "{{ item.name }}"

    # --- Seed ESO's 1Password service-account token --------------------------
    # The credential ESO authenticates with: ONE service account per cluster,
    # granted read_items on exactly homelab-platform-<cluster> and
    # homelab-apps-<cluster> (ADR-0038). It is read from homelab-infra, which
    # ESO can never see — the thing that grants access cannot live behind the
    # access it grants.
    #
    # ⚠ VERIFIED BEFORE IT IS SEEDED, for two reasons:
    #   1. The grant is IMMUTABLE. A token that can see homelab-infra, another
    #      cluster's vault, or not both of its own is a wrong service account,
    #      and the fix is a new one — so refuse it here rather than discover it
    #      as a ClusterSecretStore that half-works.
    #   2. Error amplification (external-secrets#4925): ESO retries a BAD token
    #      at reconcile cadence and can exhaust the account-wide DAILY quota in
    #      minutes, locking out every service account for 24h. One call here
    #      turns that into a loud failure at seed time instead.
    # This is the only store call outside tasks/load-secrets.yml: it checks a
    # credential rather than reading a secret, and it MUST run as that
    # credential, which the loader never does.
    - name: List the vaults the ESO service-account token can see
      delegate_to: localhost
      ansible.builtin.command:
        argv: [op, vault, list, --format, json]
      environment:
        OP_SERVICE_ACCOUNT_TOKEN: "{{ eso_op_service_account_token }}"
      register: eso_vault_list
      changed_when: false
      failed_when: false
      no_log: true # the environment carries the token

    # stdout is vault names/ids and stderr is op's error text — neither carries
    # a secret, so the assert may quote them.
    - name: Assert the ESO token sees exactly this cluster's two vaults
      delegate_to: localhost
      vars:
        _expected: "{{ [op_cluster_vault_prefix ~ cluster_name, eso_apps_vault_prefix ~ cluster_name] | sort }}"
        _seen: >-
          {{ (eso_vault_list.stdout | from_json | map(attribute='name') | sort | list)
             if eso_vault_list.rc == 0 else [] }}
      ansible.builtin.assert:
        that:
          - eso_vault_list.rc == 0
          - _seen == _expected
        fail_msg: >-
          {% if eso_vault_list.rc != 0 %}
          The ESO token for `{{ cluster_name }}` was rejected by 1Password:
          {{ eso_vault_list.stderr | trim }}. Expired, revoked, or mis-pasted —
          do NOT seed it (a bad token burns the daily quota from inside the
          cluster). ansible/SECRETS.md §1.4.
          {% else %}
          The ESO token for `{{ cluster_name }}` sees {{ _seen }}, expected
          exactly {{ _expected }}. Service-account grants are IMMUTABLE, so this
          needs a NEW service account with the right grant
          (ansible/SECRETS.md §1.4) — never seed a token that can reach
          {{ op_vault }} or another cluster's vaults.
          {% endif %}
        quiet: true

    - name: Ensure the external-secrets namespace exists (for the ESO token)
      delegate_to: localhost
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig_local }}"
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: external-secrets

    # Name + key are the contract the committed ClusterSecretStores reference
    # (gitops/infrastructure-config/external-secrets/clustersecretstores.yaml).
    - name: Seed the ESO 1Password service-account token Secret
      delegate_to: localhost
      no_log: true # a credential — never in output, even at -vvv
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig_local }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: onepassword-service-account
            namespace: external-secrets
          stringData:
            token: "{{ eso_op_service_account_token }}"

    - name: Report the bootstrapped node(s)
      delegate_to: localhost
      ansible.builtin.debug:
        msg: >-
          Cluster `{{ cluster_name }}`: Calico primed;
          {{ node_info.resources | length }} node(s) Ready.
          {% if kubeconfig_install_user | bool %}
          kubeconfig installed at {{ kubeconfig_user_dir }}/{{ cluster_name }}.config
          as context `{{ cluster_name }}` (kubectl --context {{ cluster_name }} get nodes,
          once KUBECONFIG lists that directory — see group_vars/all/vars.yml).
          {% else %}
          kubeconfig: {{ kubeconfig_local }} (KUBECONFIG={{ kubeconfig_local }} kubectl get nodes).
          {% endif %}
          Next milestone: Flux bootstrap (adopts the tigera-operator release).
