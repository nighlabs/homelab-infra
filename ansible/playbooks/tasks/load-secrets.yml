---
# Load every secret into the `secrets` fact, plus a safe-to-log `secret_names`
# list of just the names. Include this ONCE at the top of any play that touches
# a vaulted value — the same shape as tasks/load-node-map.yml.
#
# This file is only a DISPATCHER. The store lives behind it, and that is the
# whole point of ADR-0033: consumers depend on "there is a secret store", never
# on which one, so `vars.yml` and every call site are untouched by a store
# change. Two files know the vendor — the backend task below, and (for
# Bitwarden) library/bws_secrets.py.
#
# ⚠ Whichever backend runs MUST publish exactly two facts, with these names and
# these properties, or half the repo breaks in ways that look unrelated:
#   secrets       dict, name -> value. ALWAYS no_log.
#   secret_names  sorted list of the names. NEVER no_log — its whole value is
#                 that it is safe to print (ADR-0033).
#
# --- Which backend, and why there are two right now -------------------------
#
# 1Password is the store (ADR-0034). The Bitwarden path is retained, working
# and one `-e` away for the duration of the cutover window, because a store
# swap whose rollback is "write the old code again" is not a rollback. This is
# the parallel-run window ADR-0032 asked for, and it is where the safety lives:
#
#   uv run ansible-playbook playbooks/render-frr-config.yml                      # 1Password
#   uv run ansible-playbook playbooks/render-frr-config.yml -e secrets_backend=bitwarden
#
# and the two renders must be BYTE-IDENTICAL. That diff is the proof that the
# item/field layout in 1Password matches what BWS held, and it is far stronger
# than reading the two value lists side by side.
#
# ⚠ Delete the Bitwarden path — the backend task, library/bws_secrets.py,
# library/bws_secret.py, the `bitwarden-sdk` pin and the BWS_* Keychain items —
# once that diff has passed and you are content. Leaving it forever recreates
# exactly the "two contradicting sources of truth" that ADR-0027 was written to
# repair. Removal criteria and the rest: docs/decisions/0034-secrets-store-1password.md.
- name: Assert the secrets backend is a known one
  ansible.builtin.assert:
    that:
      - secrets_backend in ['onepassword', 'bitwarden']
    fail_msg: >-
      secrets_backend='{{ secrets_backend | default("") }}' is not a backend.
      Use 'onepassword' (the store — ADR-0034) or 'bitwarden' (retained for the
      cutover window only). Set it in group_vars/all/vars.yml, or per-run with
      -e secrets_backend=...
    quiet: true
  run_once: true
  delegate_to: localhost

- name: "Load secrets from the {{ secrets_backend }} backend"
  ansible.builtin.include_tasks: "load-secrets-{{ secrets_backend }}.yml"
