---
# Expand ONE cluster-keyed vault map into <prefix>_<cluster> entries in
# `bws_port`. Included per map by port-vault-to-bws.yml — Ansible can't nest a
# loop inside a loop in a single task, hence the include.
#
# `cmap` is {var, prefix, values_are_lists}.

- name: "{{ cmap.var }} — expand to one secret per cluster"
  ansible.builtin.set_fact:
    bws_port: >-
      {{ bws_port | default({}) | combine({
           (cmap.prefix ~ '_' ~ item.key):
             (item.value | join(nl) if cmap.values_are_lists else item.value | string)
         }) }}
  # An absent or empty map yields nothing, which is correct — a cluster with no
  # secret is omitted rather than defaulted, so the preflight assert can name it.
  loop: "{{ (vars['vault_' ~ cmap.var] | default({})) | dict2items }}"
  loop_control:
    label: "{{ cmap.prefix }}_{{ item.key }}"
  no_log: true
