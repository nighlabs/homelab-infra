---
# Fetch every secret from Bitwarden Secrets Manager into the `secrets` fact,
# which group_vars/all/vars.yml then indexes (`{{ secrets.proxmox_api_host }}`
# etc.), plus a safe-to-log `secret_names` list of just the names (ADR-0033).
#
# ⚠ The fact is named for its ROLE, not its vendor (ADR-0033). Consumers depend
# on "this is the secret store", not on which one — so a store change is a
# change to this file and the module behind it, not a sweep of every call site.
#
# Include this ONCE at the top of any play that touches a vaulted value — the
# same shape as tasks/load-node-map.yml. vars.yml's references are lazily
# templated, so they resolve at USE time and fail loudly ("'secrets' is
# undefined") in a play that forgot the include, rather than rendering empty.
#
# ONE API call per play run, not one per secret. See library/bws_secrets.py for
# why that matters (BWS rate-limits undocumented; the stock lookup is
# UUID-per-call) and docs/decisions/0027-control-node-secrets-bws-runtime.md,
# "Control-node secrets", for the decision.

- name: Resolve the BWS access token
  # Secret zero — the one credential that can never come from BWS itself.
  # Default: macOS Keychain, read at run time, so nothing secret lives in the
  # repo directory. ⚠ NOT Touch ID: `security` has no biometry flag, so an item
  # created with -T "" prompts for the LOGIN PASSWORD, once per play. See
  # group_vars/all/vars.yml next to bws_keychain_command for the full details.
  # Override with -e bws_access_token=... or BWS_ACCESS_TOKEN in the environment
  # (CI, Linux control nodes) — the Keychain path is a default, not a hard
  # requirement.
  ansible.builtin.set_fact:
    bws_access_token: >-
      {{ bws_access_token
         | default(lookup('ansible.builtin.env', 'BWS_ACCESS_TOKEN'), true)
         | default(lookup('ansible.builtin.pipe', bws_keychain_command), true) }}
  no_log: true
  run_once: true
  delegate_to: localhost

- name: Assert secret zero was found
  ansible.builtin.assert:
    that:
      - bws_access_token is defined
      - (bws_access_token | trim | length) > 0
    fail_msg: >-
      No BWS access token. Add it to the LOCAL login keychain with:
        security add-generic-password -a "{{ bws_keychain_account }}"
          -s {{ bws_keychain_service }} -U -w
      (not the Passwords app — that's the synced iCloud keychain, a different
      store the `security` CLI cannot see). Or export BWS_ACCESS_TOKEN, or pass
      -e bws_access_token=... The token is a machine-account token scoped
      read-only to the infra project — see ansible/BWS-SECRETS.md.
    quiet: true
  run_once: true
  delegate_to: localhost

- name: Resolve the BWS organization id
  # Same precedence as the token: an explicit -e wins, then BWS_ORG_ID in the
  # environment (CI / Linux control nodes), then the macOS Keychain by default —
  # so nothing environment-identifying needs to live in the repo or a shell
  # profile. Not a credential; kept out of Git for the same reason the token is.
  ansible.builtin.set_fact:
    bws_organization_id: >-
      {{ bws_organization_id
         | default(lookup('ansible.builtin.env', 'BWS_ORG_ID'), true)
         | default(lookup('ansible.builtin.pipe', bws_org_keychain_command), true) }}
  run_once: true
  delegate_to: localhost

- name: Assert the organization id was found
  ansible.builtin.assert:
    that:
      - bws_organization_id is defined
      - (bws_organization_id | trim | length) > 0
    fail_msg: >-
      No BWS organization id. Add it to the LOCAL login keychain with:
        security add-generic-password -a "{{ bws_keychain_account }}"
          -s {{ bws_org_keychain_service }} -U -w
      Or export BWS_ORG_ID, or pass -e bws_organization_id=... It is the
      ORGANIZATION uuid, NOT the project uuid (both are uuids — a swap fails as a
      404 on sync, after auth succeeds). See ansible/BWS-SECRETS.md.
    quiet: true
  run_once: true
  delegate_to: localhost

- name: Fetch all secrets from Bitwarden Secrets Manager
  bws_secrets:
    access_token: "{{ bws_access_token }}"
    organization_id: "{{ bws_organization_id }}"
    project_id: "{{ bws_project_id | default(omit) }}"
  register: bws_fetch
  # Values would otherwise land in the task result. `names`/`count` are echoed
  # separately below precisely so a missing key is still debuggable.
  no_log: true
  run_once: true
  delegate_to: localhost

- name: Expose the secrets as `secrets`
  ansible.builtin.set_fact:
    secrets: "{{ bws_fetch.secrets }}"
  no_log: true
  run_once: true
  delegate_to: localhost

# The NAME LIST as its own fact, deliberately separate from the values and
# deliberately NOT no_log (ADR-0033).
#
# Some tasks don't want a secret's value — they ask a question about the SET OF
# NAMES: "is this optional secret present yet?", "does every k3s_tls_sans_*
# suffix name a real cluster?". A brokered variable is a value, so those tasks
# used to reach past group_vars into the raw dict, which is both the wrong layer
# and needlessly inside no_log's blast radius. With this fact they answer the
# question they actually have, and never touch a value at all.
#
# ⚠ Safe to log BECAUSE it is a separate fact. Never fold it back into
# `secrets`, and never derive it with `secrets.keys()` at a call site — that
# separation is the property being bought.
- name: Expose the secret names as `secret_names`
  ansible.builtin.set_fact:
    secret_names: "{{ bws_fetch.names }}"
  run_once: true
  delegate_to: localhost

# Safe to print: names and a count, never values. This is the task to read when
# a `{{ secrets.something }}` comes back undefined — it tells you whether the secret
# is missing from BWS or just misspelled here.
- name: Report which secrets were loaded
  ansible.builtin.debug:
    msg: "Loaded {{ bws_fetch.count }} secret(s) from BWS: {{ bws_fetch.names | join(', ') }}"
    verbosity: 1
  run_once: true
  delegate_to: localhost
