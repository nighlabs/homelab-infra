---
# Per-cluster Flux bootstrap. Included once per cluster by flux-bootstrap.yml
# with `cluster_name` as the loop variable; everything below resolves off that
# one fact (kubeconfig_local, flux_sync_path).
#
# DELIVERY MODEL (step 3 of 1->2->4->3): the FluxInstance is SYNC-LESS. Flux does
# not clone Git; it reconciles a signed OCI artifact
# (ghcr.io/nighlabs/homelab-infra/gitops) whose signature is gated by
# OCIRepository.spec.verify. `spec.sync` has NO `verify` field, so it cannot
# express that gate — which is the whole reason the source is seeded as a
# committed OCIRepository (gitops/deployment/<cluster>/source.yaml) rather than
# generated by the operator. See gitops/CLAUDE.md "Not here yet" and Appendix A
# "GitOps delivery".
#
# ORDER IS LOAD-BEARING: the strict-substitution feature gate is asserted present
# BEFORE the OCI source is seeded, because the failure it guards against
# (peerIP: "" over a working BGPPeer) damages a live cluster rather than failing
# loudly. Controllers first, gate verified, source seeded, only then reconcile.

- name: "[{{ cluster_name }}] Assert the cluster kubeconfig exists"
  ansible.builtin.stat:
    path: "{{ kubeconfig_local }}"
  register: flux_kubeconfig_stat

- name: "[{{ cluster_name }}] Fail with something actionable if it doesn't"
  ansible.builtin.assert:
    that:
      - flux_kubeconfig_stat.stat.exists
    fail_msg: >-
      No kubeconfig at {{ kubeconfig_local }} for cluster '{{ cluster_name }}'.
      Run playbooks/bootstrap-cluster.yml first (or site.yml, which runs both in
      order) — it fetches the kubeconfig from the cluster's k3s server, rewrites
      the server URL to the DMZ IP, and seeds the cluster-topology Secret this
      play needs. Nothing here can recover that on its own: this play never
      touches a node.
    quiet: true

# --- Does the source the artifact is BUILT FROM contain the sync path? -------
# ⚠ In the OCI model Flux reconciles the ARTIFACT, not this branch — but the
# artifact is built from origin/{{ flux_git_branch }} by the gitops-artifact
# workflow, so a sync path missing on the branch is missing from the next
# artifact too. This stays a fast, cheap fail for the "forgot to commit/push the
# deployment dir" class. It is necessary but NOT sufficient: the workflow must
# also have REBUILT the artifact since the push (the OCIRepository Ready gate
# further down is what actually proves the artifact carries this content).
- name: "[{{ cluster_name }}] Refresh the remote ref the artifact is built from"
  ansible.builtin.command:
    cmd: "git fetch --quiet origin {{ flux_git_branch }}"
    chdir: "{{ gitops_dir }}/.."
  changed_when: false
  check_mode: false

- name: "[{{ cluster_name }}] Look for the sync path on the remote branch"
  ansible.builtin.command:
    cmd: "git ls-tree --name-only origin/{{ flux_git_branch }} -- {{ flux_sync_path }}/"
    chdir: "{{ gitops_dir }}/.."
  register: flux_remote_path
  changed_when: false
  check_mode: false

- name: "[{{ cluster_name }}] Assert the sync path exists on the remote"
  ansible.builtin.assert:
    that:
      - (flux_remote_path.stdout | trim | length) > 0
    fail_msg: >-
      `{{ flux_sync_path }}` does not exist on origin/{{ flux_git_branch }} of
      {{ flux_git_url }} — which is what the gitops artifact is built from. It
      may well exist in your working tree; that is irrelevant. Commit and push
      the gitops/ changes, let the gitops-artifact workflow rebuild the artifact,
      then re-run. Without this the OCIRepository resolves but the flux-system
      Kustomization fails with "kustomization path not found".
    quiet: true

# Softer sibling: the path can exist on the remote while the CONTENT is stale —
# uncommitted work under gitops/ never reaches the artifact. Say so plainly.
- name: "[{{ cluster_name }}] Check for uncommitted gitops/ changes"
  ansible.builtin.command:
    cmd: "git status --porcelain -- {{ gitops_dir }}"
    chdir: "{{ gitops_dir }}/.."
  register: flux_gitops_dirty
  changed_when: false
  check_mode: false

- name: "[{{ cluster_name }}] Warn if gitops/ has changes the artifact cannot see"
  ansible.builtin.debug:
    msg: >-
      ⚠ gitops/ has uncommitted changes — they are NOT in the OCI artifact Flux
      reconciles and will be ignored until committed, pushed, and rebuilt:
      {{ flux_gitops_dirty.stdout_lines | join('; ') }}
  when: (flux_gitops_dirty.stdout | trim | length) > 0

# --- The flux-operator ------------------------------------------------------
# Ansible-owned, NOT primed-for-adoption like Calico — nothing in gitops/ manages
# the operator, so there is no second writer. See the group_vars "Flux" section.
- name: "[{{ cluster_name }}] Install/upgrade the flux-operator"
  kubernetes.core.helm:
    name: flux-operator
    # OCI chart: chart_ref carries the full oci:// URL and there is NO
    # chart_repo_url. Needs helm >= 3.8 on PATH.
    chart_ref: "{{ flux_operator_chart_ref }}"
    chart_version: "{{ flux_operator_version }}"
    release_namespace: "{{ flux_namespace }}"
    create_namespace: true
    # No values overrides on purpose: every knob that matters lives in the
    # FluxInstance below, so the chart runs stock and there is no second place
    # to look for Flux's configuration.
    kubeconfig: "{{ kubeconfig_local }}"
    binary_path: "{{ helm_binary | default(omit) }}"
    wait: true
    timeout: 5m0s

# helm --wait returns when the operator Deployment is Available, which is not
# quite the same as "the FluxInstance CRD is servable". Gate on Established, the
# same way the Calico CRD prime does — otherwise the apply below can lose a race
# with CRD registration and fail with "no matches for kind FluxInstance".
- name: "[{{ cluster_name }}] Wait for the FluxInstance CRD to be Established"
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: fluxinstances.fluxcd.controlplane.io
    kubeconfig: "{{ kubeconfig_local }}"
  register: flux_instance_crd
  until: >-
    flux_instance_crd.resources | length > 0 and
    (flux_instance_crd.resources[0].status.conditions | default([])
     | selectattr('type', 'equalto', 'Established')
     | selectattr('status', 'equalto', 'True') | list | length) > 0
  retries: 20
  delay: 5

# --- ⚠ REFUSE an in-place migration from the old GitRepository-sync design ---
# This is the one move that can silently destroy a running cluster. A FluxInstance
# that still carries `spec.sync` was bootstrapped the OLD way: the operator
# generated a `flux-system` GitRepository + Kustomization, and that Kustomization
# (prune: true) OWNS the crds/infrastructure/apps tiers in its inventory. Applying
# the sync-LESS definition below with `apply: true` would strip `spec.sync`, the
# operator would DELETE its generated Kustomization, and its finalizer would
# cascade-prune every tier — taking Calico and the dataplane with it.
#
# We do NOT attempt that migration in place. Clusters here are disposable
# (root CLAUDE.md: never in-place upgrades while the cluster is disposable), so
# the sanctioned path is to re-provision: tear down and re-run site.yml, or at
# minimum delete the old FluxInstance + its generated flux-system source so this
# play starts from a clean flux-system. Fail loudly rather than cascade-prune.
- name: "[{{ cluster_name }}] Read any existing FluxInstance"
  kubernetes.core.k8s_info:
    api_version: fluxcd.controlplane.io/v1
    kind: FluxInstance
    name: flux
    namespace: "{{ flux_namespace }}"
    kubeconfig: "{{ kubeconfig_local }}"
  register: flux_instance_existing

- name: "[{{ cluster_name }}] Refuse to convert a sync-based FluxInstance in place"
  ansible.builtin.assert:
    that:
      - >-
        flux_instance_existing.resources | length == 0 or
        (flux_instance_existing.resources[0].spec.sync is not defined)
    fail_msg: >-
      The FluxInstance on '{{ cluster_name }}' still has `spec.sync` — it was
      bootstrapped the OLD GitRepository-sync way. Do NOT let this play flip it to
      sync-less in place: that strips spec.sync, the operator deletes its
      generated flux-system Kustomization, and its prune cascades through
      crds -> infrastructure -> apps and tears down Calico. This cluster is
      disposable — re-provision it (re-run site.yml from scratch), or if you know
      what you are doing, first `kubectl delete fluxinstance flux -n
      {{ flux_namespace }}` and the generated `flux-system` GitRepository +
      Kustomization, then re-run this play against a clean flux-system.
    quiet: true

# --- The FluxInstance (SYNC-LESS) -------------------------------------------
# ONE CR describes the whole Flux install: distribution, components, sizing. It
# deliberately has NO `spec.sync` — the OCI source is seeded separately below so
# it can carry spec.verify. The operator only reconciles a FluxInstance named
# `flux` in its own namespace.
#
# Deliberately NOT a committed manifest under gitops/: a FluxInstance reconciled
# by the Flux it installs is the self-management footgun called out in
# group_vars. It lives here, inline, like the cluster-topology Secret — one file
# to read for "what did Ansible put on this cluster".
- name: "[{{ cluster_name }}] Build the FluxInstance definition"
  ansible.builtin.set_fact:
    flux_instance:
      apiVersion: fluxcd.controlplane.io/v1
      kind: FluxInstance
      metadata:
        name: flux
        namespace: "{{ flux_namespace }}"
      spec:
        distribution:
          version: "{{ flux_distribution_version }}"
          registry: "{{ flux_distribution_registry }}"
          artifact: "{{ flux_distribution_artifact }}"
        components: "{{ flux_components }}"
        cluster:
          type: kubernetes
          size: "{{ flux_cluster_size }}"
          multitenant: false
          # Restricts ingress to the flux-system namespace from other namespaces.
          # Enforced by Calico here (eBPF dataplane, no kube-proxy), so it is a
          # real control and not decoration.
          networkPolicy: true
          domain: cluster.local
        # ⚠ NO `storage:` — see the group_vars note. It would request a PVC and
        # there is no StorageClass in this cluster until ceph-csi lands.
        #
        # The strict-substitution gate. Applied as a patch onto the Flux
        # manifests the operator builds, because it is a kustomize-controller
        # COMMAND-LINE flag — there is no FluxInstance field for it.
        #
        # `op: add` with a trailing `-` APPENDS to args, which produces a
        # SECOND --feature-gates argument alongside the operator's own
        # (`ObjectLevelWorkloadIdentity=false`). That is fine and deliberate:
        # the flag is a component-base MapStringBool, so repeated occurrences
        # MERGE rather than override — verified live 2026-08-29 via
        # kustomize-controller's startup log, which reports loading both gates.
        # Appending is therefore the version-proof way to add a gate without
        # having to know or restate the operator's existing set. The assert
        # further down checks the EFFECTIVE value, not the argument count.
        kustomize:
          patches:
            - target:
                kind: Deployment
                name: kustomize-controller
              patch: |
                - op: add
                  path: /spec/template/spec/containers/0/args/-
                  value: --feature-gates=StrictPostBuildSubstitutions={{ flux_strict_substitutions | bool | lower }}

# Applied UNCONDITIONALLY on every run. Unlike the old two-phase design, there is
# no `spec.sync` for `apply: true` to strip, so the `when: not exists` guard that
# protected it is GONE — a re-run is a safe no-op (or reconciles a components /
# distribution change), and the OCI source lives in its own objects below.
- name: "[{{ cluster_name }}] Apply the FluxInstance (sync-less)"
  kubernetes.core.k8s:
    definition: "{{ flux_instance }}"
    state: present
    apply: true
    kubeconfig: "{{ kubeconfig_local }}"

- name: "[{{ cluster_name }}] Wait for the Flux controllers to be installed"
  kubernetes.core.k8s_info:
    api_version: fluxcd.controlplane.io/v1
    kind: FluxInstance
    name: flux
    namespace: "{{ flux_namespace }}"
    kubeconfig: "{{ kubeconfig_local }}"
  register: flux_instance_status
  until: >-
    flux_instance_status.resources | length > 0 and
    (flux_instance_status.resources[0].status.conditions | default([])
     | selectattr('type', 'equalto', 'Ready')
     | selectattr('status', 'equalto', 'True') | list | length) > 0
  retries: 40
  delay: 15

# --- Verify the gate BEFORE anything reconciles from the artifact ------------
# Assert, don't hope (§7 item 15's lesson, applied to a different silent failure).
# A missing gate is invisible: substitution still "works", it just fills every
# unresolved placeholder with "" and reports success.
- name: "[{{ cluster_name }}] Read the kustomize-controller Deployment"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: kustomize-controller
    namespace: "{{ flux_namespace }}"
    kubeconfig: "{{ kubeconfig_local }}"
  register: flux_kc_deploy
  until: flux_kc_deploy.resources | length > 0
  retries: 20
  delay: 5

# ⚠ MODELS THE FLAG'S REAL SEMANTICS, DOES NOT COUNT ARGUMENTS. The operator
# already emits its own `--feature-gates=ObjectLevelWorkloadIdentity=false`, so
# appending ours yields TWO --feature-gates arguments — and an earlier draft of
# this assert failed the run on that, on the assumption that a repeated flag
# OVERRIDES and the last one wins.
#
# That assumption was wrong, and the controller settled it: `--feature-gates` is
# a component-base MapStringBool, whose first Set() clears the defaults and whose
# subsequent Set() calls MERGE into the same map. kustomize-controller's own
# startup log confirms it loads BOTH gates:
#   "loading feature gate","ObjectLevelWorkloadIdentity":false
#   "loading feature gate","StrictPostBuildSubstitutions":true
# So appending is the correct way to add a gate without knowing the operator's
# existing set, and the number of arguments is simply not the question.
#
# What IS the question is the effective value, so that is what this computes:
# flatten every --feature-gates argument into k=v pairs in order and fold them
# into a map, last writer winning per key — exactly what the flag parser does.
# This stays correct if the operator adds, removes, or reorders its own gates.
- name: "[{{ cluster_name }}] Assert the StrictPostBuildSubstitutions gate landed"
  vars:
    kc_args: "{{ flux_kc_deploy.resources[0].spec.template.spec.containers[0].args | default([]) }}"
    fg_args: "{{ kc_args | select('match', '^--feature-gates=') | list }}"
    fg_map: >-
      {%- set m = {} -%}
      {%- for pair in fg_args | map('regex_replace', '^--feature-gates=', '')
                              | join(',') | split(',') -%}
      {%- if '=' in pair -%}
      {%- set _ = m.update({(pair.split('=')[0] | trim): (pair.split('=')[1] | trim | lower)}) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ m }}
  ansible.builtin.assert:
    that:
      - fg_map.get('StrictPostBuildSubstitutions', 'absent') == 'true'
    fail_msg: >-
      kustomize-controller's effective feature gates are {{ fg_map }} —
      StrictPostBuildSubstitutions is not enabled. Raw arguments:
      {{ fg_args | join(' ') | default('(no --feature-gates argument at all)', true) }}.
      Without the gate an undefined ${var} in a postBuild substitution becomes the
      empty string and the Kustomization reconciles as HEALTHY — so a missing
      cluster-topology key would apply a BGPPeer with peerIP: "" over the working
      one. The FluxInstance's spec.kustomize.patches is what sets this flag;
      check that the patch target still matches (a Deployment named
      kustomize-controller, args on container 0) for this flux-operator version.
      No OCI source has been seeded yet, so nothing has reconciled — fix the
      patch and re-run.
    quiet: true

# --- Verify the substitution source is complete ------------------------------
# Every ${...} placeholder Flux will substitute must have a key in
# cluster-topology. Under the gate above a missing key is a hard reconcile
# failure rather than silent corruption, so this is about failing HERE with the
# name of the missing key instead of in a Kustomization's status message.
#
# gitops/crds is EXCLUDED deliberately — its Kustomization has no postBuild, so
# nothing there is ever substituted (and it is 3 MB of generated CRD text that
# would be pointless to scan). Keep this list in step with which entrypoints in
# gitops/deployment/<cluster>/ actually carry a `postBuild:` block.
- name: "[{{ cluster_name }}] Find the manifests Flux substitutes into"
  ansible.builtin.find:
    paths:
      - "{{ gitops_dir }}/infrastructure"
      - "{{ gitops_dir }}/apps"
      - "{{ gitops_dir }}/deployment/{{ cluster_name }}"
    patterns:
      - "*.yaml"
      - "*.yml"
    recurse: true
  register: flux_sub_files

# Parsing each file as YAML and searching the re-emitted JSON is deliberate: it
# discards comments exactly the way kustomize does when it re-emits resources, so
# prose like "an undefined ${var} reconciles as empty" doesn't register as a
# required key. (Several such comments exist today; all are correctly ignored.)
#
# ⚠ Known limitation, documented rather than papered over: a `${...}` written in
# a COMMENT inside a file consumed by a configMapGenerator — values.yaml — DOES
# reach the cluster as ConfigMap data and would be missed here. gitops/CLAUDE.md
# covers that case; the strict gate is the backstop that catches it at reconcile.
#
# ⚠ ONE expression with a Jinja loop, NOT a set_fact accumulating over an Ansible
# loop — the same idiom as `k3s_tokens`/`cluster_bgp` in group_vars, and for a
# reason that cost a debugging round: under ansible-core's lazy templating a
# task-level `vars:` entry that references `item` does NOT re-resolve per
# iteration, so the accumulate version ran happily over all files and produced
# an EMPTY list. It would have asserted "nothing missing" against a cluster
# whose topology Secret was empty. Verified this form returns every placeholder.
# Assigning once also means there is no cross-cluster state to reset.
- name: "[{{ cluster_name }}] Collect the ${...} placeholders they carry"
  ansible.builtin.set_fact:
    flux_required_subs: >-
      {%- set out = [] -%}
      {%- for f in flux_sub_files.files | map(attribute='path') | list -%}
      {%- set _ = out.extend(lookup('ansible.builtin.file', f)
                             | from_yaml_all | list | to_json
                             | regex_findall('\\$\\{([a-zA-Z0-9_]+)\\}')) -%}
      {%- endfor -%}
      {{ out | unique | sort }}

- name: "[{{ cluster_name }}] Read the cluster-topology Secret"
  kubernetes.core.k8s_info:
    kind: Secret
    name: cluster-topology
    namespace: "{{ flux_namespace }}"
    kubeconfig: "{{ kubeconfig_local }}"
  register: flux_topology_secret
  # Keys are what matter and they're plaintext, but the values are in the result
  # either way — don't log it.
  no_log: true

- name: "[{{ cluster_name }}] Assert cluster-topology covers every placeholder"
  vars:
    have: "{{ (flux_topology_secret.resources[0].data | default({})).keys() | list }}"
    need: "{{ flux_required_subs }}"
    missing: "{{ flux_required_subs | difference(have) }}"
  ansible.builtin.assert:
    that:
      - flux_topology_secret.resources | length == 1
      - missing | length == 0
    fail_msg: >-
      cluster-topology in {{ flux_namespace }} does not cover every ${...}
      placeholder under gitops/. Missing key(s): {{ missing | join(', ') }}.
      Needed: {{ need | join(', ') }}. That Secret is seeded by
      playbooks/bootstrap-cluster.yml ("Seed the cluster-topology Secret") — add
      the key there so it is reproducible, never with a one-off kubectl. If the
      Secret is absent entirely, bootstrap-cluster.yml has not run against this
      cluster.
    quiet: true

# --- Seed the signed OCI source — Ansible primes, Flux adopts ----------------
# Gate verified, substitution source complete: now seed the source. Both objects
# are the SAME committed files Flux later reconciles from the artifact
# (source.yaml, sync.yaml) — "one source, primed twice", exactly like Calico's
# values.yaml. They carry no ${...} placeholders, so they apply verbatim. Flux
# then adopts and drift-corrects them because sync.yaml reconciles the very
# directory both live in.
#
# ⚠ The OCIRepository is applied and CONFIRMED verified BEFORE the root
# Kustomization, so a bad or unsigned artifact fails here — loudly, with nothing
# reconciled — instead of the root pulling unverifiable content.
- name: "[{{ cluster_name }}] Seed the signed OCIRepository (source.yaml)"
  kubernetes.core.k8s:
    src: "{{ gitops_dir }}/deployment/{{ cluster_name }}/source.yaml"
    state: present
    apply: true
    kubeconfig: "{{ kubeconfig_local }}"

# Ready here is meaningful: with spec.verify set, source-controller marks the
# OCIRepository Ready ONLY after it has pulled the artifact AND verified the
# cosign signature against our GitHub OIDC identity. So this single wait proves
# the signature gate works end to end on this cluster.
- name: "[{{ cluster_name }}] Wait for the OCIRepository to pull + verify"
  kubernetes.core.k8s_info:
    api_version: source.toolkit.fluxcd.io/v1
    kind: OCIRepository
    name: "{{ flux_namespace }}"
    namespace: "{{ flux_namespace }}"
    kubeconfig: "{{ kubeconfig_local }}"
  register: flux_ocirepo
  until: >-
    flux_ocirepo.resources | length > 0 and
    (flux_ocirepo.resources[0].status.conditions | default([])
     | selectattr('type', 'equalto', 'Ready')
     | selectattr('status', 'equalto', 'True') | list | length) > 0
  retries: 30
  delay: 10

- name: "[{{ cluster_name }}] Seed the root flux-system Kustomization (sync.yaml)"
  kubernetes.core.k8s:
    src: "{{ gitops_dir }}/deployment/{{ cluster_name }}/sync.yaml"
    state: present
    apply: true
    kubeconfig: "{{ kubeconfig_local }}"

# The tiers, in the order their dependsOn chain resolves them. Each is waited on
# separately so a failure names the tier — "infrastructure not Ready" and "apps
# not Ready" mean very different things, and `crds` failing means the other two
# never even started.
#
# This is where ADOPTION happens, and it is the step to watch on a first run:
# Flux takes over the Calico CRDs (server-side applied by Ansible under a
# different field manager), the tigera-operator Helm release (installed by the
# helm CLI), and the projectcalico.org/v3 BGP CRs. All three were primed from
# these same committed files, so the desired state matches and the takeover
# should be quiet. See README "Verify" for what to check if it isn't.
- name: "[{{ cluster_name }}] Wait for each Flux Kustomization tier to be Ready"
  kubernetes.core.k8s_info:
    api_version: kustomize.toolkit.fluxcd.io/v1
    kind: Kustomization
    name: "{{ item }}"
    namespace: "{{ flux_namespace }}"
    kubeconfig: "{{ kubeconfig_local }}"
  register: flux_kustomization
  until: >-
    flux_kustomization.resources | length > 0 and
    (flux_kustomization.resources[0].status.conditions | default([])
     | selectattr('type', 'equalto', 'Ready')
     | selectattr('status', 'equalto', 'True') | list | length) > 0
  retries: 40
  delay: 15
  loop:
    - crds
    - infrastructure
    - apps

# Adoption check with teeth. The HelmRelease being Ready proves helm-controller
# took over the release rather than colliding with it; the node still being Ready
# proves the takeover didn't disrupt the CNI underneath it. A diff war would show
# up as either the HelmRelease stuck not-Ready or Calico pods restarting.
- name: "[{{ cluster_name }}] Confirm Flux adopted the Calico HelmRelease"
  kubernetes.core.k8s_info:
    api_version: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    name: tigera-operator
    namespace: tigera-operator
    kubeconfig: "{{ kubeconfig_local }}"
  register: flux_calico_hr
  until: >-
    flux_calico_hr.resources | length > 0 and
    (flux_calico_hr.resources[0].status.conditions | default([])
     | selectattr('type', 'equalto', 'Ready')
     | selectattr('status', 'equalto', 'True') | list | length) > 0
  retries: 30
  delay: 10

- name: "[{{ cluster_name }}] Confirm the node(s) are still Ready after adoption"
  kubernetes.core.k8s_info:
    kind: Node
    kubeconfig: "{{ kubeconfig_local }}"
  register: flux_node_info
  until: >-
    flux_node_info.resources | length > 0 and
    (flux_node_info.resources | map(attribute='status.conditions', default=[]) | flatten
     | selectattr('type', 'equalto', 'Ready')
     | selectattr('status', 'equalto', 'True') | list | length)
    == (flux_node_info.resources | length)
  retries: 20
  delay: 10

- name: "[{{ cluster_name }}] Report"
  ansible.builtin.debug:
    msg: >-
      Cluster `{{ cluster_name }}`: Flux {{ flux_distribution_version }} installed via
      flux-operator {{ flux_operator_version }}, reconciling the SIGNED OCI artifact
      {{ flux_ocirepo.resources[0].spec.url }}:{{ flux_ocirepo.resources[0].spec.ref.tag }}
      (cosign-verified) at {{ flux_ocirepo.resources[0].status.artifact.revision | default('unknown') }}.
      Strict post-build substitutions ON; cluster-topology covers
      {{ flux_required_subs | length }} placeholder(s)
      ({{ flux_required_subs | join(', ') }}).
      Calico HelmRelease adopted (helm revision
      {{ flux_calico_hr.resources[0].status.history[0].version | default('unknown') }});
      {{ flux_node_info.resources | length }} node(s) Ready.
      From here on, change the cluster through Git (which rebuilds the artifact) —
      not through Ansible.
