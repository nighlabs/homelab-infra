---
# Fetch every secret from 1Password into the `secrets` fact (+ `secret_names`),
# using the `op` CLI in SERVICE ACCOUNT mode. Reached only via
# tasks/load-secrets.yml — never include this directly.
#
# ONE `op item get` per ITEM, not per value: the ~29 values live as labelled
# fields on a small number of items, so a full site.yml costs a couple of dozen
# API calls against a 1,000/24h account-wide cap. Layout: ../SECRETS.md.
# Decision and alternatives: docs/decisions/0034-secrets-store-1password.md.
#
# WHY THE CLI RATHER THAN THE PYTHON SDK — a deliberate reversal of ADR-0027,
# which rejected "shelling out to `bws secret list`" as brittle. Every word of
# that rejection was about Bitwarden and none of it survives the move:
#   * "when the SDK is already a dependency" — it isn't. 1Password's Python SDK
#     would be a NEW dependency, 0.x with documented breaking changes between
#     minors, carrying a native libssl/glibc requirement that constrains any
#     Linux control node or CI runner. `op` is a static Go binary.
#   * "output parsing" meant scraping a human-readable table. `--format json`
#     is a published contract, and the item JSON is the same shape `op item
#     create` consumes.
#   * "binary on PATH" is real, and is the price. This repo already depends on
#     butane, helm and kubectl the same way; `op` joins that list in README.md.
# The SDK's one genuine advantage — richer "no vault by that title, this
# account can see: …" diagnostics — is bought back by the assert below.
#
# ⚠ SERVICE ACCOUNT mode, never `op signin` / desktop-app biometrics. Biometric
# unlock authenticates as YOU, with your full personal vault access, and is
# interactive-only — it would discard the least-privilege split that the whole
# two-vault layout exists to protect. Touch ID is still available with NO repo
# change: keep the scoped service-account token and export it from a personal
# 1Password item; the precedence chain below already honours the environment.

- name: Check for the op CLI
  ansible.builtin.command: op --version
  register: op_version_check
  changed_when: false
  failed_when: false
  run_once: true
  delegate_to: localhost

# rc FIRST: assert short-circuits on the first false condition, so a missing
# binary reports "not installed" rather than running `is version` on ''.
- name: Assert the op CLI is present and recent enough
  ansible.builtin.assert:
    that:
      - op_version_check.rc == 0
      - (op_version_check.stdout | trim) is version(op_min_version, '>=')
    fail_msg: >-
      {% if op_version_check.rc != 0 %}
      The 1Password CLI (`op`) is not on PATH. Install it with
      `brew install 1password-cli`, or from
      https://developer.1password.com/docs/cli/get-started/ on a Linux control
      node. It is an external binary prerequisite like butane and helm — see
      ansible/README.md, "Control-node prerequisites".
      {% else %}
      op {{ op_version_check.stdout | trim }} is too old: service-account
      authentication needs >= {{ op_min_version }}. Upgrade with
      `brew upgrade 1password-cli`. Below that version `op` ignores
      OP_SERVICE_ACCOUNT_TOKEN and tries to use an interactive session instead,
      which in a playbook simply hangs.
      {% endif %}
    quiet: true
  run_once: true
  delegate_to: localhost

# ⚠ A real trap, and a SILENT one: 1Password documents OP_CONNECT_HOST and
# OP_CONNECT_TOKEN as taking PRECEDENCE over OP_SERVICE_ACCOUNT_TOKEN. A stray
# pair left over from some other project redirects every call below to a
# Connect server, where the vault either doesn't exist (confusing 404) or does
# and is someone else's. Refuse rather than authenticate as something we didn't
# choose. (Connect itself is not a candidate here — it carries a deprecation
# notice pointing at the SDK/CLI service-account path.)
- name: Assert no 1Password Connect variables are shadowing the service account
  ansible.builtin.assert:
    that:
      - (lookup('ansible.builtin.env', 'OP_CONNECT_HOST') | trim | length) == 0
      - (lookup('ansible.builtin.env', 'OP_CONNECT_TOKEN') | trim | length) == 0
    fail_msg: >-
      OP_CONNECT_HOST/OP_CONNECT_TOKEN are set in the environment, and 1Password
      gives them precedence over OP_SERVICE_ACCOUNT_TOKEN — so this run would
      silently read from a Connect server instead of the service account.
      `unset OP_CONNECT_HOST OP_CONNECT_TOKEN` and re-run.
    quiet: true
  run_once: true
  delegate_to: localhost

- name: Resolve the 1Password service account token
  # Secret zero — the one credential that can never come from 1Password itself.
  # Default: macOS Keychain, read at run time, so nothing secret lives in the
  # repo directory. ⚠ NOT Touch ID: `security` has no biometry flag, so an item
  # created with -T "" prompts for the LOGIN PASSWORD, once per play. See
  # group_vars/all/vars.yml next to op_keychain_command for the full details.
  # Override with -e op_service_account_token=... or OP_SERVICE_ACCOUNT_TOKEN in
  # the environment (CI, Linux control nodes) — the Keychain path is a default,
  # not a hard requirement.
  ansible.builtin.set_fact:
    op_service_account_token: >-
      {{ op_service_account_token
         | default(lookup('ansible.builtin.env', 'OP_SERVICE_ACCOUNT_TOKEN'), true)
         | default(lookup('ansible.builtin.pipe', op_keychain_command), true) }}
  no_log: true
  run_once: true
  delegate_to: localhost

- name: Assert secret zero was found
  ansible.builtin.assert:
    that:
      - op_service_account_token is defined
      - (op_service_account_token | trim | length) > 0
    fail_msg: >-
      No 1Password service account token. Add it to the LOCAL login keychain
      with:
        security add-generic-password -a "{{ op_keychain_account }}"
          -s {{ op_keychain_service }} -U -w
      (-w MUST be last: with no value after it, `security` prompts, keeping the
      token out of shell history. Note this is the local login keychain, NOT the
      Passwords app — that is the synced iCloud keychain, a different store the
      `security` CLI cannot see.) Or export OP_SERVICE_ACCOUNT_TOKEN, or pass
      -e op_service_account_token=... The token is shown EXACTLY ONCE when the
      service account is created and cannot be retrieved afterwards; if it is
      lost, create a new service account. See ansible/SECRETS.md.

      ⚠ Before creating a SECOND item: this message also appears when the item
      EXISTS but could not be read — a locked keychain, or an authorization
      dialog that was dismissed or denied (`security` exit 51). The lookup
      masks the distinction so that a genuinely missing item reaches this
      message at all. Check first with:
        security find-generic-password -w -s {{ op_keychain_service }} -a "{{ op_keychain_account }}"
      which prints the token on success, or names the real error.
    quiet: true
  run_once: true
  delegate_to: localhost

# One call per item. ⚠ `--vault` is REQUIRED, not tidiness: 1Password mandates
# it whenever the service account can see more than one vault, and the
# control-node account can (it also reads the apps vault, a grant that is
# IMMUTABLE and so had to be made at creation time — ADR-0034).
#
# The token goes through `environment:`, never argv — argv is world-readable in
# `ps` for the lifetime of the process.
- name: Fetch the 1Password items
  ansible.builtin.command:
    argv:
      - op
      - item
      - get
      - "{{ op_item }}"
      - --vault
      - "{{ op_vault }}"
      - --format
      - json
  environment:
    OP_SERVICE_ACCOUNT_TOKEN: "{{ op_service_account_token }}"
  loop: "{{ op_items }}"
  loop_control:
    loop_var: op_item
  register: op_fetch
  changed_when: false
  # Checked by the assert below, which can say far more about WHY than a bare
  # non-zero exit does.
  failed_when: false
  # stdout carries every secret value. stderr does not — 1Password's errors name
  # the vault and item, never a field value — which is what lets the assert
  # below quote it.
  no_log: true
  run_once: true
  delegate_to: localhost

- name: Assert every item was read
  vars:
    _failed: "{{ op_fetch.results | rejectattr('rc', 'equalto', 0) | list }}"
    _stderr: "{{ _failed | map(attribute='stderr') | map('trim') | join(' | ') }}"
  ansible.builtin.assert:
    that:
      - _failed | length == 0
    fail_msg: >-
      Could not read {{ _failed | map(attribute='op_item') | join(', ') }} from
      the 1Password vault '{{ op_vault }}'. op said: {{ _stderr }}

      Common causes, in the order worth checking:
      {% if 'rate' in _stderr | lower or '429' in _stderr %}
      ⚠ RATE LIMITED. The daily cap is per ACCOUNT and shared across every
      service account — not per token. On Individual/Families that is 1,000
      requests per 24h, and it does NOT reset on the hour. Wait for the window,
      and see ADR-0034 on pinning item/vault UUIDs to cut calls.
      {% endif %}
      (1) the token is expired or was created for a different account —
      service-account tokens are shown once and can carry an expiry;
      (2) no vault TITLED '{{ op_vault }}', or the service account has no grant
      on it. ⚠ Vault access is IMMUTABLE, so a missing grant cannot be added —
      it needs a new service account. Also note a service account can never
      read a built-in Personal/Private/Employee vault or the default Shared
      vault; `op vault list` shows what this token can actually see;
      (3) no item TITLED '{{ _failed | map(attribute="op_item") | join(", ") }}'
      in that vault — `op item list --vault {{ op_vault }}`.
      Layout and setup: ansible/SECRETS.md.
    quiet: true
  run_once: true
  delegate_to: localhost

# Flatten every item's fields into one list, then index by label.
#
# ⚠ Two filters here are load-bearing, not defensive noise:
#   - `notesPlain` is the note body 1Password attaches to every Secure Note
#     item. It is not a secret of ours and must never become one.
#   - empty values are dropped so a half-created field reads as ABSENT rather
#     than as the empty string. That matters because optional secrets
#     (k3s_tls_sans_<cluster>) are detected by absence, and "" would silently
#     satisfy a presence check while contributing nothing.
- name: Collect the fields from every item
  vars:
    _fields: >-
      {{ op_fetch.results | map(attribute='stdout') | map('from_json')
         | selectattr('fields', 'defined') | map(attribute='fields') | flatten
         | rejectattr('id', 'equalto', 'notesPlain')
         | selectattr('value', 'defined')
         | rejectattr('value', 'equalto', '')
         | list }}
  ansible.builtin.set_fact:
    op_fields: "{{ _fields }}"
  no_log: true
  run_once: true
  delegate_to: localhost

# Labels are the secret NAMES — group_vars/all/vars.yml indexes `secrets` by
# them — so they must be unique across ALL items, not just within one. Two
# fields sharing a label means one silently wins and a value you never see is
# in play; refuse rather than pick. (ESO's 1Password provider enforces the same
# constraint with "found multiple labels with the same key", so a layout that
# trips this here would have tripped it there too.)
- name: Assert field labels are unique across the items
  vars:
    _labels: "{{ op_fields | map(attribute='label') | list }}"
    # Single-expression Jinja loop — the repo's idiom (see k3s_tokens in
    # group_vars/all/vars.yml) — because a task-level vars entry referencing
    # `item` does not re-resolve per iteration under this ansible-core.
    _dupes: >-
      {%- set seen = [] -%}
      {%- set dup = [] -%}
      {%- for label in _labels -%}
      {%- if label in seen -%}{%- set _ = dup.append(label) -%}
      {%- else -%}{%- set _ = seen.append(label) -%}{%- endif -%}
      {%- endfor -%}
      {{ dup | unique | list }}
  ansible.builtin.assert:
    that:
      - _dupes | length == 0
    fail_msg: >-
      Duplicate field label(s) across the 1Password items
      ({{ op_items | join(', ') }}): {{ _dupes | join(', ') }}. Field labels are
      the secret names, so they must be globally unique across every item this
      account reads — rename one. ⚠ 1Password does NOT enforce this itself; two
      items may each carry a field called `base_domain` quite happily.
    quiet: true
  run_once: true
  delegate_to: localhost

- name: Expose the secrets as `secrets`
  ansible.builtin.set_fact:
    secrets: "{{ op_fields | items2dict(key_name='label', value_name='value') }}"
  no_log: true
  run_once: true
  delegate_to: localhost

# The NAME LIST as its own fact, deliberately separate from the values and
# deliberately NOT no_log (ADR-0033). Sorted here, because the backend contract
# says sorted and `op` returns fields in item order, not alphabetically.
#
# ⚠ Safe to log BECAUSE it is a separate fact. Never fold it back into
# `secrets`, and never derive it with `secrets.keys()` at a call site — that
# separation is the property being bought.
- name: Expose the secret names as `secret_names`
  ansible.builtin.set_fact:
    secret_names: "{{ op_fields | map(attribute='label') | sort | list }}"
  run_once: true
  delegate_to: localhost

# Safe to print: names and a count, never values. This is the task to read when
# a `{{ secrets.something }}` comes back undefined — it tells you whether the
# secret is missing from 1Password or just misspelled here.
- name: Report which secrets were loaded
  ansible.builtin.debug:
    msg: >-
      Loaded {{ secret_names | length }} secret(s) from 1Password vault
      '{{ op_vault }}' ({{ op_items | length }} item(s), {{ op_items | length }}
      API call(s)): {{ secret_names | join(', ') }}
    verbosity: 1
  run_once: true
  delegate_to: localhost
