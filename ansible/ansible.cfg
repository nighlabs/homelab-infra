[defaults]
inventory = inventory/hosts.yml
roles_path = roles
# Keep the community.proxmox collection in-repo (isolated, like the uv venv)
# instead of the shared ~/.ansible path. Install with:
#   uv run ansible-galaxy collection install -r requirements.yml
# Relative to the CWD when ansible runs (this dir) -> ansible/.ansible/collections.
collections_path = ./.ansible
host_key_checking = False
# YAML-formatted task output via the *built-in* default callback — the old
# `stdout_callback = yaml` lived in community.general, which we no longer pull.
# This is the ansible-core-native equivalent (no collection dependency).
callback_result_format = yaml
retry_files_enabled = False
nocows = True
interpreter_python = auto_silent
# ⚠ There is no `library =` setting and no library/ directory. The secret store
# needs no custom module — the load task shells out to the `op` CLI — and the
# Bitwarden bulk-fetch modules that used to live there are gone with it
# (docs/decisions/0034-secrets-store-1password.md). Re-add both if a genuine
# custom module ever appears.

# Secrets come from 1Password at RUN TIME — there is no vault.yml and no vault
# passphrase, and on a workstation no secret zero either: `op` authenticates
# against the local 1Password app, so no token is stored anywhere. A scoped
# service-account token is used only where no app can run (CI, a Linux control
# node, ESO in-cluster). See ansible/SECRETS.md and, for why,
# docs/decisions/0034-secrets-store-1password.md.

[ssh_connection]
pipelining = True
