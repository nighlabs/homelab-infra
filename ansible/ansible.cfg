[defaults]
inventory = inventory/hosts.yml
roles_path = roles
# Keep the community.proxmox collection in-repo (isolated, like the uv venv)
# instead of the shared ~/.ansible path. Install with:
#   uv run ansible-galaxy collection install -r requirements.yml
# Relative to the CWD when ansible runs (this dir) -> ansible/.ansible/collections.
collections_path = ./.ansible
host_key_checking = False
# YAML-formatted task output via the *built-in* default callback — the old
# `stdout_callback = yaml` lived in community.general, which we no longer pull.
# This is the ansible-core-native equivalent (no collection dependency).
callback_result_format = yaml
retry_files_enabled = False
nocows = True
interpreter_python = auto_silent
# Custom modules (relative to this dir, same as roles_path/collections_path).
# ⚠ Holds only the retained Bitwarden fetch modules. The 1Password path needs
# no custom module at all — it shells out to the `op` CLI — so this setting
# goes when library/ empties out (docs/decisions/0034-secrets-store-1password.md).
library = ./library

# Secrets come from 1Password at RUN TIME — there is no vault.yml and no vault
# passphrase. Secret zero (the service-account token) lives in the macOS
# Keychain and is read per run; nothing secret is stored in this repo. See
# ansible/SECRETS.md and, for why,
# docs/decisions/0034-secrets-store-1password.md.

[ssh_connection]
pipelining = True
