[defaults]
inventory = inventory/hosts.yml
roles_path = roles
# Keep the community.proxmox collection in-repo (isolated, like the uv venv)
# instead of the shared ~/.ansible path. Install with:
#   uv run ansible-galaxy collection install -r requirements.yml
# Relative to the CWD when ansible runs (this dir) -> ansible/.ansible/collections.
collections_path = ./.ansible
host_key_checking = False
# YAML-formatted task output via the *built-in* default callback — the old
# `stdout_callback = yaml` lived in community.general, which we no longer pull.
# This is the ansible-core-native equivalent (no collection dependency).
callback_result_format = yaml
retry_files_enabled = False
nocows = True
interpreter_python = auto_silent
# Custom modules (relative to this dir, same as roles_path/collections_path).
# Holds bws_secrets — the bulk Bitwarden Secrets Manager fetch.
library = ./library

# Secrets come from Bitwarden Secrets Manager at RUN TIME — there is no
# vault.yml and no vault passphrase. Secret zero (the BWS machine-account token)
# lives in the macOS Keychain and is read per run; nothing secret is stored in
# this repo. See ansible/README.md and, for why,
# docs/decisions/0027-control-node-secrets-bws-runtime.md.

[ssh_connection]
pipelining = True
