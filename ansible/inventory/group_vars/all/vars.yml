---
# Structure + defaults shared by every play/role. This file is COMMITTED, so it
# holds only:
#   - generic, non-revealing constants (MAC OUI, Flatcar channel/version), and
#   - the *shape* of the config, with every environment-revealing value pulled
#     in via a {{ secrets.* }} reference.
#
# Everything sensitive — internal IPs, subnets, VLANs, gateways, hostnames,
# storage names, the SSH public key, and the full API credential — lives in
# **1Password** and is fetched at run time into the `secrets` fact by
# playbooks/tasks/load-secrets.yml. There is no vault.yml. Nothing here exposes
# the real environment; you can read the structure without any credential, but
# not the values. Items, fields and setup: ../SECRETS.md.
#
# ⚠ This file is the ONLY place `secrets` is indexed (ADR-0033). A play or role
# consumes `{{ proxmox_api_host }}`, never `{{ secrets.proxmox_api_host }}`.
# Questions about which secrets EXIST go to the `secret_names` fact, not to
# `secrets.keys()` — that is what keeps such tasks out of no_log's reach.
#
# ⚠ These references are LAZILY templated — they resolve when used, not when
# group_vars loads. A play that forgets to include load-secrets.yml fails
# loudly with "'secrets' is undefined" rather than rendering empty strings.
#
# NOTE: the network *topology* is also described in the root CLAUDE.md — if the
# goal is truly zero topology in git, that doc would need scrubbing too.

# --- DNS -------------------------------------------------------------------
# Static resolvers, injected into eth0's networkd unit (ansible/CLAUDE.md "Node map and derivation").
dns_servers: "{{ secrets.dns_servers.splitlines() | map('trim') | reject('equalto', '') | list }}"

# --- Networks --------------------------------------------------------------
# eth0: DMZ / k3s cluster-facing. Plain 1500 MTU, has the default route.
# prefix/MTU are generic constants (kept in cleartext); the revealing bits
# (subnet, VLAN tag, bridge, gateway) come from the vault.
dmz_network:
  subnet_base: "{{ secrets.dmz_subnet_base }}"
  prefix: 24
  vlan: "{{ secrets.dmz_vlan | int }}"
  bridge: "{{ secrets.dmz_bridge }}"
  gateway: "{{ secrets.dmz_gateway }}"

# eth1: Ceph public network. Tagged on vmbr* , jumbo frames end-to-end.
# NO gateway — this NIC must never carry a default route (Ceph mons/OSDs only).
ceph_public_network:
  subnet_base: "{{ secrets.ceph_subnet_base }}"
  prefix: 24
  vlan: "{{ secrets.ceph_vlan | int }}"
  bridge: "{{ secrets.ceph_bridge }}"
  mtu: 8996

# Proxmox's registered OUI — matches what PVE auto-generates. Public/generic
# (everyone's PVE uses it), so it stays in cleartext. MACs are derived per node
# as <oui>:00:<node_number hex>:<nic index>.
mac_oui: "BC:24:11"

# --- SSH access ------------------------------------------------------------
# Dedicated low-privilege admin user created on each node (not `core`). Shared
# because the bootstrap play (playbooks/bootstrap-cluster.yml) SSHes in as this
# user, and the flatcar_vm role bakes it into Ignition — one definition for both.
node_user: "admin"

# Public key(s) authorized for the node's admin user (key-only; no passwords).
# A public key isn't a secret, but it's identity-revealing, so it's vaulted too.
ssh_authorized_keys: "{{ secrets.ssh_authorized_keys.splitlines() | map('trim') | reject('equalto', '') | list }}"

# --- Proxmox connection ----------------------------------------------------
# API access for the proxmox_* modules (run from the control node). Uses a
# scoped API token, NOT root@pam (docs/decisions/0005-flatcar-k3s-sysext-ignition-config-drive.md).
# Host, node name, storage, and the full credential are all vaulted.
proxmox_api_host: "{{ secrets.proxmox_api_host }}"
proxmox_api_user: "{{ secrets.proxmox_api_user }}"
proxmox_api_token_id: "{{ secrets.proxmox_api_token_id }}"
proxmox_api_token_secret: "{{ secrets.proxmox_api_token_secret }}"

# PVE ships a self-signed API cert (port 8006) and the control node has no CA to
# verify it against, so the proxmox_* API modules fail with CERTIFICATE_VERIFY_
# FAILED. Default false for the stock self-signed setup; flip to true only if
# you've installed a cert on the PVE API that the control node actually trusts.
# (The template-build role is unaffected — it uses `qm` over SSH, not the API.)
proxmox_validate_certs: false

# Proxmox cluster node NAME (as PVE knows it) to create the VM on — vaulted.
proxmox_node: "{{ secrets.proxmox_node }}"
# Inventory host alias we SSH into for snippet upload + `qm` fallbacks. This is
# a generic, non-revealing alias defined in inventory/hosts.yml (the real
# address/user it points to are brokered below) — safe in cleartext.
proxmox_ssh_host: "pve"

# Where that alias actually points, and who it logs in as. Brokered here rather
# than dereferenced in inventory/hosts.yml, which is the only consumer of the
# address (ADR-0033): this file is the single place the secret store is read
# from, and "only one consumer" is why these two were the last values without a
# brokered name. hosts.yml still needs the hostvars['localhost'] indirection —
# see the comment there; that is about WHICH host's namespace resolves them,
# which is a separate problem from where the store is read.
proxmox_ssh_addr: "{{ secrets.proxmox_ssh_addr }}"
proxmox_ssh_user: "{{ secrets.proxmox_ssh_user }}"

# How to invoke Proxmox's root-only `qm` CLI over SSH. PVE's CLI tools ignore
# the API token/ACL system and require root, so when SSHing as a non-root
# `provisioner` user (recommended — see README) we escalate with sudo, scoped
# to just `qm` via /etc/sudoers.d/provisioner. As root, call it directly. Works
# both ways, so the ssh user is a free choice.
proxmox_qm: "{{ 'qm' if proxmox_ssh_user == 'root' else 'sudo qm' }}"
# Same idea for the snippet-dir repair in flatcar_vm (PVE resets that dir's
# group+setgid on storage activation). ⚠ The sudoers rules are FIXED-ARGUMENT,
# so the repair commands must match them byte-for-byte — changing
# the `proxmox_snippet_dir` secret, the group, or the mode means updating
# /etc/sudoers.d/provisioner on every PVE node too (README step 4).
proxmox_sudo: "{{ '' if proxmox_ssh_user == 'root' else 'sudo ' }}"
proxmox_snippet_group: "pve-snippets"
proxmox_snippet_mode: "2770"

# Storage targets — names reveal the environment, so they're vaulted.
proxmox_vm_storage: "{{ secrets.proxmox_vm_storage }}"
proxmox_snippet_storage: "{{ secrets.proxmox_snippet_storage }}"
proxmox_snippet_dir: "{{ secrets.proxmox_snippet_dir }}"

# --- Flatcar template ------------------------------------------------------
# Generic upstream image coordinates — not environment-specific, kept cleartext.
flatcar_channel: "stable"
flatcar_version: "current"
flatcar_template_vmid: 9000
flatcar_template_name: "flatcar-stable"

# --- k3s -------------------------------------------------------------------
# Baked into a node's Ignition when its role is a k3s role (see
# roles/flatcar_vm/tasks/preflight.yml). Delivered via the Flatcar k3s sysext
# (ADR-0005) — immutable, systemd-sysupdate-updatable, Renovate-trackable.
#
# k3s_version is the exact seed asset fetched at provision time; the sysext .raw
# is https://extensions.flatcar.org/extensions/k3s-<version>-x86-64.raw . Bump it
# (Renovate marker) when seeding a new node.
#
# This is the FLEET DEFAULT. A cluster may override it with `k3s_version:` in
# its block in inventory/nodes.yml — which is what lets you stage a minor bump
# on one cluster while another stays put, instead of moving everything at once.
# Unlike the Calico version, nothing in gitops/ consumes this: it reaches a node
# through Ignition only (butane.yaml.j2, k3s-sysupdate.conf.j2), so per-cluster
# k3s versions cost nothing on the Flux side.
k3s_version_default: "v1.36.2+k3s1"

# k3s_minor is the systemd-sysupdate feature name / MatchPattern minor pin —
# patch releases within it auto-apply, minor bumps are a deliberate change.
#
# It is DERIVED from the effective k3s_version (`v1.36.2+k3s1` -> `v1.36`) rather
# than stated separately, because the two must satisfy minor ⊂ version and
# keeping that by hand is exactly the kind of two-place edit that drifts. A
# cluster can still override `k3s_minor:` in nodes.yml if it ever needs to;
# preflight asserts the containment either way, so the override can't silently
# be wrong.
#
# ⚠ Do NOT reference these two directly in a template — preflight.yml resolves
# the per-node `k3s_version` / `k3s_minor` from the node's cluster.

# Cluster-internal CIDRs — pinned explicitly (never left as k3s implicit
# defaults) so Calico's IPPool always matches (docs/architecture.md §4.2).
# In 10.0.0.0/8; NEVER CGNAT 100.64.0.0/10 (root CLAUDE.md).
k3s_cluster_cidr: "10.42.0.0/16"
k3s_service_cidr: "10.43.0.0/16"

# Cluster join tokens — a MAP KEYED BY CLUSTER NAME (the `clusters:` keys in
# inventory/nodes.yml). Per-cluster, not fleet-wide, for two reasons:
#
#   - It is the credential that admits a node to a cluster. One shared token
#     means a leak from any cluster is a leak for every cluster.
#   - k3s also derives the key encrypting bootstrap data in the datastore from
#     the server token, so sharing the token shares that key material too.
#
# roles/flatcar_vm/tasks/preflight.yml resolves a node's `k3s_token` from
# node.cluster. ⚠ Baked into each node's Ignition, which is why
# provision-nodes.yml destroys the .ign once the node has booted (see
# destroy_ignition_snippet).
#
# Assembled from ONE FIELD PER CLUSTER, named `k3s_token_<cluster>`. Each
# is a plain scalar string, so every secret stays paste-into-a-field editable —
# no JSON hand-authored into a textarea with no validation (ADR-0027).
#
# ⚠ A cluster with no matching secret is OMITTED rather than defaulted, so the
# preflight assert in roles/flatcar_vm can name the missing cluster. Never make
# this raise: an exception here surfaces as a stack trace pointing at THIS line
# while Ansible evaluates the assert's own conditional, and the carefully-worded
# fail_msg never renders. An incomplete map reaches the assert, which then fails
# with a message you can act on. The assert is mandatory for every k3s node, so
# nothing is silently permitted by being lenient here.
k3s_tokens: >-
  {%- set out = {} -%}
  {%- for name in clusters -%}
  {%- if ('k3s_token_' ~ name) in secrets -%}
  {%- set _ = out.update({name: secrets['k3s_token_' ~ name]}) -%}
  {%- endif -%}
  {%- endfor -%}
  {{ out }}

# Extra API-server cert SANs beyond the node IP + hostname the config always
# includes — also keyed by cluster name, and per-cluster by nature: a stable API
# DNS name or VIP belongs to exactly one cluster, so a fleet-wide list would put
# cluster B's name into cluster A's certificate. Optional per cluster; a missing
# entry means "no extra SANs".
# Same shape: optional `k3s_tls_sans_<cluster>` secrets, newline-separated so a
# multi-SAN list pastes in as lines rather than needing an encoding. A cluster
# with no such secret simply gets no extra SANs.
k3s_tls_sans_by_cluster: >-
  {%- set out = {} -%}
  {%- for name in clusters -%}
  {%- if ('k3s_tls_sans_' ~ name) in secrets -%}
  {%- set _ = out.update({name: secrets['k3s_tls_sans_' ~ name].splitlines()
                                 | map('trim') | reject('equalto', '') | list}) -%}
  {%- endif -%}
  {%- endfor -%}
  {{ out }}

# --- Post-boot snippet cleanup (playbooks/provision-nodes.yml) -------------
# After a node boots, provision-nodes.yml removes `cicustom` from its VM config
# and deletes its `<hostname>.ign` from the Proxmox snippet storage. That file
# embeds the k3s join token above, and Ignition consumes it EXACTLY ONCE
# (`ignition.firstboot` is cleared on that boot) — so past first boot it's a live
# credential with no purpose, on storage every hypervisor can reach.
# Full rationale + the ordering trap: playbooks/tasks/destroy-ignition-snippet.yml
# and docs/decisions/0025-destroy-ignition-snippet-after-first-boot.md.
#
# Set false to keep the snippets — the escape hatch for debugging a first boot
# (it's also the on-storage record of what config a node actually got, which is
# otherwise reproducible from the vault + node map, not data). Turning it off
# ALSO skips the SSH up-check that gates it, so the play won't block on a node
# that never comes up.
destroy_ignition_snippet: true

# How long to wait for a provisioned node's SSH before treating it as failed to
# boot. First boot is slower than a reboot: Ignition applies the config, the node
# reboots into it, and only then does sshd answer. Matches the wait
# bootstrap-cluster.yml uses for the same nodes.
node_boot_timeout: 300

# --- Cluster bootstrap (playbooks/bootstrap-cluster.yml) -------------------
# NOTE: `cluster_name` is NOT set here — it comes from the cluster key in
# inventory/nodes.yml (the node map is the source of truth for which cluster a
# node belongs to, so the name lives there too). bootstrap-cluster.yml sets it as
# a per-host fact on each k3s server, which is what makes `kubeconfig_local`
# below resolve per-cluster.
#
# Where the fetched+rewritten kubeconfigs land on the control node — ONE PER
# CLUSTER, named for it (`.kube/homelab.config`), because a single shared path
# would have each cluster's bootstrap clobber the last one's. Server URL is
# rewritten from 127.0.0.1 to the node's DMZ IP and the entries renamed off k3s's
# `default` (k3s names cluster+user+context all `default`, so two clusters would
# otherwise collide on every entry). Git-ignored (ansible/.gitignore) — they carry
# cluster-admin certs. These are the canonical files the plays themselves use; the
# Flux bootstrap step (next milestone) reuses them for cluster access.
kubeconfig_dir: "{{ playbook_dir }}/../.kube"
kubeconfig_local: "{{ kubeconfig_dir }}/{{ cluster_name }}.config"

# Also merge each cluster into your personal kubeconfig, so plain `kubectl` works
# with no KUBECONFIG juggling. This is a MERGE of that cluster's three named
# entries (via kubernetes.core.kubeconfig), never a whole-file overwrite — every
# other context in the file is left untouched, including the OTHER clusters' (so
# `kubectl --context <cluster>` reaches any of them). Set false on CI/shared
# control nodes, where writing to a user's home dir isn't wanted.
kubeconfig_merge_user: true
kubeconfig_user_path: "{{ lookup('ansible.builtin.env', 'HOME') }}/.kube/config"
# Whether that merge also makes the cluster your *active* context. Fine while
# there's one cluster. With several, they'd each claim it in turn and the last one
# bootstrapped would win — so once a second cluster exists, set this false and
# switch deliberately (`kubectl config use-context <cluster>`). Also set it false
# if you don't want a provisioning run yanking current-context away mid-task.
kubeconfig_set_current_context: true

# Optional override for which `helm` binary the kubernetes.core.helm task uses
# (maps to the module's binary_path). Leave UNSET to find `helm` on PATH — the
# normal case. The module shells out to helm and parses its output, so a helm
# major bump is the prime suspect if the Calico prime errors oddly; Helm 4 needs
# kubernetes.core >=6.4 (requirements.yml pins it). Set this to pin a specific
# helm binary without editing the play.
# helm_binary: "/usr/local/bin/helm3"

# Calico (CNI) — installed once by Ansible via the tigera-operator Helm chart,
# then adopted by the Flux HelmRelease in gitops/infrastructure/calico (docs/architecture.md
# §4.3; the "Ansible primes, Flux adopts" decision, ADR-0016).
# Pinned (Renovate marker); MUST match the chart version in the HelmRelease so
# the primed release and the Git definition are identical (clean adoption). The
# pod-CIDR the operator uses lives in gitops/infrastructure/calico/values.yaml
# (the single values source shared by both) and is asserted == k3s_cluster_cidr.
calico_version: "v3.32.1"
#
# ⚠ DELIBERATELY FLEET-WIDE, unlike k3s_version — considered and rejected
# 2026-08-16. The blocker isn't Calico, it's that `gitops/` has no per-cluster
# dimension yet. k3s's version reaches a node through Ignition alone, so making
# it per-cluster touched only Ansible. Calico's version is dual-owned: this pin
# AND `gitops/infrastructure/calico/helmrelease.yaml` must be identical for Flux
# to adopt the primed release without a diff war, and `gitops/crds/calico/
# crds.yaml` is regenerated per version (v3.32 moved CRDs out of the chart).
# Two clusters on different Calico versions therefore forks the CRD tier, the
# HelmRelease, and values.yaml — i.e. a per-cluster gitops layout
# (`clusters/<name>/`, the standard Flux pattern), which is a restructure worth
# doing when a second cluster actually exists rather than in advance of one.
# `gitops/deployment/<cluster>/` is that natural seam, and as of 2026-08-17 it is
# actually keyed by CLUSTER (`homelab`) rather than by node — the Flux bootstrap
# derives its sync path from `cluster_name`, so the rename was forced by making
# the path derived instead of hand-kept. The rest of the per-cluster split
# (`clusters/<name>/` for the CRD tier, HelmRelease and values) is still ahead.

# --- Flux (playbooks/flux-bootstrap.yml) -----------------------------------
# Flux is installed the "operator" way (ADR-0008, ADR-0028): Ansible helm-installs
# the flux-operator, then applies ONE FluxInstance CR that declares which Flux
# distribution, components and Git source the cluster runs. Everything about
# Flux's own shape lives in that CR, NOT in the chart's values — so there are no
# operator chart values here on purpose.
#
# ⚠ THE OPERATOR IS ANSIBLE-OWNED AND STAYS THAT WAY (for now). Unlike Calico,
# it is NOT primed-then-adopted: nothing in gitops/ manages the flux-operator, so
# there is no HelmRelease for Flux to fight over. Self-management is a real
# pattern (a HelmRelease for the operator, reconciled by the Flux the operator
# installed) and a real footgun — an in-flight upgrade can delete the controller
# performing it. Revisit deliberately, not by drifting into it.

# Where the Flux-managed tree lives on the control node. Ansible reads it for two
# purposes only: priming the manifests Flux will later adopt
# (playbooks/bootstrap-cluster.yml) and checking that every ${...} placeholder in
# it has a cluster-topology key (playbooks/tasks/flux-bootstrap-cluster.yml).
# Flux itself reads the same tree from Git, never from here.
gitops_dir: "{{ playbook_dir }}/../../gitops"

# flux-operator Helm chart version (Renovate marker). ⚠ NO leading `v` — the OCI
# chart tags are bare semver (`0.58.0`) while the GitHub releases and the chart's
# appVersion are `v0.58.0`. Pinning "v0.58.0" here fails the pull, not the play.
flux_operator_version: "0.58.0"
flux_operator_chart_ref: "oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator"

# Namespace for BOTH the operator and the FluxInstance — the operator only
# reconciles a FluxInstance named `flux` in its OWN namespace, so these can't
# diverge. `flux-system` also matches what `flux bootstrap` uses, which is what
# makes the Ansible-seeded source + root Kustomization names
# (`sourceRef: {kind: OCIRepository, name: flux-system}` committed in
# gitops/deployment/<cluster>/source.yaml + sync.yaml) line up with the three
# tier entrypoints. bootstrap-cluster.yml already creates this namespace (for the
# cluster-topology Secret), so it exists before Flux does.
flux_namespace: "flux-system"

# Which Flux distribution the operator installs. A MINOR PIN with automatic
# patch upgrades — the same posture as k3s's sysupdate MatchPattern: patches
# apply unattended, minors are a deliberate edit. Renovate marker.
#
# ⚠ Downgrading a minor is NOT supported by the operator (it errors with
# "downgrading ... is not supported, reinstall needed"), so a minor bump is a
# one-way door on a live cluster — which is fine here only because the cluster is
# still disposable. Same rule as k3s: bump + re-provision while that's true.
flux_distribution_version: "2.9.x"
flux_distribution_registry: "ghcr.io/fluxcd"
# Optional but set deliberately: with an artifact URL the operator re-checks
# upstream for CVE patches and digest updates within the pinned minor, instead of
# being limited to what's baked into the operator image. Unset it for an
# air-gapped control plane; here, network access is a given.
flux_distribution_artifact: "oci://ghcr.io/controlplaneio-fluxcd/flux-operator-manifests"

# Only what's actually used. image-reflector/image-automation would give
# in-cluster image-tag bumps, which we don't want — versions are pinned in Git and
# bumped by Renovate on a PR, so an in-cluster mutator would be a second writer.
# notification-controller stays: Flux's alerting/eventing hangs off it, and it's
# in the operator's default set anyway.
flux_components:
  - source-controller
  - kustomize-controller
  - helm-controller
  - notification-controller

# Vertical scaling profile. `small` (concurrency 5, 1000m/512Mi per controller)
# not the `medium` the docs example uses — this is one 4-core/8 GB node also
# running the entire control plane, and `medium` doubles the CPU limit and the
# memory limit on kustomize-controller AND helm-controller.
flux_cluster_size: "small"

# ⚠ There is deliberately NO `spec.storage` on the FluxInstance. That field asks
# for a PersistentVolumeClaim for source-controller's artifact cache, and there
# is no StorageClass in this cluster yet — ceph-csi is four steps further down
# the §6 dependency chain. Setting it would leave source-controller Pending on an
# unbindable PVC, which presents as "Flux installed but nothing ever syncs".
# Revisit once ceph-csi + StorageClasses are up, if the emptyDir cache proves
# too small.

# ⚠ Flux does NOT clone this repo. It reconciles the SIGNED OCI artifact
# (ghcr.io/nighlabs/homelab-infra/gitops) built from the branch below by the
# gitops-artifact workflow — because signature verification (OCIRepository
# spec.verify) has no equivalent on a GitRepository sync. The url/branch here are
# used ONLY by flux-bootstrap.yml's preflight (does the source dir exist on the
# branch the artifact is built from) and NOT by any running FluxInstance. The
# artifact source itself is committed in gitops/deployment/<cluster>/source.yaml.
# PUBLIC repo + PUBLIC package, so no pull secret; if either goes private, add a
# secret and set spec.secretRef on the OCIRepository (see SECRETS.md).
flux_git_url: "https://github.com/nighlabs/homelab-infra.git"
flux_git_ref: "refs/heads/main"

# The bare branch name, DERIVED from flux_git_ref so the two can't disagree.
# Used only by flux-bootstrap.yml's preflight, which checks the source dir exists
# on the branch the artifact is built from — a fast fail for "forgot to push",
# necessary but not sufficient (the artifact must also be rebuilt; the
# OCIRepository Ready gate is what proves that).
flux_git_branch: "{{ flux_git_ref | regex_replace('^refs/heads/', '') }}"

# The per-cluster entrypoint directory (repo-root-relative, for the git preflight
# above), DERIVED from the cluster name — which is why gitops/deployment/
# subdirectories are named for the cluster key in inventory/nodes.yml (`homelab`)
# and not for a node. ⚠ Note the ARTIFACT-relative path Flux actually uses drops
# the `gitops/` prefix (the artifact root IS gitops/): the root Kustomization's
# path is `./deployment/<cluster>`, hardcoded in sync.yaml, not derived here.
flux_sync_path: "gitops/deployment/{{ cluster_name }}"
# NOTE: the old `flux_sync_interval` was removed with the GitRepository sync — the
# OCIRepository and root Kustomization intervals now live in their committed
# manifests (source.yaml / sync.yaml), which is the single place they belong.

# ⚠ MUST STAY TRUE. Without this gate, an undefined ${var} in a postBuild
# substitution becomes the EMPTY STRING and the Kustomization reconciles
# SUCCESSFULLY — so a typo'd or missing cluster-topology key yields a live
# `BGPPeer` with `peerIP: ""`, reported Healthy. There are five distinct
# placeholders in gitops/ today. flux-bootstrap.yml patches the flag onto
# kustomize-controller and then ASSERTS it landed, because a patch that silently
# fails to apply leaves exactly the state this is guarding against.
# Exposed as a variable only so the assert and the patch read from one place.
flux_strict_substitutions: true

# --- BGP / LoadBalancer ----------------------------------------------------
# Calico BGP owns BOTH LoadBalancer IP advertisement and the pod dataplane;
# there is no MetalLB (root CLAUDE.md; ADR-0018). These
# values are shared by both sides of the peering — the pfSense/FRR config
# (rendered by playbooks/render-frr-config.yml) and the Calico BGP CRs — so
# they live here rather than in either one.
# Full rationale: docs/pfsense-frr-bgp-setup.md.

# pfSense's own AS. ONE value for the whole router no matter how many clusters
# peer with it — it's one device, one AS. Two DIFFERENT ASNs is what makes each
# session eBGP, which is what we want (AS_PATH loop prevention, and the mode
# FRR's RFC 8212 policy requirement applies to). Generic — a number from the
# RFC 6996 private range reveals nothing — so it stays in cleartext.
bgp_peer_asn: 64512

# pfSense's BGP address IS its DMZ interface address, which IS the nodes'
# default gateway. One value, already vaulted, so there's no second variable to
# keep in sync. ⚠ That equivalence breaks if pfSense ever runs CARP on this
# interface: the gateway would be a VIP while BGP must peer with the physical
# interface address. No CARP there today (confirmed 2026-08-16) — if that
# changes, this becomes its own vault var.
bgp_peer_ip: "{{ dmz_network.gateway }}"

# Base for per-cluster ASNs: a cluster's ASN is bgp_asn_base + its `index`
# (inventory/nodes.yml). 64600 leaves 64512-64599 free for anything else that
# ever needs a private ASN here, and keeps cluster ASNs visually distinct from
# bgp_peer_asn above.
#
# ⚠ Every node in a cluster shares that one ASN — do NOT set the per-node
# override (Node.spec.bgp.asNumber). It exists for AS-per-rack topologies; here
# it would turn the in-cluster mesh from iBGP into eBGP and force
# `bgp bestpath as-path multipath-relax` on the pfSense side for ECMP to work
# at all (docs/pfsense-frr-bgp-setup.md §4).
bgp_asn_base: 64600

# First two octets of the LoadBalancer supernet; a cluster's range is
# <lb_range_base>.<index>.0/24.
#
# ⚠ This range must be assigned to NO interface anywhere — not a pfSense
# interface, not a VLAN, not a DHCP pool. It exists ONLY as a BGP-learned
# route. An LB range that is also a connected subnet loses to the connected
# route on admin distance, and on-subnet clients ARP for an address that
# nothing answers (Calico does no L2 for LB IPs — that's MetalLB's L2 mode,
# which we don't run). Environment-revealing, so vaulted.
lb_range_base: "{{ secrets.lb_range_base }}"

# FRR's internal daemon password (Services > FRR Global Settings) — NOT a BGP
# peer password. Saving raw config replaces the generated frr.conf wholesale,
# so this has to appear IN the rendered file, which is why that artifact is
# git-ignored and mode 0600. A credential per the root CLAUDE.md tiers:
# store-managed, never in a committed manifest.
frr_master_password: "{{ secrets.frr_master_password }}"

# --- THE per-cluster BGP derivation ----------------------------------------
# Every cluster-scoped BGP value, computed once from that cluster's `index`.
# Keyed by cluster name:
#
#   cluster_bgp.homelab.asn       -> 64601   (bgp_asn_base + index)
#   cluster_bgp.homelab.lb_range  -> <base>.1.0/24
#   cluster_bgp.homelab.lb_net    -> <base>.1        (leading octets, for asserts)
#
# ⚠ THIS IS THE ONLY PLACE THE ARITHMETIC LIVES. Both consumers index into it —
# playbooks/render-frr-config.yml (pfSense side) and
# playbooks/bootstrap-cluster.yml (Calico side). They configure the two ends of
# the same BGP session, so a derivation transcribed into both would produce a
# session that never establishes, with nothing in either file looking wrong.
# That is the same reason the gitops manifests use ${cluster_asn}/${lb_range}
# rather than literals (gitops/CLAUDE.md, "Topology blinding").
#
# Lazily templated on purpose: `clusters` comes from inventory/nodes.yml, which
# plays pull in via vars_files — it does not exist when group_vars is loaded.
# Ansible resolves this at USE time, so it works anywhere `clusters` is defined
# and fails loudly (undefined) anywhere it isn't.
cluster_bgp: >-
  {%- set out = {} -%}
  {%- for name, c in clusters.items() -%}
  {%- set _ = out.update({name: {
        'index': c.index | int,
        'asn': (bgp_asn_base | int) + (c.index | int),
        'lb_range': lb_range_base ~ '.' ~ c.index ~ '.0/24',
        'lb_net': lb_range_base ~ '.' ~ c.index,
      }}) -%}
  {%- endfor -%}
  {{ out }}

# --- Edge: cert-manager DNS-01 + the shared Gateway (ADR-0013) ---------------
# The apex DNS zone the wildcard cert and every app hostname hang off.
# Environment-identifying (public repo), so it reaches gitops/ only as the
# ${base_domain} placeholder via the cluster-topology Secret. Blinding it hides
# the repo<->domain LINK only — the zone itself goes public in the CT logs the
# moment the wildcard cert issues.
#
# ⚠ FLEET-WIDE TODAY, and that flat shape BREAKS AT CLUSTER #2: two clusters
# can't both own `*.<base_domain>` — split-horizon DNS can point the wildcard
# at only ONE Gateway's LB IP. Certs aren't the problem (each cluster has its
# own ACME account; LE allows duplicates); NAME OWNERSHIP is. The fix is
# seed-side only, because the manifests carry ${base_domain} rather than a
# literal: derive per-cluster here (e.g. `{{ cluster_name }}.` ~ the zone) or
# add `base_domain_<cluster>` secrets on the k3s_token_<cluster> pattern —
# zero gitops/ edits either way. Same deferred-until-a-second-cluster bucket
# as the calico_version note above (and cloudflare_api_token below can fork
# per cluster the same way if per-cluster revocation is wanted).
base_domain: "{{ secrets.base_domain }}"

# Cloudflare API token for cert-manager's DNS-01 solver. A CREDENTIAL (root
# CLAUDE.md tiers): store-managed, seeded by bootstrap-cluster.yml into the
# cert-manager namespace, never in any manifest. Scope it in Cloudflare to
# Zone > DNS > Edit on that one zone — it can create TXT records for ACME
# challenges, which is all cert-manager needs.
cloudflare_api_token: "{{ secrets.cloudflare_api_token }}"

# --- Storage: ceph-csi against the existing Proxmox Ceph (ADR-0006) ----------
# ⚠ That Ceph cluster ALREADY SERVES LIVE PROXMOX VM STORAGE. Everything here
# is additive — a new pool and a new subvolumegroup that PVE does not use — and
# nothing in this repo may touch PVE's VM pool or the root of its CephFS. That
# pool is deliberately NOT named anywhere here — the guardrail is that ours is a
# different pool and our caps are scoped to ours. The Ceph-side objects are
# created ONCE, by hand, from a rendered script:
# docs/proxmox-ceph-k8s-setup.md + playbooks/render-ceph-setup.yml.
#
# The cleartext/vaulted split here is narrower than elsewhere, deliberately:
# names WE choose for objects that don't exist yet reveal nothing about the
# environment, so they stay readable in the runbook and in gitops/. Names and
# addresses that describe the EXISTING cluster are vaulted, per the root
# CLAUDE.md rule that storage names are environment-revealing.

# PVE's existing CephFS name, brokered as a STANDALONE scalar as well as through
# ceph_csi.fs_name below. ⚠ Not redundancy — render-ceph-setup.yml must be able
# to read this ONE value on a first run, when ceph_mons/ceph_fsid do not exist
# yet (the scripts it renders are what produce them). Touching `ceph_csi` at all
# would template the whole dict, and `ceph_csi.mons` calls .splitlines() on an
# undefined value and raises. That is why the old code reached past the broker to
# `secrets.ceph_fs_name` — this scalar is the brokered way to ask the same question
# (ADR-0033). Keep it a plain reference: anything that dereferences another
# vaulted value reintroduces exactly the coupling it exists to avoid.
ceph_fs_name: "{{ secrets.ceph_fs_name }}"

ceph_csi:
  # --- Ours, cleartext: created by the runbook, generic by construction ------
  # New RBD pool for Kubernetes RWO volumes. NEVER the pool PVE stores VM disks
  # in — the setup script refuses if this name is a registered PVE storage.
  rbd_pool: "k8s-rbd"
  # Subvolumegroup inside PVE's EXISTING CephFS (the chosen layout — a second
  # filesystem would need a second active MDS, spending the standby redundancy
  # that PVE's production filesystem relies on). ceph-csi confines itself to
  # /volumes/<group>, and the cephfs client's mds cap is scoped to that path.
  subvolume_group: "k8s"
  # cephx entities, created by the runbook as `client.<name>`. Two of them, each
  # scoped to one driver: an RBD-side compromise must not carry CephFS caps.
  rbd_client: "k8s-rbd"
  cephfs_client: "k8s-cephfs"
  # Kubernetes namespace the operator and both drivers live in.
  namespace: "ceph-csi"

  # --- Theirs, vaulted: describes the existing cluster -----------------------
  # Mon addresses, ONE PER LINE in the store (same shape as dns_servers /
  # ssh_authorized_keys). These are on the Ceph PUBLIC network — the only Ceph
  # network a k3s node ever touches (root CLAUDE.md). Never the cluster network.
  mons: "{{ secrets.ceph_mons.splitlines() | map('trim') | reject('equalto', '') | list }}"
  # Ceph cluster fsid. Doubles as ceph-csi's `clusterID`, which is why it
  # reaches gitops/ as a placeholder rather than a literal.
  fsid: "{{ secrets.ceph_fsid }}"
  # PVE's existing CephFS name (vaulted as a storage name, like
  # proxmox_snippet_storage). We do not create this — we join it. Sourced from
  # the standalone `ceph_fs_name` above, not from the store directly, so there
  # is exactly one reference to that secret.
  fs_name: "{{ ceph_fs_name }}"

# The two cephx keys. CREDENTIALS (root CLAUDE.md tiers): store-managed, seeded by
# bootstrap-cluster.yml into the ceph-csi namespace, never in any manifest.
#
# ⚠ Bootstrap-secret tier, and that is a CONSEQUENCE OF ORDERING, not a
# preference: ceph-csi lands before ESO in the §6 chain, so on a from-scratch
# rebuild ESO cannot supply these. Same open question as the cert-manager token
# — whether ESO later ADOPTS them (docs/decisions/README.md, "Open questions").
# Unlike that token, these are NOT upstream of ESO, so if the adoption ADR ever
# moves ceph-csi below ESO these seeds could genuinely retire.
ceph_k8s_rbd_key: "{{ secrets.ceph_k8s_rbd_key }}"
ceph_k8s_cephfs_key: "{{ secrets.ceph_k8s_cephfs_key }}"

# --- Which secret store -----------------------------------------------------
# 1Password is the store (ADR-0034). `bitwarden` selects the retained legacy
# path for the duration of the cutover window, and exists so that "roll back"
# means one -e rather than writing the old code again:
#
#   uv run ansible-playbook playbooks/render-frr-config.yml -e secrets_backend=bitwarden
#
# ⚠ Both backends must render BYTE-IDENTICAL output. That diff is the proof the
# 1Password field layout matches what BWS held — much stronger than eyeballing
# two lists of names. Delete the Bitwarden half once it has passed; keeping two
# live stores forever is precisely the "two contradicting sources of truth"
# ADR-0027 was written to repair.
secrets_backend: "onepassword"

# --- 1Password connection ---------------------------------------------------
# How playbooks/tasks/load-secrets-onepassword.yml reaches 1Password. Nothing
# below is a credential — the only credential is the service-account token,
# which lives in the macOS Keychain and never touches this repo.

# Vault TITLE holding the control-node secrets. Committed in cleartext, unlike
# BWS's organization id, and that is a real simplification rather than a
# relaxation: a 1Password service-account token encodes its own account, so
# there is no second environment-identifying id to supply, to keychain, or to
# confuse with a project id. The name is one WE choose and reveals nothing.
#
# ⚠ This vault must be a vault you created. A service account can never read a
# built-in Personal/Private/Employee vault, nor the default Shared vault.
op_vault: "homelab-infra"

# The items to read, in the vault above. ONE `op item get` per entry, so this
# list IS the API-call budget — the daily cap is per ACCOUNT and shared across
# every service account (1,000/24h on Individual/Families), not per token.
#
# Values are grouped onto ONE item as labelled fields, in purpose SECTIONS.
# ⚠ That is a deliberate reversal of ADR-0027, which rejected grouping because
# "a BWS secret has no fields" — Name + Value + Notes, so grouping meant
# hand-authoring JSON into a textarea with no validation. 1Password items have
# first-class fields with a label and a type, each independently editable in a
# real form, so the premise is simply void and grouping is now the correct
# shape rather than a JSON hack (ADR-0034).
#
# ⚠ Field labels are the SECRET NAMES and must be unique across every item
# here, not merely within one; the load task refuses on a duplicate, because
# 1Password itself will not. Layout: ../SECRETS.md.
#
# The ESO service-account token gets its OWN item when that milestone lands, so
# the credential gating cluster access stays separately rotatable and its
# history isn't coupled to everything else. Add "eso-service-account" here then.
op_items:
  - "control-node"

# Service-account auth needs op >= 2.18.0. Below it, `op` ignores
# OP_SERVICE_ACCOUNT_TOKEN and falls back to an interactive session, which in a
# playbook just hangs — so this is asserted, not assumed.
op_min_version: "2.18.0"

# Optional: pin the vault and items by UUID instead of resolving them by title.
# Not a security control — a readability/rate-limit trade. Resolving a title
# costs 1Password an extra lookup per call, and their own guidance for staying
# under the cap is to pass ids. Titles are the default because a uuid in
# group_vars is unreadable and this repo's call volume is nowhere near 1,000/day
# (~25 for a full site.yml). Reach for these only if the cap ever bites.
#   op_vault: "<vault uuid>"      # the same variable — it takes either form
#   op_items: ["<item uuid>"]     # likewise

# ⚠ OPTIONAL, and normally ABSENT. The default auth on a workstation is the
# 1Password DESKTOP APP integration (Touch ID), which needs no token anywhere —
# secret zero does not relocate, it ceases to exist. The load task supplies a
# token only if one is found, so an empty Keychain here is the expected state,
# not a misconfiguration. Turn the app integration on at:
#   1Password app -> Settings -> Developer -> "Integrate with 1Password CLI"
#
# A service-account token is for what the app cannot reach: CI, a Linux control
# node, an unattended run — and ESO in-cluster, which is a separate credential
# entirely (see ../SECRETS.md §1.4). ⚠ ADR-0032 argued for making the token
# mandatory; ADR-0034 overrules that for the control node and records the trade
# — the app authenticates as YOU, read/write on every vault you own, versus a
# read-only token on two named vaults.
#
# If you do want one on a Mac, create the item with:
#   security add-generic-password -a "$USER" -s OP_SERVICE_ACCOUNT_TOKEN -U -w
# (-w must be LAST: with no value after it, security prompts — keeping it out of
# shell history. Mid-args, -w swallows the next flag as its value and never asks.)
#
# ⚠ The token is displayed EXACTLY ONCE, when the service account is created,
# and 1Password cannot show it again. Lose it and the fix is a NEW service
# account — which, because vault grants are immutable, also means re-making the
# grant decision. Keychain it in the same sitting.
#
# ⚠ The LOCAL login keychain, NOT the Passwords app — they are separate stores.
# Passwords.app manages the synced iCloud Keychain; the `security` CLI reads
# login.keychain-db. Items in one are invisible to the other, so macOS nudging
# you toward Passwords changes nothing here. Keychain Access.app was REMOVED in
# macOS 26 (verified on 26.6.1), so the CLI is the only way in.
#
# Reads WITHOUT a prompt by default: `security` is trusted for items it created.
# Add `-T ""` when creating the item (empty trusted-app list) and every read
# raises the macOS keychain authorization dialog instead — verified on 26.6.1.
# ⚠ That dialog wants your LOGIN PASSWORD; there is no Touch ID. `security` has
# no biometry flag, and biometric items live in the Secure-Enclave-backed
# data-protection keychain, which this CLI does not reach.
#
# ⚠ Want Touch ID? That is the desktop app integration — i.e. simply not having
# this Keychain item. These prompts are the COST of the token path, not a
# feature of it. If you specifically want Touch ID *and* a scoped read-only
# token, put the token in a personal 1Password item and export it from your
# shell profile; the precedence chain already prefers the environment.
#
# ⚠ One prompt PER PLAY, not per run: the load task is included once per play,
# so a full site.yml prompts 4 times. And click Allow, never *Always Allow*, or
# the caller joins the ACL and the prompt stops for good.
#
# Either way the credential is a service-account token scoped to named vaults,
# optionally with an expiry, rather than a long-lived passphrase over
# everything at once.
#
# ⚠ Trailing `2>/dev/null || true`, which the BWS token command below lacks —
# and its absence there is a latent bug, not a design (ADR-0034). `security`
# exits 44 when the item is missing, and the `pipe` lookup turns a non-zero
# exit into a hard AnsibleError *while resolving the variable*. That happens
# BEFORE the "Assert secret zero was found" task, so on a machine without the
# item the carefully-written "here is how to create it" message could never
# render — you got `lookup_plugin.pipe(...) returned 44` instead. Found the
# first time this path ran on a machine with no item, which is to say: the one
# time it mattered. The same shape as the `fail_msg` that never renders in
# render-ceph-setup.yml.
#
# ⚠ The cost of masking: a LOCKED keychain or a DENIED authorization dialog
# (exit 51) also becomes "no token found", whose message tells you to create an
# item that already exists. The assert's fail_msg names that case explicitly
# for exactly this reason — read it before creating a second item.
op_keychain_service: "OP_SERVICE_ACCOUNT_TOKEN"
op_keychain_account: "{{ lookup('ansible.builtin.env', 'USER') }}"
op_keychain_command: >-
  security find-generic-password -w -s {{ op_keychain_service | quote }}
  -a {{ op_keychain_account | quote }} 2>/dev/null || true

# --- Bitwarden Secrets Manager connection (RETAINED FOR THE CUTOVER ONLY) ----
# Reached only when secrets_backend == 'bitwarden'. Delete this block, the
# backend task, library/bws_secret*.py, the bitwarden-sdk pin and the BWS_*
# Keychain items once the byte-identical parallel run has passed (ADR-0034).
#
# Organization UUID. Environment-identifying but not secret, and it cannot come
# from BWS (you need it to make the call). RESOLVED in
# load-secrets-bitwarden.yml, exactly like the access token: Keychain by
# default, overridable by BWS_ORG_ID in the environment or
# -e bws_organization_id=...
#
# Optional: restrict to one project. Leave unset to accept everything the token
# can read.
# bws_project_id: "<project uuid>"
#
# Keychain semantics are identical to the op token's above — same store, same
# -w-last rule, same -T "" prompt behaviour. Create it with:
#   security add-generic-password -a "$USER" -s BWS_ACCESS_TOKEN -U -w
bws_keychain_service: "BWS_ACCESS_TOKEN"
bws_keychain_account: "{{ lookup('ansible.builtin.env', 'USER') }}"
bws_keychain_command: >-
  security find-generic-password -w -s {{ bws_keychain_service | quote }}
  -a {{ bws_keychain_account | quote }}

# The organization id lives in its own Keychain item (same account), fetched the
# same way as the token. Create it with:
#   security add-generic-password -a "$USER" -s BWS_ORG_ID -U -w   (-w last: prompts)
# ⚠ Trailing `|| true`, which the token command deliberately lacks: the org id is
# NOT secret, and a missing item should fall through to load-secrets.yml's
# assert (with its "add it to the keychain / export BWS_ORG_ID" guidance) rather
# than surface `security`'s bare exit-44 as a raw lookup error. The pipe only
# runs at all when neither -e nor BWS_ORG_ID is set (Jinja short-circuits the
# default chain), so this never masks a real value.
bws_org_keychain_service: "BWS_ORG_ID"
bws_org_keychain_command: >-
  security find-generic-password -w -s {{ bws_org_keychain_service | quote }}
  -a {{ bws_keychain_account | quote }} 2>/dev/null || true
