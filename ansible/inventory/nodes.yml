---
# Flatcar node map — the single source of truth for node identity and
# addressing (ansible/CLAUDE.md §1.1). Nodes are grouped under the k3s cluster
# they belong to; the cluster key IS the cluster's name.
#
# That key names more than the grouping: it becomes the kubeconfig's
# cluster/user/context name (`<cluster>` / `<cluster>-admin` / `<cluster>`, see
# playbooks/bootstrap-cluster.yml) and the per-cluster kubeconfig filename
# (`ansible/.kube/<cluster>.config`). k3s names all three `default`, so without
# that rename two clusters collide on every entry and silently clobber each
# other. Pick a key you're happy typing after `kubectl --context`.
#
# Only `node_number` is required per node; everything host-shaped is derived
# from it deterministically (see roles/flatcar_vm/tasks/preflight.yml), so
# there's exactly one number to change and nothing to keep in sync:
#
#   eth0 (DMZ)         -> {{ dmz_network.subnet_base }}.<node_number>
#   eth1 (Ceph public) -> {{ ceph_public_network.subnet_base }}.<node_number>
#   eth0 MAC           -> {{ mac_oui }}:00:<node_number hex>:00
#   eth1 MAC             -> {{ mac_oui }}:00:<node_number hex>:01
#   vmid                 -> 1000 + node_number   (override with `vmid:`)
#
# MACs are pinned at VM-creation time so Ignition's [Match] MACAddress= binds
# each NIC deterministically regardless of guest interface naming.
#
# node_number must be unique and in 1..254 (it's the final IP octet), and that
# uniqueness is GLOBAL — across every cluster, not just within one. All clusters
# share the same DMZ/Ceph subnets and the same Proxmox vmid space (1000 + n), so
# reusing a number in a second cluster collides on both an IP and a vmid. Node
# hostnames must likewise be globally unique. Both are asserted (see
# playbooks/tasks/load-node-map.yml) before anything is created.

clusters:
  # The single cluster today. A second one = another key here with its own
  # `index`, its own nodes, and non-overlapping node_numbers.
  homelab:
    # Cluster index — the one number every cluster-scoped BGP value derives
    # from (group_vars/all/vars.yml, "BGP / LoadBalancer"):
    #
    #   ASN      -> bgp_asn_base + index              (64600 + 1 = 64601)
    #   LB range -> <lb_range_base>.<index>.0/24
    #
    # Same idea as node_number: one number to change, nothing to keep in sync.
    # Must be unique across clusters and in 1..254 (it's an address octet).
    # Asserted by playbooks/render-frr-config.yml, which is also where those
    # ranges are checked for collisions against the DMZ/Ceph/pod/service CIDRs.
    index: 1
    # Optional per-cluster k3s pin. Omitted = the fleet default
    # (`k3s_version_default` in group_vars/all/vars.yml), which is the normal
    # case. Set it here to stage a bump on ONE cluster while others stay put:
    #
    #   k3s_version: "v1.36.2+k3s1"
    #
    # `k3s_minor` is derived from it (v1.36.2+k3s1 -> v1.36) and rarely needs
    # stating; preflight asserts minor ⊂ version either way. Nothing in gitops/
    # reads these — k3s reaches a node through Ignition only — so per-cluster
    # k3s versions cost nothing on the Flux side. That is NOT true of Calico;
    # see group_vars/all/vars.yml under `calico_version`.
    nodes:
      snoop-a2o:                 # "all to one" — single all-in-one node
        node_number: 50          # final octet -> DMZ + Ceph-public IPs (bases vaulted)
        role: all-in-one
        cores: 4
        memory_mb: 8192
        data_disk_gb: 100
