---
# Control/connection inventory. This is NOT the node map — the Flatcar node
# map (identity, addressing) lives in inventory/nodes.yml, the single source
# of truth for VM addressing (see ansible/CLAUDE.md "Node map and derivation").
#
# Two roles of host here:
#   - localhost: runs the Proxmox API modules + Butane transpile.
#   - proxmox:  the PVE host we SSH into for the snippet upload and the
#               `qm set --cicustom` / template-build fallbacks (no root@pam
#               needed — a scoped user with shell access is enough).
all:
  hosts:
    localhost:
      ansible_connection: local

  children:
    proxmox:
      hosts:
        # Generic, non-revealing alias — `proxmox_ssh_host` in group_vars/all/vars.yml
        # points delegate_to here. The real address and login user come from the
        # secret store at run time, brokered as `proxmox_ssh_addr` /
        # `proxmox_ssh_user` in group_vars/all/vars.yml, so nothing about the PVE
        # host is committed in any form.
        # ⚠ hostvars['localhost'] indirection is deliberate, not clumsiness.
        # Inventory vars are templated at CONNECTION time, and `pve` is only ever
        # reached via delegate_to from a localhost play — so it is never itself
        # in a play and never runs load-secrets.yml. Resolving in localhost's
        # namespace, which did run it, is what makes these resolve at all. A play
        # that skipped the include fails loudly here instead of connecting
        # nowhere.
        # ⚠ Two different problems, don't conflate them: the hostvars hop is
        # about WHOSE namespace evaluates the variable; going through the broker
        # rather than the raw store fact is about WHERE the store is read
        # (ADR-0033 — group_vars/all/vars.yml, and nowhere else).
        pve:
          ansible_host: "{{ hostvars['localhost'].proxmox_ssh_addr }}"
          ansible_user: "{{ hostvars['localhost'].proxmox_ssh_user }}"
