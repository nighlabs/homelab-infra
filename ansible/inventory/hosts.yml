---
# Control/connection inventory. This is NOT the node map — the Flatcar node
# map (identity, addressing) lives in inventory/nodes.yml, the single source
# of truth for VM addressing (see ansible/CLAUDE.md §1.1).
#
# Two roles of host here:
#   - localhost: runs the Proxmox API modules + Butane transpile.
#   - proxmox:  the PVE host we SSH into for the snippet upload and the
#               `qm set --cicustom` / template-build fallbacks (no root@pam
#               needed — a scoped user with shell access is enough).
all:
  hosts:
    localhost:
      ansible_connection: local

  children:
    proxmox:
      hosts:
        # Generic, non-revealing alias — `proxmox_ssh_host` in group_vars/all/vars.yml
        # points delegate_to here. The real address and login user are vaulted
        # (inventory/group_vars/all/vault.yml), so nothing about the PVE host is
        # committed in cleartext.
        pve:
          ansible_host: "{{ vault_proxmox_ssh_addr }}"
          ansible_user: "{{ vault_proxmox_ssh_user }}"
