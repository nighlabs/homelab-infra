---
# Role-private defaults. Shared/topology config (networks, Proxmox connection,
# template name) lives in group_vars/all/vars.yml.
#
# NOTE: `node_user` (the node's admin login) now lives in group_vars/all/vars.yml
# — the bootstrap play (playbooks/bootstrap-cluster.yml) needs it to SSH in, so
# it's a shared fact, not role-private. One definition, used by both.

# Where the local data disk (vdb) gets mounted. Deliberately k3s's DEFAULT
# data-dir root — so k3s runs stock (no `data-dir` override) while its datastore
# + embedded containerd + image cache (the disk-eaters) still land on vdb, off
# the OS disk. Mounting at the default beats overriding data-dir: `k3s
# secrets-encrypt`/`etcd-snapshot`/uninstall + community tooling all assume the
# default path and break under a custom one (learned the hard way — see
# ansible/CLAUDE.md §2). k3s creates `k3s/` under this on first start.
data_mount_point: "/var/lib/rancher"
