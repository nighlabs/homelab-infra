---
# Validate the node map entry and derive every host-shaped fact from
# node_number. Dropping DHCP also drops its free IP-collision protection, so
# nodes.yml is the SOLE source of address allocation — assert uniqueness before
# creating anything (ansible/CLAUDE.md §7 item 2).

- name: "{{ hostname }} — assert node_number is present and valid"
  ansible.builtin.assert:
    that:
      - node.node_number is defined
      - (node.node_number | int) > 0
      - (node.node_number | int) < 255
    fail_msg: "node '{{ hostname }}' needs node_number in 1..254 (it's the final IP octet)"
    quiet: true

- name: "{{ hostname }} — assert node_number uniqueness across the node map"
  vars:
    numbers: "{{ nodes | dict2items | map(attribute='value.node_number') | list }}"
  ansible.builtin.assert:
    that:
      - (numbers | length) == (numbers | unique | length)
    fail_msg: "Duplicate node_number in inventory/nodes.yml: {{ numbers }}"
    quiet: true
  run_once: true

- name: "{{ hostname }} — assert butane is available on the control node"
  ansible.builtin.command: butane --version
  delegate_to: localhost
  changed_when: false
  run_once: true

# k3s roles: all-in-one / server / control-plane -> a k3s *server*; agent /
# worker -> a k3s *agent*. A node with no `role` is a bare VM shell (§1) and
# gets no k3s config at all. Only the server path is built today; the agent
# branch is derived here but wired in the §6 multi-node step.
- name: "{{ hostname }} — assert role is a known value (if set)"
  ansible.builtin.assert:
    that:
      - node.role is not defined or node.role in ['all-in-one', 'server', 'control-plane', 'agent', 'worker']
    fail_msg: "node '{{ hostname }}' has role '{{ node.role | default('') }}'; expected one of all-in-one/server/control-plane/agent/worker (or none)"
    quiet: true

- name: "{{ hostname }} — derive network + VM facts from node_number"
  ansible.builtin.set_fact:
    node_number: "{{ node.node_number | int }}"
    vmid: "{{ node.vmid | default(1000 + (node.node_number | int)) }}"
    eth0_ip: "{{ dmz_network.subnet_base }}.{{ node.node_number }}"
    eth1_ip: "{{ ceph_public_network.subnet_base }}.{{ node.node_number }}"
    eth0_mac: "{{ mac_oui }}:00:{{ '%02X' | format(node.node_number | int) }}:00"
    eth1_mac: "{{ mac_oui }}:00:{{ '%02X' | format(node.node_number | int) }}:01"
    eth0_gateway: "{{ dmz_network.gateway }}"
    # k3s facts. k3s_enabled gates the whole k3s block in butane.yaml.j2.
    k3s_enabled: "{{ node.role is defined and node.role in ['all-in-one', 'server', 'control-plane', 'agent', 'worker'] }}"
    k3s_role: "{{ 'agent' if (node.role | default('')) in ['agent', 'worker'] else 'server' }}"
    # Taint control-plane-only nodes; an all-in-one stays schedulable (the CP
    # taint is added when dedicated workers arrive — ansible/CLAUDE.md §6.1).
    k3s_taint: "{{ (node.role | default('')) in ['server', 'control-plane'] }}"

# The join token is required for any k3s node — fail fast if the vault is
# missing it rather than baking a tokenless (insecure/broken) server config.
- name: "{{ hostname }} — assert k3s join token is present when k3s is enabled"
  ansible.builtin.assert:
    that:
      - vault_k3s_token is defined and (vault_k3s_token | string | length) > 0
    fail_msg: "node '{{ hostname }}' is a k3s node but vault_k3s_token is unset — add it to the encrypted vault (see vault.example.yml)"
    quiet: true
  when: k3s_enabled
