---
# Validate the node map entry and derive every host-shaped fact from
# node_number. Dropping DHCP also drops its free IP-collision protection, so
# nodes.yml is the SOLE source of address allocation — assert uniqueness before
# creating anything (docs/decisions/0017-static-addressing-no-dhcp.md).

- name: "{{ hostname }} — assert node_number is present and valid"
  ansible.builtin.assert:
    that:
      - node.node_number is defined
      - (node.node_number | int) > 0
      - (node.node_number | int) < 255
    fail_msg: "node '{{ hostname }}' needs node_number in 1..254 (it's the final IP octet)"
    quiet: true

- name: "{{ hostname }} — assert node_number uniqueness across the node map"
  vars:
    numbers: "{{ nodes | dict2items | map(attribute='value.node_number') | list }}"
  ansible.builtin.assert:
    that:
      - (numbers | length) == (numbers | unique | length)
    fail_msg: "Duplicate node_number in inventory/nodes.yml: {{ numbers }}"
    quiet: true
  run_once: true

- name: "{{ hostname }} — assert butane is available on the control node"
  ansible.builtin.command: butane --version
  delegate_to: localhost
  changed_when: false
  run_once: true

# k3s roles: all-in-one / server / control-plane -> a k3s *server*; agent /
# worker -> a k3s *agent*. A node with no `role` is a bare VM shell and
# gets no k3s config at all. Only the server path is built today; the agent
# branch is derived here but wired in the §6 multi-node step.
- name: "{{ hostname }} — assert role is a known value (if set)"
  ansible.builtin.assert:
    that:
      - node.role is not defined or node.role in ['all-in-one', 'server', 'control-plane', 'agent', 'worker']
    fail_msg: "node '{{ hostname }}' has role '{{ node.role | default('') }}'; expected one of all-in-one/server/control-plane/agent/worker (or none)"
    quiet: true

- name: "{{ hostname }} — derive network + VM facts from node_number"
  ansible.builtin.set_fact:
    node_number: "{{ node.node_number | int }}"
    vmid: "{{ node.vmid | default(1000 + (node.node_number | int)) }}"
    eth0_ip: "{{ dmz_network.subnet_base }}.{{ node.node_number }}"
    eth1_ip: "{{ ceph_public_network.subnet_base }}.{{ node.node_number }}"
    eth0_mac: "{{ mac_oui }}:00:{{ '%02X' | format(node.node_number | int) }}:00"
    eth1_mac: "{{ mac_oui }}:00:{{ '%02X' | format(node.node_number | int) }}:01"
    eth0_gateway: "{{ dmz_network.gateway }}"
    # k3s facts. k3s_enabled gates the whole k3s block in butane.yaml.j2.
    k3s_enabled: "{{ node.role is defined and node.role in ['all-in-one', 'server', 'control-plane', 'agent', 'worker'] }}"
    k3s_role: "{{ 'agent' if (node.role | default('')) in ['agent', 'worker'] else 'server' }}"
    # Taint control-plane-only nodes; an all-in-one stays schedulable (the CP
    # taint is added when dedicated workers arrive — docs/architecture.md §7).
    k3s_taint: "{{ (node.role | default('')) in ['server', 'control-plane'] }}"

# k3s identity is CLUSTER-scoped, not fleet-wide: both the join token and the
# extra TLS SANs are looked up by node.cluster (annotated onto every node by
# playbooks/tasks/load-node-map.yml). See group_vars/all/vars.yml for why.
#
# The join token is required for any k3s node — fail fast if the vault is
# missing it rather than baking a tokenless (insecure/broken) server config.
- name: "{{ hostname }} — assert its cluster has a k3s join token"
  ansible.builtin.assert:
    that:
      - node.cluster in k3s_tokens
      - (k3s_tokens[node.cluster] | default('') | string | length) > 0
    fail_msg: >-
      node '{{ hostname }}' is a k3s node in cluster '{{ node.cluster }}', but
      vault_k3s_tokens has no non-empty entry for it.
      {% if vault_k3s_token is defined %}
      *** Your vault has the OLD key name `vault_k3s_token` (singular). Rename it
      to `vault_k3s_tokens` (plural) — the structure underneath is already
      correct. ***
      {% else %}
      Every cluster needs its OWN token — add one to the encrypted vault (see
      vault.example.yml). If you're migrating from the old fleet-wide
      `vault_k3s_token`, move its value under
      `vault_k3s_tokens.{{ node.cluster }}`.
      {% endif %}
      Keeping the same value renders byte-identical config, so no node needs
      re-provisioning on account of this.
    quiet: true
  when: k3s_enabled

# The token's absence is loud (above). The SANs' absence is NOT: the new variable
# carries `| default({})`, so a half-finished rename silently drops every extra
# API-server cert SAN from every node's config — and you'd discover it when
# something couldn't verify the API cert, long after provisioning. Make it loud.
- name: "{{ hostname }} — assert the k3s TLS SAN vault key was migrated too"
  ansible.builtin.assert:
    that:
      - not (vault_k3s_tls_sans is defined and vault_k3s_tls_sans_by_cluster is not defined)
    fail_msg: >-
      The vault still has the old fleet-wide `vault_k3s_tls_sans` and no
      `vault_k3s_tls_sans_by_cluster`. That combination FAILS SILENTLY — the new
      variable defaults to {} — so your extra API-server cert SANs would be
      dropped from every node with no error. Move the list under
      `vault_k3s_tls_sans_by_cluster.{{ node.cluster }}` (see vault.example.yml),
      or delete the old key outright if you don't need extra SANs.
    quiet: true
  when: k3s_enabled
  run_once: true

# ⚠ Set UNCONDITIONALLY, not `when: k3s_enabled`. set_fact persists across the
# role's per-node loop iterations, so a `when` here would leave a non-k3s node
# holding the PREVIOUS node's token — the same stale-registered-value trap as
# ansible/CLAUDE.md "Ansible traps specific to this repo". The k3s block in butane.yaml.j2 is gated on
# k3s_enabled anyway, so the empty values are never rendered.
- name: "{{ hostname }} — resolve the cluster-scoped k3s facts"
  vars:
    cluster_cfg: "{{ clusters[node.cluster] }}"
    # Fleet default, overridable per cluster in inventory/nodes.yml.
    eff_version: "{{ cluster_cfg.k3s_version | default(k3s_version_default) }}"
    # v1.36.2+k3s1 -> v1.36. Derived so minor ⊂ version can't drift; an explicit
    # cluster override still wins, and the assert below covers both paths.
    eff_minor: "{{ cluster_cfg.k3s_minor | default(eff_version.split('.')[0:2] | join('.')) }}"
  ansible.builtin.set_fact:
    k3s_token: "{{ k3s_tokens[node.cluster] | default('') if k3s_enabled | bool else '' }}"
    k3s_tls_sans: "{{ k3s_tls_sans_by_cluster[node.cluster] | default([]) if k3s_enabled | bool else [] }}"
    k3s_version: "{{ eff_version if k3s_enabled | bool else '' }}"
    k3s_minor: "{{ eff_minor if k3s_enabled | bool else '' }}"

# minor ⊂ version, or the sysext seeded at provision time falls outside the
# sysupdate MatchPattern that's supposed to keep it current — the node boots on
# the right k3s and then silently never updates, because `k3s-<minor>.@v` simply
# never matches it.
- name: "{{ hostname }} — assert k3s_minor is the minor series of k3s_version"
  ansible.builtin.assert:
    that:
      - k3s_version.startswith(k3s_minor ~ '.')
    fail_msg: >-
      node '{{ hostname }}' (cluster '{{ node.cluster }}') resolves
      k3s_version='{{ k3s_version }}' but k3s_minor='{{ k3s_minor }}' — the
      version must be inside the minor series. k3s_minor is derived from
      k3s_version by default, so this means an explicit `k3s_minor:` override in
      inventory/nodes.yml disagrees with the version; drop it or correct it.
    quiet: true
  when: k3s_enabled
