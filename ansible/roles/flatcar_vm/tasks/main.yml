---
# Provision one Flatcar VM shell (no k3s). Expects `hostname` (node map key)
# and `node` (its value dict) to be set by the caller. Proxmox API credentials
# are applied via module_defaults (group/community.proxmox.proxmox) in the play.

- name: "{{ hostname }} — preflight + derive facts"
  ansible.builtin.include_tasks: preflight.yml

# --- 1. Render + transpile Ignition (on the control node) ------------------
- name: "{{ hostname }} — create local build dir"
  ansible.builtin.tempfile:
    state: directory
    suffix: "-{{ hostname }}-ign"
  register: build_dir
  delegate_to: localhost
  changed_when: false

- name: "{{ hostname }} — ensure files/ subdir for Butane local references"
  ansible.builtin.file:
    path: "{{ build_dir.path }}/files"
    state: directory
    mode: "0755"
  delegate_to: localhost
  changed_when: false

- name: "{{ hostname }} — render networkd units"
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "{{ build_dir.path }}/files/{{ item | replace('.j2', '') }}"
    mode: "0644"
  loop:
    - 00-eth0.network.j2
    - 10-eth1.network.j2
  delegate_to: localhost
  changed_when: false

# k3s server config + sysupdate transfer config, rendered into files/ so the
# butane.yaml.j2 `contents.local:` refs resolve under --files-dir. Only for k3s
# nodes; a bare VM shell (no role) skips this and its butane k3s block. Names
# here (k3s-config.yaml / k3s-sysupdate.conf) match those local refs exactly.
- name: "{{ hostname }} — render k3s config files"
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ build_dir.path }}/files/{{ item.dest }}"
    mode: "0644"
  loop:
    - { src: k3s-config.yaml.j2, dest: k3s-config.yaml }
    - { src: k3s-sysupdate.conf.j2, dest: k3s-sysupdate.conf }
  loop_control:
    label: "{{ item.dest }}"
  when: k3s_enabled
  delegate_to: localhost
  changed_when: false

- name: "{{ hostname }} — render Butane config"
  ansible.builtin.template:
    src: butane.yaml.j2
    dest: "{{ build_dir.path }}/{{ hostname }}.bu"
    mode: "0644"
  delegate_to: localhost
  changed_when: false

- name: "{{ hostname }} — transpile Butane -> Ignition (--strict)"
  ansible.builtin.command:
    cmd: butane --strict --files-dir {{ build_dir.path }} {{ build_dir.path }}/{{ hostname }}.bu
  register: butane_out
  delegate_to: localhost
  changed_when: false

- name: "{{ hostname }} — write Ignition JSON"
  ansible.builtin.copy:
    content: "{{ butane_out.stdout }}"
    dest: "{{ build_dir.path }}/{{ hostname }}.ign"
    mode: "0644"
  delegate_to: localhost
  changed_when: false

# --- 2. Deliver the Ignition to the Proxmox snippet storage ----------------
# Assert the snippets dir is present AND WRITABLE before we write into it. It's
# created root-owned in one-time host prep (see README "Proxmox SSH access"),
# with the provisioner granted write via the `pve-snippets` group + setgid — so
# DON'T set owner/mode here: as the non-root provisioner a chmod would fail (it
# has write, not ownership).
#
# ⚠ Existence alone is NOT a sufficient check, and that gap cost a debug session
# (2026-08-02). Two compounding reasons:
#   - PVE recreates content subdirectories `root:root 0755` on storage
#     activation, so the dir can exist while having silently lost the group +
#     setgid the upload depends on. One-time host prep is therefore NOT durable
#     state; treat it as a precondition to verify on every run.
#   - `copy` only checks the *directory* when the destination file does not yet
#     exist (it checks the file otherwise), so a stale snippet masks it. It hid
#     behind snoop-a2o's leftover .ign and would otherwise have first appeared
#     on the very first worker node — every node writes a new <hostname>.ign.
# The old `file: state=directory` check passed happily against `root:root 0755`
# and let the run fail four tasks later with copy's "Destination ... not
# writable", which names neither the group nor the README.
- name: "{{ hostname }} — stat the snippet dir on the Proxmox host"
  ansible.builtin.stat:
    path: "{{ proxmox_snippet_dir }}"
  register: snippet_dir
  delegate_to: "{{ proxmox_ssh_host }}"

# Self-repair rather than just fail. Observed twice (2026-08-02 and -03): PVE
# recreates storage content subdirectories as root:root 0755 on storage
# activation — a template rebuild is enough to trigger it — silently undoing the
# group + setgid this upload depends on. Detection alone would mean a manual
# root `chgrp` after every such event, discovered only when a provision fails.
#
# Needs root, so it leans on two FIXED-ARGUMENT sudoers rules added alongside
# the `qm` one (README step 4). sudo matches the whole command line, so these
# cannot chmod another path or chgrp another group — which is also why the
# command below must match the sudoers entry byte-for-byte.
- name: "{{ hostname }} — repair the snippet dir if PVE reset its group/mode"
  when:
    - snippet_dir.stat.exists | default(false)
    - not (snippet_dir.stat.writeable | default(false))
  delegate_to: "{{ proxmox_ssh_host }}"
  block:
    - name: "{{ hostname }} — restore group + setgid on the snippet dir"
      ansible.builtin.command:
        cmd: "{{ item }}"
      loop:
        - "{{ proxmox_sudo }}/usr/bin/chgrp {{ proxmox_snippet_group }} {{ proxmox_snippet_dir }}"
        - "{{ proxmox_sudo }}/usr/bin/chmod {{ proxmox_snippet_mode }} {{ proxmox_snippet_dir }}"
      changed_when: true

    - name: "{{ hostname }} — re-stat the snippet dir after repair"
      ansible.builtin.stat:
        path: "{{ proxmox_snippet_dir }}"
      register: snippet_dir

# Still asserted after the repair — if the repair didn't help (sudoers missing
# on this PVE node, group absent, a genuinely different cause), fail here with
# the manual fix rather than four tasks later inside `copy`.
- name: "{{ hostname }} — assert the snippet dir exists and is writable"
  ansible.builtin.assert:
    that:
      - snippet_dir.stat.exists | default(false)
      - snippet_dir.stat.isdir | default(false)
      - snippet_dir.stat.writeable | default(false)
    quiet: true
    fail_msg: >-
      {{ proxmox_snippet_dir }} on the Proxmox host is not a directory writable
      by '{{ vault_proxmox_ssh_user }}'
      (exists={{ snippet_dir.stat.exists | default('n/a') }},
      isdir={{ snippet_dir.stat.isdir | default('n/a') }},
      writeable={{ snippet_dir.stat.writeable | default('n/a') }}).
      The automatic repair either did not run or did not help — most likely this
      PVE node is missing the chgrp/chmod sudoers rules (they are per-node, and
      easy to add on one host and forget on the others), or the group doesn't
      exist here. Fix ON THE PVE HOST AS ROOT:
      `groupadd -f {{ proxmox_snippet_group }};
      usermod -aG {{ proxmox_snippet_group }} {{ vault_proxmox_ssh_user }};
      chgrp {{ proxmox_snippet_group }} {{ proxmox_snippet_dir }};
      chmod {{ proxmox_snippet_mode }} {{ proxmox_snippet_dir }}`
      — then verify `ls -ld` shows
      `drwxrws--- root {{ proxmox_snippet_group }}`. Group changes apply on the
      next login. See ansible/README.md "Proxmox SSH access" step 4.

# mode 0660, NOT 0644: this .ign embeds the k3s cluster join token
# (k3s-config.yaml.j2 -> `token:`), and anyone holding it can register a node.
# Group `pve-snippets` is inherited from the setgid dir; PVE itself reads the
# snippet as root, so nothing needs world-read. The dir's 2770 already blocks
# traversal, but that's exactly the state PVE can silently reset (see above) —
# so don't let the file's own mode be the thing that leaks it when it does.
- name: "{{ hostname }} — upload Ignition snippet to Proxmox host"
  ansible.builtin.copy:
    src: "{{ build_dir.path }}/{{ hostname }}.ign"
    dest: "{{ proxmox_snippet_dir }}/{{ hostname }}.ign"
    mode: "0660"
  delegate_to: "{{ proxmox_ssh_host }}"

# --- 3. Clone the template + shape the VM ----------------------------------
- name: "{{ hostname }} — clone Flatcar template -> VM {{ vmid }}"
  community.proxmox.proxmox_kvm:
    node: "{{ proxmox_node }}"
    clone: "{{ flatcar_template_name }}"   # source template (by name)
    name: "{{ hostname }}"
    newid: "{{ vmid }}"
    full: true
    storage: "{{ proxmox_vm_storage }}"
    timeout: 300
  register: clone_result

- name: "{{ hostname }} — configure CPU/RAM (NICs set separately via qm, see below)"
  community.proxmox.proxmox_kvm:
    node: "{{ proxmox_node }}"
    vmid: "{{ vmid }}"
    update: true
    cores: "{{ node.cores | default(4) }}"
    memory: "{{ node.memory_mb | default(8192) }}"
    cpu: host
    scsihw: virtio-scsi-single
    agent: "enabled=1"
    onboot: true

# proxmox_kvm's `update: true` raises KeyError('net1') when it has to ADD a NIC
# the cloned VM doesn't have yet (the template ships net0 only, so net1 is new;
# the module's diff looks up the not-yet-existing 'net1' and blows up). The
# purpose-built proxmox_nic module manages one interface at a time over the API
# (no SSH, scoped token, inherits api_* from module_defaults), sidestepping that
# bug — it overwrites net0 (re-pinning the MAC + DMZ tag onto the cloned NIC)
# and adds net1 with the Ceph-public tag + jumbo MTU. Needs VM.Config.Network +
# SDN.Use (both on the Provisioning role).
- name: "{{ hostname }} — set NICs via proxmox_nic (MACs pinned, eth1 tagged + jumbo)"
  community.proxmox.proxmox_nic:
    vmid: "{{ vmid }}"
    interface: "{{ item.interface }}"
    bridge: "{{ item.bridge }}"
    mac: "{{ item.mac }}"
    tag: "{{ item.tag }}"
    mtu: "{{ item.mtu | default(omit) }}"
    state: present
  loop:
    - interface: net0            # DMZ / cluster-facing — default MTU (1500)
      bridge: "{{ dmz_network.bridge }}"
      mac: "{{ eth0_mac }}"
      tag: "{{ dmz_network.vlan }}"
    - interface: net1            # Ceph public — tagged VLAN + jumbo frames
      bridge: "{{ ceph_public_network.bridge }}"
      mac: "{{ eth1_mac }}"
      tag: "{{ ceph_public_network.vlan }}"
      mtu: "{{ ceph_public_network.mtu }}"
  loop_control:
    label: "{{ item.interface }}"

- name: "{{ hostname }} — attach data disk (virtio1 -> /dev/vdb)"
  community.proxmox.proxmox_disk:
    vmid: "{{ vmid }}"
    disk: virtio1
    storage: "{{ proxmox_vm_storage }}"
    size: "{{ node.data_disk_gb | default(100) }}"
    backup: false
    create: regular

# The installed community.proxmox.proxmox_kvm DOES expose cicustom (unlike the
# older version the design doc assumed), so set it over the API — scoped token,
# no SSH, no root@pam (design doc §3.4 / Appendix A). Requires a cloud-init drive
# on the template (present) and the snippet already uploaded (above). FALLBACK:
# if a PVE build ever rejects cicustom-over-API for a non-root token, revert this
# to a delegated `{{ proxmox_qm }} set {{ vmid }} --cicustom ...` over SSH.
- name: "{{ hostname }} — attach Ignition via cicustom (proxmox_kvm/API)"
  community.proxmox.proxmox_kvm:
    node: "{{ proxmox_node }}"
    vmid: "{{ vmid }}"
    update: true
    cicustom: "user={{ proxmox_snippet_storage }}:snippets/{{ hostname }}.ign"

# --- 4. Boot -----------------------------------------------------------------
- name: "{{ hostname }} — ensure VM is running"
  community.proxmox.proxmox_kvm:
    node: "{{ proxmox_node }}"
    vmid: "{{ vmid }}"
    state: started

- name: "{{ hostname }} — clean up local build dir"
  ansible.builtin.file:
    path: "{{ build_dir.path }}"
    state: absent
  delegate_to: localhost
  changed_when: false
