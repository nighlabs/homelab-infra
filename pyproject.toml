# Control-node Python toolchain for this repo, managed with uv.
#
# This is NOT an application — it's just the pinned set of tools the Ansible
# control node needs to provision the cluster. uv owns the interpreter
# (.python-version), the venv (.venv/), and the lockfile (uv.lock).
#
# Bootstrap:  uv sync
# Run:        uv run ansible-playbook ansible/site.yml
#
# This covers ONLY the Python deps. The external binaries (butane, helm, …) and
# Ansible collections (community.proxmox, kubernetes.core) are installed
# separately — see "Control-node prerequisites" in ansible/README.md for the
# full, authoritative list.
[project]
name = "homelab-infra"
version = "0"
description = "Control-node Python toolchain for Flatcar/Proxmox Ansible provisioning"
requires-python = ">=3.12"
dependencies = [
    # Ansible itself. ansible-core (not the batteries-included `ansible`) — we
    # only need builtin modules plus the community.proxmox collection, which is
    # pinned in ansible/requirements.yml and installed via ansible-galaxy.
    "ansible-core>=2.17",
    # Required on the control node by the community.proxmox modules
    # (proxmox_kvm / proxmox_disk); they import these at runtime, not parse time.
    "proxmoxer>=2.0",
    "requests>=2.31",
    # Required by the kubernetes.core modules (helm / k8s_info) used in
    # playbooks/bootstrap-cluster.yml to prime Calico and wait for node Ready.
    # (The `helm` CLI is a separate Go binary — see the header note.)
    "kubernetes>=30.1",
    # Bitwarden Secrets Manager SDK — used by library/bws_secrets.py to fetch
    # every secret in one call at run time (there is no vault.yml; see Appendix A
    # "Control-node secrets" in docs/mac-studio-inference-stack-2.md).
    # ⚠ Pinned to a major, deliberately: bitwarden/sm-ansible#59 is an open
    # SDK-compatibility issue, so this must not float.
    "bitwarden-sdk>=1.0.0,<2.0.0",
]

# Keep uv from trying to build/install this repo itself as a package — it's a
# toolchain env, not a distributable. (No build backend, nothing to package.)
[tool.uv]
package = false
